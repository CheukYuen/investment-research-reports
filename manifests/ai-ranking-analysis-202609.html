收紧、30个省市已试点现房销售且未产生实质冲击、政策不搞\"一刀切\"（已获规划许可项目按原规则执行，各城市自行决定实施时间表）","长期将促进行业更健康发展：加速供需再平衡（土地销售预计进一步放缓）、推动开发商整合、更好保障银行体系安全","开发贷款期限最长可延长至7年（目前3年），本金偿还可推迟至项目竣工后，有助于缓解开发商资金压力","按揭贷款最长期限延长至40年（目前30年），假设100万元贷款、85%LTV、3%利率，月供减少幅度相当于家庭可支配收入的高个位数百分比"],"content_tags":["rating_valuation","supply_demand","catalysts_risks"],"topics":["房地产政策","现房销售"],"data_points":[{"metric":"政策发布日期","value_text":"2026","period":"2026年","basis":"actual","context":"政策发布日期：2026年8月28日（实际）"},{"metric":"按揭贷款最长期限","value_text":"40","period":"","basis":"guidance","context":"按揭贷款最长期限：延长至40年（目前30年）（政策指引）"},{"metric":"开发贷款最长期限","value_text":"7","period":"","basis":"guidance","context":"开发贷款最长期限：延长至7年（目前3年）（政策指引）"},{"metric":"土地成交量较2020年峰值降幅（2025年）","value_text":"72%","period":"2020年","basis":"actual","context":"土地成交量较2020年峰值降幅（2025年）：下降72%（实际）"},{"metric":"土地成交额较2020年峰值降幅（2025年）","value_text":"64%","period":"2020年","basis":"actual","context":"土地成交额较2020年峰值降幅（2025年）：下降64%（实际）"},{"metric":"2026年前7个月土地成交量同比降幅","value_text":"26%","period":"2026年","basis":"actual","context":"2026年前7个月土地成交量同比降幅：26%（实际）"}],"entities":["住建部（MOHURD）","自然资源部","国家金融监督管理总局（NFRA）","中国人民银行（PBOC）","中国证监会（CSRC）","华润置地","CRL","中海地产","COLI","金茂"],"evidence":[],"reasons":["正文无AI基础设施相关证据，纯房地产政策分析。"],"ranking_evidence":["按揭贷款最长期限延长至40年","开发贷款期限延长至7年"],"false_positive_checks":["无AI基建内容。"],"failure_code":"","downloaded":false,"download_href":"","llm_model":"deepseek-v4-flash","ranked_at":"2026-09-02T13:53:25.027Z"},{"media_id":"pdf_19ee3075e13eb6fc6b0a6821afb4b957_3987cc579239380bc56e56c17e68ad817442602265681522","title":"花旗-爱尔眼科(300015.SZ)：2026年上半年业绩不及预期主因税项影响；海外扩张支撑中期增长-260831.pdf","source_path":"环球研报直通车 / 2026年国际顶级投行研报 / 9月 / 9.2 / 花旗-爱尔眼科(300015.SZ)：2026年上半年业绩不及预期主因税项影响；海外扩张支撑中期增长-260831.pdf","local_relative_path":"2026/9月/9.2/花旗-爱尔眼科(300015.SZ)：2026年上半年业绩不及预期主因税项影响；海外扩张支撑中期增长-260831.pdf","saved_path":"/Users/leon/Stock/investment-research-reports/downloads/2026/9月/9.2/花旗-爱尔眼科(300015.SZ)：2026年上半年业绩不及预期主因税项影响；海外扩张支撑中期增长-260831.pdf","snapshot_date":"2026-09-02","priority":"P3","rank":51,"score":5,"report_type":"company","report_type_label":"公司研究","report_type_reason":"报告主要结论锚定爱尔眼科单一公司，给予买入评级和目标价，属于公司研究。","sectors":[{"name_cn":"医药卫生","name_en":"Health Care"}],"research_subject":"","executive_summary":"花旗研报指出，爱尔眼科2026年上半年营收同比增长3.8%至119.5亿元，低于花旗预期3%和一致预期5%；净利润同比下滑33.8%至13.6亿元，低于预期约40%，主因7.56亿元补缴税款及滞纳金，剔除后归母利润实际同比增长约3%。毛利率同比降2.5个百分点至46.1%，受维护成本、人员薪酬及新设备折旧拖累，但营业利润率基本稳定在23.6%。门诊量增长8.3%，但手术量仅增长1.1%，反映国内消费需求持续疲软。管理层预计2026年下半年好于上半年，毛利率保持基本稳定，新技术支撑屈光手术单价适度提升。海外扩张是中期核心增长动力：欧洲下半年维持双位数增长，巴西业务2026年8-9月并表，管理层指引未来三年海外收入占比超30%。花旗维持买入评级，基于DCF模型将目标价从13.5元下调至12.0元，反映FY26补税影响及巴西较低毛利率。","key_findings":["1H26净利润同比降33.8%主要受7.56亿元补税一次性冲击，剔除后实际利润增约3%，核心经营面基本平稳","海外扩张（欧洲、巴西、英国）是中期增长的核心驱动力，管理层指引三年内海外收入占比超30%","国内技术升级（SMILE Pro、EVO ICL V5等）带来33%-175%的定价溢价，形成竞争对手难以复制的护城河","1+8+N医院建设接近完成，折旧摊销压力预计从FY26E见顶回落，290家早期医院同店增长空间巨大"],"content_tags":["industry_structure"],"topics":["眼科医疗","业绩"],"data_points":[{"metric":"1H26营收","value_text":"119.5亿","period":"","basis":"actual","context":"1H26营收：119.5亿元，同比增长3.8%（实际值，低于花旗预期3%）"},{"metric":"1H26净利润","value_text":"13.6亿","period":"","basis":"actual","context":"1H26净利润：13.6亿元，同比下降33.8%（实际值，低于花旗预期40%）"},{"metric":"补缴税款及滞纳金","value_text":"7.56亿","period":"","basis":"","context":"补缴税款及滞纳金：7.56亿元（一次性影响）"},{"metric":"毛利率","value_text":"46.1%","period":"","basis":"actual","context":"毛利率：46.1%，同比下滑2.5个百分点（实际值）"},{"metric":"营业利润率","value_text":"23.6%","period":"","basis":"actual","context":"营业利润率：23.6%（实际值，基本稳定）"},{"metric":"门诊量增长","value_text":"8.3%","period":"","basis":"actual","context":"门诊量增长：8.3%；手术量增长：1.1%（实际值，1H26）"}],"entities":["公司：爱尔眼科（Aier Eye Hospital Group","300015.SZ）","Clínica Baviera","产品","技术：SMILE Pro（Zeiss VisuMax 800）","Precise 4.0（VISULYZE）","EVO ICL V5","AierGPT","行业：眼科医疗服务","医疗连锁"],"evidence":[],"reasons":["正文无AI基础设施相关内容","属于医药行业，与AI基建无关"],"ranking_evidence":["1H26营收119.5亿元，净利润13.6亿元","目标价12.0元"],"false_positive_checks":["无AI相关证据"],"failure_code":"","downloaded":false,"download_href":"","llm_model":"deepseek-v4-flash","ranked_at":"2026-09-02T13:53:25.027Z"},{"media_id":"pdf_19ee3075e13eb6fc6b0a6821afb4b957_92c84878824466a41acc5c3f7d1db2c97442602265681522","title":"花旗-瑞博生物(6938.HK)2026年上半年业绩：高差异化管线获验证，成功扭亏为盈-260831.pdf","source_path":"环球研报直通车 / 2026年国际顶级投行研报 / 9月 / 9.2 / 花旗-瑞博生物(6938.HK)2026年上半年业绩：高差异化管线获验证，成功扭亏为盈-260831.pdf","local_relative_path":"2026/9月/9.2/花旗-瑞博生物(6938.HK)2026年上半年业绩：高差异化管线获验证，成功扭亏为盈-260831.pdf","saved_path":"/Users/leon/Stock/investment-research-reports/downloads/2026/9月/9.2/花旗-瑞博生物(6938.HK)2026年上半年业绩：高差异化管线获验证，成功扭亏为盈-260831.pdf","snapshot_date":"2026-09-02","priority":"P3","rank":52,"score":5,"report_type":"company","report_type_label":"公司研究","report_type_reason":"报告主要结论锚定瑞博生物单一公司，给予买入评级和目标价，属于公司研究。","sectors":[{"name_cn":"医药卫生","name_en":"Health Care"}],"research_subject":"","executive_summary":"花旗研报指出，瑞博生物2026年上半年实现营收4.2亿元（同比大增304%），录得净利润2,000万元（1H25为净亏损8,800万元），首次扭亏为盈，主要受Madrigal、勃林格殷格翰和齐鲁制药等合作伙伴的首付款及里程碑付款驱动。研发费用增至1.98亿元（+53%），因管线及适应症扩展。核心管线进展顺利：vortosiran的Ph2a试验在30例CAD患者中显示400mg剂量下FXI活性平均降低92%，安全性良好；SPAF和VTE的Ph2b如期推进，预计2H27-2H28数据读出。BD5044在TG/ApoC3降低方面展现同类最佳潜力（最大降幅75%/84%），中国Ph2患者入组完成，预计2H26数据读出；肝外递送临床前数据积极，额外肝外递送平台更新预计4Q26发布，首个肾脏定向项目CTA预计1H27提交。花旗认为首次盈利来自合作验证了公司高度差异化的管线与强大的临床能力。基于BD进展上调FY26/27营收预测344%/131%，将EPS预测从-2.27/-2.67元上调至-0.95/-2.59元，目标价从102港元下调至96港元，维持买入/高风险评级。","key_findings":["1H26首次实现扭亏为盈（净利润2,000万元），合作首付款及里程碑付款验证了差异化管线价值和临床能力","核心管线vortosiran Ph2a数据优异（FXI活性降92%），BD5044展现同类最佳潜力，肝外递送平台为关键价值催化剂","花旗上调FY26/27营收预测344%/131%，但目标价因摊薄等因素从102港元微调至96港元"],"content_tags":["catalysts_risks"],"topics":["生物医药","业绩"],"data_points":[{"metric":"1H26营收","value_text":"4.2亿","period":"","basis":"actual","context":"1H26营收：4.2亿元，同比增长304%（实际值）"},{"metric":"1H26净利润","value_text":"2,000万","period":"","basis":"actual","context":"1H26净利润：2,000万元（实际值，1H25净亏损8,800万元）"},{"metric":"1H26研发费用","value_text":"1.98亿","period":"","basis":"actual","context":"1H26研发费用：1.98亿元，同比增长53%（实际值）"},{"metric":"vortosiran Ph2a","value_text":"400","period":"" :"报告聚焦日本汽车行业在人形机器人领域的机遇，属于行业研究。","sectors":[{"name_cn":"工业","name_en":"Industrials"},{"name_cn":"信息技术","name_en":"Information Technology"}],"research_subject":"","executive_summary":"高盛2026年8月31日发布日本汽车行业深度报告，大幅上调人形机器人市场预测，2035年销量从138万部上调至648万部，市场规模从约¥6万亿上调至$1,380亿（约¥22万亿）。报告认为汽车行业规模化量产复杂工业产品的能力使其在量产人形机器人方面具备独特优势。高盛从\"Will（意愿）\"、\"Should（必要性）\"、\"Could（能力）\"三维度对全球OEM评分，特斯拉和现代最为积极，日系车企中丰田、本田、三菱汽车相对领先。日本在FA领域拥有全球30-40%份额，但人形机器人领域落后于美国、中国和韩国。波士顿动力Atlas的BOM成本中，执行器占52%、夹爪占32%，执行器组件（电机、轴承、编码器、减速器、驱动器）与传统汽车零部件高度契合。丰田集团同时具备\"需求（劳动力短缺）、紧迫性（BEV转型供应链下滑）、技术（软硬件及量产能力）、承诺（管理层定位）\"四大要素，若技术突破和量产顺利，2035年可达19-54万部人形机器人产量（全球3-8%份额），贡献毛利润增量2-6%。日本政府已设定2040年1,000万台AI机器人目标，预算框架超¥1万亿。报告指出主要风险：过度依赖现场数据、海外基础模型依赖以及传统FA经验不可复制。","key_findings":["高盛大幅上调2035年人形机器人销量预测至648万部（此前138万部），市场规模$1,380亿（此前约¥6万亿）","汽车行业在量产人形机器人方面具备独特优势，执行器/减速器等核心部件与传统汽车零部件高度契合","特斯拉、现代最积极，日系中丰田、本田、三菱汽车相对领先；丰田集团2035年可达19-54万部产量","日本政府设定2040年1,000万台AI机器人目标，预算¥1万亿以上"],"content_tags":[],"topics":["人形机器人","汽车行业","物理AI"],"data_points":[{"metric":"2035年人形机器人销量预测648万部（此前13","value_text":"2035","period":"2035年","basis":"forecast","context":"2035年人形机器人销量预测648万部（此前138万部），预测"},{"metric":"2035年市场规模$1,380亿（约¥22万亿，","value_text":"2035","period":"2035年","basis":"forecast","context":"2035年市场规模$1,380亿（约¥22万亿，此前约¥6万亿），预测"},{"metric":"日本FA（工厂自动化）全球市场份额30-40%，","value_text":"30","period":"","basis":"actual","context":"日本FA（工厂自动化）全球市场份额30-40%，实际"},{"metric":"日本政府目标","value_text":"2030","period":"2030年","basis":"guidance","context":"日本政府目标：2030年导入35万台AI机器人，2040年1,000万台，指引"},{"metric":"支持预算框架超¥1万亿，指引","value_text":"1万亿","period":"","basis":"guidance","context":"支持预算框架超¥1万亿，指引"},{"metric":"波士顿动力Atlas BOM","value_text":"52%","period":"","basis":"actual","context":"波士顿动力Atlas BOM：执行器52%、夹爪32%、NVIDIA半导体4%、传感器2%、电池1%，实际"}],"entities":["丰田汽车","本田","三菱汽车","日产汽车","特斯拉","现代","波士顿动力","Agility Robotics","瑞萨电子","NEC"],"evidence":[],"reasons":["正文明确以人形机器人核心硬件（执行器、减速器等）为主要投资逻辑，属于AI基础设施范畴。"],"ranking_evidence":["2035年人形机器人销量预测648万部，市场规模$1,380亿","执行器占BOM成本52%，与传 ked_at":"2026-09-01T13:53:01.461Z"},{"media_id":"pdf_19ee3075e13eb6fc6b0a6821afb4b957_48b04c465917dcdae77388b3371af7057442602265681522","title":"高盛-快手科技（1024.HK）投资者日要点：社区韧性、AI期权价值，以及更节制的资本开支路径-260831.pdf","source_path":"环球研报直通车 / 2026年国际顶级投行研报 / 9月 / 9.1 / 高盛-快手科技（1024.HK）投资者日要点：社区韧性、AI期权价值，以及更节制的资本开支路径-260831.pdf","local_relative_path":"2026/9月/9.1/高盛-快手科技（1024.HK）投资者日要点：社区韧性、AI期权价值，以及更节制的资本开支路径-260831.pdf","saved_path":"/Users/leon/Stock/investment-research-reports/downloads/2026/9月/9.1/高盛-快手科技（1024.HK）投资者日要点：社区韧性、AI期权价值，以及更节制的资本开支路径-260831.pdf","snapshot_date":"2026-09-01","priority":"P2","rank":18,"score":45,"report_type":"company","report_type_label":"公司研究","report_type_reason":"报告聚焦快手科技投资者日要点，涉及公司战略与估值，属于公司研究。","sectors":[{"name_cn":"通信服务","name_en":"Communication Services"}],"research_subject":"","executive_summary":"高盛2026年8月31日发布快手科技投资者日要点分析。快手仍对短视频社区韧性保持信心，\"老铁\"文化根深蒂固，但增长重心转向从每日两小时用户时长中提取更大商业价值。电商近期展望谨慎，消费疲软叠加合规成本上升，管理层尚不能确定何时触底，但希望2027年看到复苏迹象，约70%活跃商家为中小长尾商家。Kling AI为关键战略上行机会，约70%业务来自海外，管理层预计未来1-2个月内完成独立融资，融资后Kling将转向轻资产算力租赁模式，可降低集团未来AI资本开支强度并缓解自由现金流压力，同时Kling仍将并表。高盛维持中性评级，目标价HK$38（13x 2027E P/E，上行空间13.6%），认为AI期权价值与更节制的资本开支路径为积极因素，但电商复苏时点和AI变现节奏为关键不确定性。","key_findings":["短视频社区韧性获确认，增长重心转向提升每日2小时用户时长的商业价值","电商近期谨慎、无复苏迹象，约70%活跃商家为长尾商家，管理层希望2027年见复苏迹象","Kling AI为关键上行机会，约70%业务来自海外，预计1-2个月内完成独立融资","Kling融资后转向轻资产算力租赁模式，可降低集团AI资本开支强度，仍将并表"],"content_tags":["rating_valuation"],"topics":["短视频","AI"],"data_points":[{"metric":"目标价HK$38，基于13x 2027E P/E","value_text":"38","period":"2027E","basis":"forecast","context":"目标价HK$38，基于13x 2027E P/E，估值"},{"metric":"当前股价HK$33.46（2026年8月28日收","value_text":"33.46","period":"2026年","basis":"actual","context":"当前股价HK$33.46（2026年8月28日收盘），上行空间13.6%，实际"},{"metric":"市值HK$1,443亿（$184亿），实际","value_text":"1,443亿","period":"","basis":"actual","context":"市值HK$1,443亿（$184亿），实际"},{"metric":"企业价值HK$670亿（$85亿），实际","value_text":"670亿","period":"","basis":"actual","context":"企业价值HK$670亿（$85亿），实际"},{"metric":"Kling约70%业务来自海外，实际/指引","value_text" 821afb4b957_4a031b39c7e3d5d48e0ddc969fe0701a7442602265681522","title":"巴克莱-中国房地产：1999年以来规模最大的住房改革-260831.pdf","source_path":"环球研报直通车 / 2026年国际顶级投行研报 / 9月 / 9.1 / 巴克莱-中国房地产：1999年以来规模最大的住房改革-260831.pdf","local_relative_path":"2026/9月/9.1/巴克莱-中国房地产：1999年以来规模最大的住房改革-260831.pdf","saved_path":"/Users/leon/Stock/investment-research-reports/downloads/2026/9月/9.1/巴克莱-中国房地产：1999年以来规模最大的住房改革-260831.pdf","snapshot_date":"2026-09-01","priority":"P3","rank":23,"score":10,"report_type":"industry","report_type_label":"行业研究","report_type_reason":"报告分析中国住房改革对房地产行业的影响，属于行业研究。","sectors":[{"name_cn":"房地产","name_en":"Real Estate"}],"research_subject":"","executive_summary":"巴克莱认为2026年8月28日中国监管机构公布的住房销售和融资改革是自1994年引入预售、1998-99年设定30年按揭上限及废除福利分房制度以来最重大的住房改革。改革四大支柱包括：1）提高预售门槛、逐步转向现房销售；2）引入主办银行制度，银行全程监督项目融资和现金流；3）按揭期限从30年延长至40年，收紧预售项目按揭放款条件；4）支持上市开发商再融资和并购，扩大REITs、CMBS、ABS及私募房地产基金渠道。核心影响是将开发风险从购房者向开发商和金融体系重新分配——若预售资金缺口完全由债务填补，开发商净杠杆率平均上升约41个百分点。巴克莱基准情景（假设销售无实质复苏）下，行业将呈现结构性高杠杆和低资产周转率运营特征。债券方面增持龙湖、瑞安房地产、中国金茂、绿城。短期对开发商和债券持有人构成信用负面，长期有利于金融稳定和项目交付。","key_findings":["改革将行业从\"开发商信用+购房者出资\"转向\"银行监督+项目制融资\"体系，风险从购房者向开发商和金融体系重新分配","若资金缺口完全由债务填补，开发商净杠杆率平均上升约41个百分点","基准情景（销售无实质复苏）下行业将呈现结构性高杠杆和低资产周转率","债券方面增持龙湖（Longfor '29s YTW 9.1%）、瑞安房地产、中国金茂、绿城"],"content_tags":["macro_policy"],"topics":["住房改革","开发商杠杆","债券投资"],"data_points":[{"metric":"基准情景（资金缺口50%债务+50%股权填补）","value_text":"5个百分点","period":"","basis":"forecast","context":"基准情景（资金缺口50%债务+50%股权填补）：净负债率平均上升约5个百分点，总杠杆平均上升约25%，预测"},{"metric":"不利情景（资金缺口完全由债务填补）","value_text":"41个百分点","period":"","basis":"forecast","context":"不利情景（资金缺口完全由债务填补）：净负债率平均上升约41个百分点，总杠杆平均上升约49%，预测"},{"metric":"龙湖 Longfor '29s中期收益率9.1%","value_text":"29","period":"","basis":"valuation","context":"龙湖 Longfor '29s中期收益率9.1%，估值"},{"metric":"龙湖 Longfor '32s中期收益率9.3%","value_text":"32","period":"","basis":"valuation","context":"龙湖 Longfor '32s中期收益率9.3%，估值"},{"metric":"瑞安房地产 Shui On Land '29s中","value_text":"29","period":"","basis":"valuation","context":"瑞安房地产 Shui On Land '29s中期收益率8.8%，估值 :"2026-09-01","priority":"P3","rank":34,"score":10,"report_type":"company","report_type_label":"公司研究","report_type_reason":"报告聚焦蜜雪集团单公司业绩、评级与目标价，属于公司研究。","sectors":[{"name_cn":"主要消费","name_en":"Consumer Staples"}],"research_subject":"","executive_summary":"高盛2026年8月31日发布蜜雪集团业绩回顾，认为公司处于新投资周期转型期，1H26业绩不及预期主要因供应链升级投入、竞争加剧及去年配送补贴高基数。管理层将战略重心从门店扩张速度转向增长质量，未来约3年将密集投资于供应链升级、门店运营和品牌IP，目标实现产品品质和消费体验的世代升级，同时通过规模效应和数字化消化成本，坚持\"提质不提价\"策略。中国蜜雪平均门店销售额1H26同比下滑双位数，门店扩张放缓为长期战略转变；海外越南/印尼调整导致1H26净关店，但积极效果已现，预计2027年恢复积极开店。高盛下调2026-28E盈利预测16-20%，目标价从HK$450大幅下调至HK$285（基于2026E PE 17x，此前24x，反映增长放缓），但维持买入评级，认为更弱的盈利展望已反映在股价中（过去6个月下跌41%），产品品质、数字化运营和品牌建设将巩固长期护城河。管理层对茶咖融合持积极态度，通过蜜雪（现磨咖啡，高频日常咖啡）和幸运咖（专业多元化咖啡）双品牌布局。","key_findings":["1H26业绩不及预期，管理层进入约3年新投资周期，优先保障增长质量而非门店扩张速度","供应链升级（鲜奶、短保咖啡豆、现磨咖啡机）覆盖>6,000家门店，目标2028年全国覆盖","高盛下调2026-28E盈利预测16-20%，目标价从HK$450降至HK$285（PE 24x→17x）","维持买入评级，认为股价已反映更弱盈利展望（过去6个月-41%）"],"content_tags":[],"topics":["现制茶饮","业绩回顾"],"data_points":[{"metric":"1H26 EPS Rmb6.45（12/25为R","value_text":"1","period":"","basis":"actual","context":"1H26 EPS Rmb6.45（12/25为Rmb8.64），实际"},{"metric":"中国蜜雪平均门店销售额1H26同比下滑双位数，实","value_text":"1","period":"","basis":"actual","context":"中国蜜雪平均门店销售额1H26同比下滑双位数，实际"},{"metric":"2026E收入Rmb33,950mn（旧预测Rm","value_text":"2026","period":"2026E","basis":"forecast","context":"2026E收入Rmb33,950mn（旧预测Rmb37,678mn），预测"},{"metric":"2027E收入Rmb38,000mn（旧预测Rm","value_text":"2027","period":"2027E","basis":"forecast","context":"2027E收入Rmb38,000mn（旧预测Rmb42,957mn），预测"},{"metric":"2028E收入Rmb42,026mn（旧预测Rm","value_text":"2028","period":"2028E","basis":"forecast","context":"2028E收入Rmb42,026mn（旧预测Rmb48,855mn），预测"},{"metric":"2026E EPS Rmb14.22（旧预测Rm","value_text":"2026","period":"2026E","basis":"forecast","context":"2026E EPS Rmb14.22（旧预测Rmb15.93），预测"}],"entities":["蜜雪集团（Mixue Group","2097.HK）","幸运咖（Lucky Cup）","现制茶饮","现磨咖啡","供应链","数字化运营","品牌IP","中国","越南"],"evidence":[],"reasons":["正文无AI基建相关证据，属于消费行业。","供应链升级、门店扩张等均与AI基础设施无关。"],"ranking_evidence":["1H26业绩不及预期","目标价从HK$450   <script>
    const records = JSON.parse(document.getElementById('records').textContent);
    const priorities = ["P0","P1","P2","P3","UNREVIEWED"];
    const state = { search: '', priority: '', date: '', reportType: '', sector: '', local: '' };
    const els = {
      search: document.getElementById('search'),
      priority: document.getElementById('priority'),
      date: document.getElementById('date'),
      reportType: document.getElementById('reportType'),
      sector: document.getElementById('sector'),
      local: document.getElementById('local'),
      groups: document.getElementById('groups'),
      resultCount: document.getElementById('result-count'),
    };
    const escapeHtml = (value) => String(value ?? '').replace(/[&<>"']/g, (char) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
    }[char]));
    const unique = (values) => [...new Set(values.filter(Boolean))].sort((a, b) => String(a).localeCompare(String(b), 'zh-Hans-CN'));
    const addOptions = (el, values) => values.forEach((value) => {
      const option = document.createElement('option');
      option.value = value;
      option.textContent = value;
      el.appendChild(option);
    });
    addOptions(els.priority, priorities.filter((priority) => records.some((record) => record.priority === priority)));
    addOptions(els.date, unique(records.map((record) => record.snapshot_date)).reverse());
    addOptions(els.reportType, unique(records.map((record) => record.report_type_label)));
    addOptions(els.sector, unique(records.flatMap((record) => (record.sectors || []).map((sector) => sector.name_cn))));

    function textBlob(record) {
      return [
        record.title, record.research_subject, record.executive_summary, record.source_path,
        record.report_type_reason,
        ...(record.key_findings || []), ...(record.content_tags || []), ...(record.topics || []),
        ...(record.entities || []), ...(record.reasons || []), ...(record.ranking_evidence || []),
        ...(record.sectors || []).flatMap((sector) => [sector.name_cn, sector.name_en]),
        ...(record.data_points || []).flatMap((point) => [point.metric, point.value_text, point.period, point.context]),
      ].join(' ').toLowerCase();
    }
    function filtered() {
      const query = state.search.trim().toLowerCase();
      return records.filter((record) => {
        if (state.priority && record.priority !== state.priority) return false;
        if (state.date && record.snapshot_date !== state.date) return false;
        if (state.reportType && record.report_type_label !== state.reportType) return false;
        if (state.sector && !(record.sectors || []).some((sector) => sector.name_cn === state.sector)) return false;
        if (state.local === 'yes' && !record.downloaded) return false;
        if (state.local === 'no' && record.downloaded) return false;
        return !query || textBlob(record).includes(query);
      });
    }
    function renderTags(items) {
      return (items || []).map((item) => '<span class="tag">' + escapeHtml(item) + '</span>').join('');
    }
    function renderCard(record) {
      const local = record.downloaded ? '<span class="badge local">本地已有</span>' : '';
      const link = record.download_href ? '<a href="' + escapeHtml(record.download_href) + '">打开本地 PDF</a>' : '尚未下载';
      const findings = record.key_findings.length
        ? '<ul class="findings">' + record.key_findings.map((item) => '<li>' + escapeHtml(item) + '</li>').join('') + '</ul>'
        : '';
      const numbers = record.data_points.length
        ? '<div class="numbers">' + record.data_points.map((point) =>
            '<div class="number"><strong>' + escapeHtml(point.metric) + '</strong>' +
            escapeHtml([point.value_text, point.period, point.basis].filter(Boolean).join(' · ')) +
            (point.context ? '<div>' + escapeHtml(point.context) + '</div>' : '') + '</div>'
          ).join('') + '</div>'
        : '';
      const evidence = record.ranking_evidence.length
        ? '<div class="evidence">排序证据：' + escapeHtml(record.ranking_evidence.join(' / ')) + '</div>'
        : '';
      const failure = record.failure_code ? '<div class="evidence">状态：' + escapeHtml(record.failure_code) + '</div>' : '';
      const sectorNames = (record.sectors || []).map((sector) => sector.name_cn);
      return '<article class="card">' +
        '<div class="rank"><strong>#' + escapeHtml(record.rank ?? '-') + '</strong><span>当日排序</span></div>' +
        '<div><div class="meta"><span class="badge ' + record.priority.toLowerCase() + '">' + escapeHtml(record.priority) + '</span>' +
        local + '<span class="tag">score ' + escapeHtml(record.score ?? '-') + '</span><span class="tag">' + escapeHtml(record.report_type_label) + '</span></div>' +
        '<h3 class="title">' + escapeHtml(record.title) + '</h3>' +
        (record.research_subject ? '<div class="subject">研究主体：' + escapeHtml(record.research_subject) + '</div>' : '') +
        (sectorNames.length ? '<div class="tags">' + renderTags(sectorNames) + '</div>' : '') +
        (record.report_type_reason ? '<div class="reason">类型依据：' + escapeHtml(record.report_type_reason) + '</div>' : '') +
        '<div class="tags">' + renderTags([...(record.content_tags || []), ...(record.topics || [])]) + '</div>' +
        (record.reasons.length ? '<div class="reason">排序理由：' + escapeHtml(record.reasons.join('；')) + '</div>' : '') +
        (record.executive_summary ? '<p class="summary"><strong>IMA 摘要：</strong>' + escapeHtml(record.executive_summary) + '</p>' : '') +
        findings + numbers +
        (record.entities.length ? '<div class="tags">' + renderTags(record.entities) + '</div>' : '') +
        evidence + failure +
        '<div class="path">IMA 路径：' + escapeHtml(record.source_path) + '</div>' +
        '<div class="path">本地路径：' + escapeHtml(record.local_relative_path) + ' · ' + link + '</div></div></article>';
    }
    function render() {
      const rows = filtered();
      els.resultCount.textContent = rows.length;
      const groups = new Map();
      for (const record of rows) {
        if (!groups.has(record.snapshot_date)) groups.set(record.snapshot_date, []);
        groups.get(record.snapshot_date).push(record);
      }
      els.groups.innerHTML = [...groups.entries()].map(([date, dayRows]) => {
        const stats = priorities
          .map((priority) => [priority, dayRows.filter((record) => record.priority === priority).length])
          .filter(([, count]) => count)
          .map(([priority, count]) => '<span class="badge ' + priority.toLowerCase() + '">' + priority + ' ' + count + '</span>')
          .join('');
        return '<section class="day-group"><div class="day-head"><h2>' + escapeHtml(date) + '</h2>' +
          '<div class="day-stats">' + stats + '<span class="tag">合计 ' + dayRows.length + '</span></div></div>' +
          '<div class="cards">' + dayRows.map(renderCard).join('') + '</div></section>';
      }).join('') || '<div class="day-group empty">没有符合筛选条件的研报</div>';
    }
    for (const key of Object.keys(state)) {
      els[key].addEventListener(key === 'search' ? 'input' : 'change', () => {
        state[key] = els[key].value;
        render();
      });
    }
    render();
  </script>
