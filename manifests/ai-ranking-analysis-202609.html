executive_summary":"伯恩斯坦2026年8月24日发布全球储能电池周报，涵盖美洲、亚洲、欧洲等地电池及储能行业动态。美洲方面，Lyten收购Morrow Batteries，美国行政令限制外国电网设备。亚洲方面，印度推动电池材料本土化，韩国KOWEPO与ACWA Power合作进入乌兹别克斯坦可再生能源市场（太阳能+风电+储能），目标支持乌兹别克斯坦2030年可再生能源发电占比40%的目标。欧洲方面，EcoPro BM投资KRW 400亿升级匈牙利工厂，从2027年Q4起向德国高端车企供应>90%高镍NCM正极材料，年产能5.4万吨（可扩至10.8万吨），约满足60万辆EV需求。中东方面，沙特签署首批BOO电池储能项目合同（2GW/8GWh，总投资SAR 43.5亿/US$12亿），各项目4小时时长、15年服务协议，第二轮3GW/12GWh招标已启动。报告指出全球储能供应链加速区域化重构，中国储能企业面临美国市场压力并转向中东、东南亚等替代市场，技术层面强调固态电池商业化挑战及钠离子电池对LFP市场的潜在冲击。","key_findings":["沙特签署首批BOO电池储能项目2GW/8GWh（US$12亿），第二轮3GW/12GWh招标已启动，中东储能市场加速","EcoPro BM投资KRW 400亿升级匈牙利工厂，2027年起向德国高端车企供应高镍NCM正极，年产能5.4万吨","韩国KOWEPO与ACWA Power合作进入乌兹别克斯坦可再生能源市场，目标2030年可再生能源发电占比40%","全球储能供应链加速区域化重构，中国储能企业转向中东和东南亚市场"],"content_tags":[],"topics":["储能","电池","供应链"],"data_points":[{"metric":"沙特首批BOO电池储能项目","value_text":"2","period":"","basis":"actual","context":"沙特首批BOO电池储能项目：2GW/8GWh，总投资SAR 43.5亿/US$12亿，4小时时长，15年服务协议，实际"},{"metric":"沙特第二轮储能招标","value_text":"3","period":"","basis":"guidance","context":"沙特第二轮储能招标：3GW/12GWh，已启动，指引"},{"metric":"EcoPro BM匈牙利工厂升级投资KRW 40","value_text":"400亿","period":"","basis":"actual","context":"EcoPro BM匈牙利工厂升级投资KRW 400亿/US$30mn，实际"},{"metric":"匈牙利工厂年产能54,000吨，可扩至108,0","value_text":"54,000","period":"","basis":"actual","context":"匈牙利工厂年产能54,000吨，可扩至108,000吨，约满足60万辆EV，实际"},{"metric":"匈牙利工厂2027年Q4起供应>90%镍高镍NC","value_text":"2027","period":"2027年Q","basis":"guidance","context":"匈牙利工厂2027年Q4起供应>90%镍高镍NCM正极材料，指引"},{"metric":"乌兹别克斯坦可再生能源目标","value_text":"2030","period":"2030年","basis":"guidance","context":"乌兹别克斯坦可再生能源目标：2030年发电占比40%，指引"}],"entities":["Lyten","Morrow Batteries","EcoPro BM","KOWEPO","ACWA Power","磷酸铁锂（LFP）","高镍NCM","钠离子电池","固态电池","BESS"],"evidence":[],"reasons":["正文涉及储能项目、电池材料供应等，与AI数据中心电力基础设施相关，但非唯一主线。"],"ranking_evidence":["沙特签署首批BOO电池储能项目2GW/8GWh","EcoPro BM投资升级匈牙利工厂，供应高镍NCM正极材料"],"false_positive_checks":["储能与AI数据中心电力需求相关，但报告未明确提及AI。"],"failure_code":"","downloaded":true,"download_href":"file:///Users/leon/Stock/investment-research-reports/download MB 25亿为四个季度来首次盈利。核心本地商业经营利润从Q1亏损RMB 21亿大幅反弹至RMB 57亿，主因外卖竞争边际缓和（阿里巴巴减少外卖补贴转向AI资本开支）。新业务亏损收窄至RMB 17亿，沙特市场7月已实现盈利（22个月，快于香港29个月）。但Q3展望偏弱：公司明确将增加补贴重新争夺市场份额，宏观逆风制约营收增长。伯恩斯坦认为外卖、电商、即时零售三大市场正在融合，竞争将周期性反复出现。维持\"与大市同步\"评级，目标价HK$85（12x FY+1 PE），上行约10%，认为估值已反映盈利修复但竞争与宏观仍为压制因素。","key_findings":["2Q26调整后净利润RMB 25亿，四个季度来首次盈利，核心本地商业利润从Q1亏损RMB 21亿反弹至RMB 57亿","外卖竞争边际缓和（阿里减少补贴转向AI）为Q2盈利核心驱动，但Q3补贴将回升","新业务亏损收窄至RMB 17亿，沙特市场22个月实现盈利，快于香港","伯恩斯坦认为外卖/电商/即时零售市场融合将使竞争周期性反复出现"],"content_tags":[],"topics":["外卖","业绩回顾","竞争"],"data_points":[{"metric":"2Q26营收RMB 1,046亿，同比+14.4","value_text":"2","period":"","basis":"actual","context":"2Q26营收RMB 1,046亿，同比+14.4%，超预期，实际"},{"metric":"毛利润RMB 351亿，毛利率33.5%，实际","value_text":"351亿","period":"","basis":"actual","context":"毛利润RMB 351亿，毛利率33.5%，实际"},{"metric":"调整后净利润RMB 25亿，同比+69%，四个季","value_text":"25亿","period":"","basis":"actual","context":"调整后净利润RMB 25亿，同比+69%，四个季度首次盈利，实际"},{"metric":"核心本地商业经营利润RMB 57亿（Q1亏损RM","value_text":"57亿","period":"","basis":"actual","context":"核心本地商业经营利润RMB 57亿（Q1亏损RMB 21亿），实际"},{"metric":"新业务亏损RMB 17亿（低于预期RMB 25亿","value_text":"17亿","period":"","basis":"actual","context":"新业务亏损RMB 17亿（低于预期RMB 25亿），实际"},{"metric":"外卖交易量约61亿单，同比+1%，估算","value_text":"61亿","period":"","basis":"actual","context":"外卖交易量约61亿单，同比+1%，估算"}],"entities":["美团（3690.HK）","字节跳动（抖音）","阿里巴巴","外卖","到店酒旅","即时零售","社区团购","优选","中国","沙特"],"evidence":[],"reasons":["正文主要讨论美团业绩、外卖竞争和评级，无AI基础设施相关内容。"],"ranking_evidence":["2Q26调整后净利润RMB 25亿，核心本地商业利润RMB 57亿","目标价HK$85，维持与大市同步评级"],"false_positive_checks":["无数据中心相关表述，不涉及AI基建。"],"failure_code":"","downloaded":false,"download_href":"","llm_model":"deepseek-v4-flash","ranked_at":"2026-09-01T13:53:01.461Z"},{"media_id":"pdf_19ee3075e13eb6fc6b0a6821afb4b957_01a05a57bbe676b280eb08c708df8d0b7442602265681522","title":"伯恩斯坦-五粮液（000858.SZ）：二季度大幅不及预期，渠道压力持续-260831.pdf","source_path":"环球研报直通车 / 2026年国际顶级投行研报 / 9月 / 9.1 / 伯恩斯坦-五粮液（000858.SZ）：二季度大幅不及预期，渠道压力持续-260831.pdf","local_relative_path":"2026/9月/9.1/伯恩斯坦-五粮液（000858.SZ）：二季度大幅不及预期，渠道压力 ype_reason":"报告聚焦美国娱乐行业主题，属于行业研究。","sectors":[{"name_cn":"可选消费","name_en":"Consumer Discretionary"},{"name_cn":"通信服务","name_en":"Communication Services"}],"research_subject":"","executive_summary":"高盛2026年8月30日发布报告，聚焦9月8-11日Communacopia+科技大会期间美国娱乐板块投资者关注的五大核心主题：1）现场娱乐及票务的消费者需求趋势；2）体育及现场音乐赞助与酒店收入的增长可见性；3）音频广告市场健康度及音频平台的战略选择；4）影院复苏势头的可持续性；5）玩具行业零售商及消费者需求趋势及数字游戏进展。现场活动（Live Nation、Sphere、MSG、StubHub）延续强劲表现，收入可见性高（递延收入预订+多年赛事管道）；体育媒体（TKO、FWONK）聚焦赞助与酒店变现；影院（Cinemark、IMAX）受益于消费向大银幕体验升级，3Q开局创纪录；音频领域的Spotify定价能力、SiriusXM频谱资产变现及YouTube合作、iHeartMedia中期选举周期拐点为关键看点；玩具行业关注假日季需求及IP驱动内容表现。Netflix和Webtoon面临增长节奏与变现路径的讨论。","key_findings":["现场娱乐与体育板块（LYV、MSGE、SPHR、STUB、TKO、FWONK）运营表现强劲，递延收入预订提供更优可见性","音频领域焦点从用户增长转向定价、AI变现及战略选择（Spotify定价、SiriusXM频谱、iHeartMedia中期选举）","影院受益于消费向大银幕体验升级，3Q开局创纪录，但影院复苏轨迹仍存分歧","玩具行业关注假日季需求及IP驱动内容，数字游戏进展为关键变量"],"content_tags":[],"topics":["娱乐","现场活动","媒体"],"data_points":[{"metric":"Sphere《绿野仙踪》已售约360万张门票/约","value_text":"360万","period":"","basis":"actual","context":"Sphere《绿野仙踪》已售约360万张门票/约$4.5亿销售额，平均票价$125，实际"},{"metric":"Liberty Formula One 2026","value_text":"2026","period":"2026年","basis":"guidance","context":"Liberty Formula One 2026年隐含调整后OIBDA预算约$1,008mn，指引"},{"metric":"iHeartMedia预计4Q26中期选举周期带","value_text":"4","period":"","basis":"forecast","context":"iHeartMedia预计4Q26中期选举周期带动广告显著拐点，指引"},{"metric":"3Q26影院票房开局创历史纪录，实际","value_text":"3","period":"","basis":"actual","context":"3Q26影院票房开局创历史纪录，实际"},{"metric":"报告覆盖五大主题","value_text":"","period":"","basis":"","context":"报告覆盖五大主题：现场娱乐、赞助与酒店、音频广告、影院复苏、玩具需求，研究范围"}],"entities":["Live Nation（LYV）","Sphere Entertainment（SPHR）","Madison Square Garden（MSGE）","StubHub（STUB）","TKO Group（TKO）","Liberty Formula One（FWONK）","Cinemark（CNK）","IMAX（IMAX）","Netflix（NFLX）","Webtoon（WBTN）"],"evidence":[],"reasons":["正文主要讨论娱乐行业各板块表现，无AI基础设施相关内容。"],"ranking_evidence":["现场娱乐与体育板块运营表现强劲","音频领域焦点从用户增长转向定价、AI变现"],"false_positive_checks":["无数据中心相关表述，不涉及AI基建。"],"failure_code":"","downloaded":false,"download_href":"","llm_model":"deeps  9.1 / 美银-中国房地产｜预售改革：短期阵痛，龙头房企长期获益-260831.pdf","local_relative_path":"2026/9月/9.1/美银-中国房地产｜预售改革：短期阵痛，龙头房企长期获益-260831.pdf","saved_path":"/Users/leon/Stock/investment-research-reports/downloads/2026/9月/9.1/美银-中国房地产｜预售改革：短期阵痛，龙头房企长期获益-260831.pdf","snapshot_date":"2026-09-01","priority":"P3","rank":39,"score":10,"report_type":"industry","report_type_label":"行业研究","report_type_reason":"报告主要分析中国房地产预售改革对行业的影响，属于行业研究。","sectors":[{"name_cn":"房地产","name_en":"Real Estate"}],"research_subject":"","executive_summary":"美银认为2026年8月28日出台的预售改革是里程碑式的行业变革，要求新住宅项目须采用现房销售或结构封顶后预售，将开发商现金流回收延迟1.5-2年，行业从预售资金驱动转向银行与资本市场支持模式。短期看，2029E行业盈利可能下降7-25%，新开工2027年下降20-30%，前十大开发商合约销售FY27-28E减少逾30%，但地价若下跌10-15%可部分对冲盈利冲击；长期看，改革加速行业整合，提升龙头房企利润率，库存去化加快，二手房需求受益。融资配套措施（40年按揭、债券/股权融资重启）可部分缓冲冲击。美银首选买入中国海外发展（688 HK）和华润置地（1109 HK），下调越秀地产（123 HK）至跑输大市，维持保利、招商蛇口、万科跑输大市评级。风险包括地价下行不及预期、定价风险、融资成本上升及新开工大幅下滑拖累GDP。","key_findings":["改革将开发商现金回款延迟1.5-2年，2029E行业盈利下降7-25%（假设地价跌10%）","新开工2027年预计下降20-30%，新增住房供应2027-28年较预售模式下降60%","长期加速行业整合，龙头房企利润率提升，首选中国海外发展与华润置地（买入）","地价是最不确定变量，需下降约10-15%才能维持盈利不变"],"content_tags":["supply_demand"],"topics":["房地产预售改革","行业整合","开发商盈利"],"data_points":[{"metric":"动力煤社会库存7月底环比下降6,450万吨至6.","value_text":"7","period":"","basis":"actual","context":"动力煤社会库存7月底环比下降6,450万吨至6.588亿吨，实际"},{"metric":"炼焦煤库存7月底环比下降490万吨至1,350万","value_text":"7","period":"","basis":"actual","context":"炼焦煤库存7月底环比下降490万吨至1,350万吨，实际"},{"metric":"煤炭社会总库存7月环比下降9%至6.72亿吨，实","value_text":"7","period":"","basis":"actual","context":"煤炭社会总库存7月环比下降9%至6.72亿吨，实际"},{"metric":"7月煤炭产量3.43亿吨，同比下降10%，实际","value_text":"7","period":"","basis":"actual","context":"7月煤炭产量3.43亿吨，同比下降10%，实际"},{"metric":"秦皇岛港5,500大卡价格周环比+2.0%至RM","value_text":"5,500","period":"","basis":"actual","context":"秦皇岛港5,500大卡价格周环比+2.0%至RMB 879/吨，实际（截至8月28日）"},{"metric":"山西坑口价（5.5千卡）周环比+1.9%至RMB","value_text":"5.5","period":"","basis":"actual","context":"山西坑口价（5.5千卡）周环比+1.9%至RMB 740/吨，实际（截至8月28日）"}],"entities":["煤炭","动力煤","炼焦煤","电力","原油","天然气","炼油","储能电池","化工品","中国"],"eviden   <script>
    const records = JSON.parse(document.getElementById('records').textContent);
    const priorities = ["P0","P1","P2","P3","UNREVIEWED"];
    const state = { search: '', priority: '', date: '', reportType: '', sector: '', local: '' };
    const els = {
      search: document.getElementById('search'),
      priority: document.getElementById('priority'),
      date: document.getElementById('date'),
      reportType: document.getElementById('reportType'),
      sector: document.getElementById('sector'),
      local: document.getElementById('local'),
      groups: document.getElementById('groups'),
      resultCount: document.getElementById('result-count'),
    };
    const escapeHtml = (value) => String(value ?? '').replace(/[&<>"']/g, (char) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
    }[char]));
    const unique = (values) => [...new Set(values.filter(Boolean))].sort((a, b) => String(a).localeCompare(String(b), 'zh-Hans-CN'));
    const addOptions = (el, values) => values.forEach((value) => {
      const option = document.createElement('option');
      option.value = value;
      option.textContent = value;
      el.appendChild(option);
    });
    addOptions(els.priority, priorities.filter((priority) => records.some((record) => record.priority === priority)));
    addOptions(els.date, unique(records.map((record) => record.snapshot_date)).reverse());
    addOptions(els.reportType, unique(records.map((record) => record.report_type_label)));
    addOptions(els.sector, unique(records.flatMap((record) => (record.sectors || []).map((sector) => sector.name_cn))));

    function textBlob(record) {
      return [
        record.title, record.research_subject, record.executive_summary, record.source_path,
        record.report_type_reason,
        ...(record.key_findings || []), ...(record.content_tags || []), ...(record.topics || []),
        ...(record.entities || []), ...(record.reasons || []), ...(record.ranking_evidence || []),
        ...(record.sectors || []).flatMap((sector) => [sector.name_cn, sector.name_en]),
        ...(record.data_points || []).flatMap((point) => [point.metric, point.value_text, point.period, point.context]),
      ].join(' ').toLowerCase();
    }
    function filtered() {
      const query = state.search.trim().toLowerCase();
      return records.filter((record) => {
        if (state.priority && record.priority !== state.priority) return false;
        if (state.date && record.snapshot_date !== state.date) return false;
        if (state.reportType && record.report_type_label !== state.reportType) return false;
        if (state.sector && !(record.sectors || []).some((sector) => sector.name_cn === state.sector)) return false;
        if (state.local === 'yes' && !record.downloaded) return false;
        if (state.local === 'no' && record.downloaded) return false;
        return !query || textBlob(record).includes(query);
      });
    }
    function renderTags(items) {
      return (items || []).map((item) => '<span class="tag">' + escapeHtml(item) + '</span>').join('');
    }
    function renderCard(record) {
      const local = record.downloaded ? '<span class="badge local">本地已有</span>' : '';
      const link = record.download_href ? '<a href="' + escapeHtml(record.download_href) + '">打开本地 PDF</a>' : '尚未下载';
      const findings = record.key_findings.length
        ? '<ul class="findings">' + record.key_findings.map((item) => '<li>' + escapeHtml(item) + '</li>').join('') + '</ul>'
        : '';
      const numbers = record.data_points.length
        ? '<div class="numbers">' + record.data_points.map((point) =>
            '<div class="number"><strong>' + escapeHtml(point.metric) + '</strong>' +
            escapeHtml([point.value_text, point.period, point.basis].filter(Boolean).join(' · ')) +
            (point.context ? '<div>' + escapeHtml(point.context) + '</div>' : '') + '</div>'
          ).join('') + '</div>'
        : '';
      const evidence = record.ranking_evidence.length
        ? '<div class="evidence">排序证据：' + escapeHtml(record.ranking_evidence.join(' / ')) + '</div>'
        : '';
      const failure = record.failure_code ? '<div class="evidence">状态：' + escapeHtml(record.failure_code) + '</div>' : '';
      const sectorNames = (record.sectors || []).map((sector) => sector.name_cn);
      return '<article class="card">' +
        '<div class="rank"><strong>#' + escapeHtml(record.rank ?? '-') + '</strong><span>当日排序</span></div>' +
        '<div><div class="meta"><span class="badge ' + record.priority.toLowerCase() + '">' + escapeHtml(record.priority) + '</span>' +
        local + '<span class="tag">score ' + escapeHtml(record.score ?? '-') + '</span><span class="tag">' + escapeHtml(record.report_type_label) + '</span></div>' +
        '<h3 class="title">' + escapeHtml(record.title) + '</h3>' +
        (record.research_subject ? '<div class="subject">研究主体：' + escapeHtml(record.research_subject) + '</div>' : '') +
        (sectorNames.length ? '<div class="tags">' + renderTags(sectorNames) + '</div>' : '') +
        (record.report_type_reason ? '<div class="reason">类型依据：' + escapeHtml(record.report_type_reason) + '</div>' : '') +
        '<div class="tags">' + renderTags([...(record.content_tags || []), ...(record.topics || [])]) + '</div>' +
        (record.reasons.length ? '<div class="reason">排序理由：' + escapeHtml(record.reasons.join('；')) + '</div>' : '') +
        (record.executive_summary ? '<p class="summary"><strong>IMA 摘要：</strong>' + escapeHtml(record.executive_summary) + '</p>' : '') +
        findings + numbers +
        (record.entities.length ? '<div class="tags">' + renderTags(record.entities) + '</div>' : '') +
        evidence + failure +
        '<div class="path">IMA 路径：' + escapeHtml(record.source_path) + '</div>' +
        '<div class="path">本地路径：' + escapeHtml(record.local_relative_path) + ' · ' + link + '</div></div></article>';
    }
    function render() {
      const rows = filtered();
      els.resultCount.textContent = rows.length;
      const groups = new Map();
      for (const record of rows) {
        if (!groups.has(record.snapshot_date)) groups.set(record.snapshot_date, []);
        groups.get(record.snapshot_date).push(record);
      }
      els.groups.innerHTML = [...groups.entries()].map(([date, dayRows]) => {
        const stats = priorities
          .map((priority) => [priority, dayRows.filter((record) => record.priority === priority).length])
          .filter(([, count]) => count)
          .map(([priority, count]) => '<span class="badge ' + priority.toLowerCase() + '">' + priority + ' ' + count + '</span>')
          .join('');
        return '<section class="day-group"><div class="day-head"><h2>' + escapeHtml(date) + '</h2>' +
          '<div class="day-stats">' + stats + '<span class="tag">合计 ' + dayRows.length + '</span></div></div>' +
          '<div class="cards">' + dayRows.map(renderCard).join('') + '</div></section>';
      }).join('') || '<div class="day-group empty">没有符合筛选条件的研报</div>';
    }
    for (const key of Object.keys(state)) {
      els[key].addEventListener(key === 'search' ? 'input' : 'change', () => {
        state[key] = els[key].value;
        render();
      });
    }
    render();
  </script>
</body>
</html>
