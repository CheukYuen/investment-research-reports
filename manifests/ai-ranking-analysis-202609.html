901.pdf","saved_path":"/Users/leon/Stock/investment-research-reports/downloads/2026/9月/9.2/高盛-韩国科技行业：2026年8月出口追踪，存储芯片出口强劲增长势头延续-260901.pdf","snapshot_date":"2026-09-02","priority":"P0","rank":4,"score":95,"report_type":"industry","report_type_label":"行业研究","report_type_reason":"报告追踪韩国科技行业出口数据，聚焦存储芯片等AI硬件，属于行业研究。","sectors":[{"name_cn":"信息技术","name_en":"Information Technology"}],"research_subject":"","executive_summary":"高盛追踪韩国科技行业2026年8月出口数据，整体趋势积极，存储芯片延续强劲增长。2026年8月存储出口同比+290%，已连续7个月实现超200%增幅，DRAM出口同比+412%创自2008年有追踪以来的历史最高增速，NAND芯片出口同比+343%连续10个月三位数增长，SSD出口同比+480%。韩国产业通商资源部（MOTIE）归因于AI基础设施建设带来的存储需求强劲及供不应求推动价格持续上行。高盛通过HBM材料进口代理指标判断三星电子HBM竞争力出现强劲复苏（塑料薄膜进口YTD同比+84%）。半导体设备（WFE）出口同比+129%、进口同比+153%，反映存储厂商为技术升级扩产大幅增加资本开支。MLCC出口同比+15%连续4个月两位数增长，高盛预计三星电机3Q26 MLCC营收同比+44%。锂离子电池出口同比+5%延续正增长，受矿产涨价及欧洲EV/北美ESS扩张带动。唯一下滑的是OLED面板出口同比-8%，受下游定价压力影响。高盛预计3Q26三星电子存储营收同比+446%，SK海力士总营收同比+305%。","key_findings":["存储芯片出口连续7个月超200%增长，DRAM增速创历史新高，AI基建驱动超级周期持续","三星电子HBM竞争力出现强劲复苏迹象（塑料薄膜进口YTD+84%）","半导体设备进出口均大幅增长，存储厂商资本开支高景气","MLCC受AI服务器/汽车需求带动持续走强，OLED面板因价格承压下滑"],"content_tags":[],"topics":["存储芯片","AI基础设施","半导体设备"],"data_points":[{"metric":"2026年8月存储出口同比增速","value_text":"+290%","period":"2026年","basis":"actual","context":"2026年8月存储出口同比增速：+290%，实际"},{"metric":"2026年8月DRAM出口同比增速","value_text":"+412%","period":"2026年","basis":"actual","context":"2026年8月DRAM出口同比增速：+412%（历史最高），实际"},{"metric":"2026年8月NAND芯片出口同比增速","value_text":"+343%","period":"2026年","basis":"actual","context":"2026年8月NAND芯片出口同比增速：+343%，实际"},{"metric":"2026年8月SSD出口同比增速","value_text":"+480%","period":"2026年","basis":"actual","context":"2026年8月SSD出口同比增速：+480%，实际"},{"metric":"2026年8月WFE设备出口/进口同比","value_text":"+129%","period":"2026年","basis":"actual","context":"2026年8月WFE设备出口/进口同比：+129%/+153%，实际"},{"metric":"2026年8月MLCC出口同比","value_text":"+15%","period":"2026年","basis":"actual","context":"2026年8月MLCC出口同比：+15%，实际"}],"entities":["公司：三星电子（SEC）","SK海力士","三星电机（SEMCO）","LG Display","产品：DRAM","NAND","SSD","HBM","MLCC","OLED"],"evidence":[],"re ormation Technology"},{"name_cn":"通信服务","name_en":"Communication Services"}],"research_subject":"","executive_summary":"瑞银通过HOLT框架评估中国云服务商的AI资本开支，涵盖阿里巴巴、腾讯和百度。报告指出，尽管AI资本支出加速对短期自由现金流和盈利造成压力，但中国云服务商整体财务韧性较强，预计在整体层面保持净现金头寸，固定费用覆盖比率仍高于安全线，与美国超大规模云服务商转向净负债形成对比。其中阿里巴巴AI支出最为激进，固定费用覆盖率自2025年起降至100%以下；腾讯保持更审慎的投资节奏；百度则通过现有现金余额和经营现金流支持AI资本开支。报告分析认为，长期来看AI投资有望推动经济利润提升，预计阿里巴巴和腾讯的经济利润将在2027年达到五年高点或历史高点。历史数据显示市场可能对增长导向的资本配置给予更高估值，腾讯当前估值隐含保守回报预期存在修复空间，而百度已嵌入较高AI商业化溢价。中国主要AI基础设施投资者包括上市互联网云服务商（阿里巴巴、腾讯、百度）、私营科技巨头（字节跳动、华为）以及国有电信运营商。","key_findings":["中国云服务商整体财务韧性较好，尽管AI资本开支上升，但整体仍维持净现金头寸，与美国超大规模云服务商借债融资路径不同","阿里巴巴和腾讯的经济利润有望在2027年达到五年高点或历史高点，AI投资若转化为可持续增长将推动价值创造","腾讯当前估值隐含保守预期，若AI货币化和云业务持续改善，风险回报比更有利"],"content_tags":["financials","rating_valuation"],"topics":["AI资本开支","云服务商","数据中心"],"data_points":[{"metric":"中国住房按揭余额（截至2025年上半年）","value_text":"36.3","period":"2025年上半年","basis":"actual","context":"中国住房按揭余额（截至2025年上半年）：Rmb36.3trn，实际值"},{"metric":"按揭余额预计在2026年触底，2028E-30E","value_text":"2026","period":"2026年","basis":"forecast","context":"按揭余额预计在2026年触底，2028E-30E年间恢复至0-2%的年增长率，至2030E达Rmb36.8trn，预测值"},{"metric":"按揭最长贷款期限从30年延长至40年，政策变更","value_text":"30","period":"","basis":"","context":"按揭最长贷款期限从30年延长至40年，政策变更"},{"metric":"月供收入比上限从55%提高至60%，政策变更","value_text":"55%","period":"","basis":"","context":"月供收入比上限从55%提高至60%，政策变更"},{"metric":"开发商贷款期限延长至最长5年（预售项目）和7年（","value_text":"5","period":"","basis":"","context":"开发商贷款期限延长至最长5年（预售项目）和7年（现房销售项目），政策变更"}],"entities":["公司：阿里巴巴","腾讯","百度","字节跳动","华为","微软","亚马逊","Alphabet","Meta","Oracle"],"evidence":[],"reasons":["正文明确以AI资本开支为核心，分析阿里巴巴、腾讯、百度等云服务商的AI投资。","涉及数据中心扩张、AI服务器等基础设施投资。"],"ranking_evidence":["阿里巴巴AI支出激进","腾讯和百度AI资本开支","中国云服务商整体维持净现金头寸"],"false_positive_checks":["明确AI资本开支，非地产。"],"failure_code":"","downloaded":true,"download_href":"file:///Users/leon/Stock/investment-research-reports/downloads/2026/9%E6%9C%88/9.2/%E7%91%9E%E9%93%B6-%E4%B8%AD%E5%9B%BD%E4%BA%BA%E5%B7%A5%E6%99%BA%E8%83%BD%E8%B5%84%E6%9C%AC%E5%BC%80%E6%94%AF%EF%BC%9A%E5%8F%AF%E8 析推理算力需求与AI基础设施投资，属于行业研究。","sectors":[{"name_cn":"信息技术","name_en":"Information Technology"}],"research_subject":"","executive_summary":"花旗以\"智能飞轮效应\"为主线，阐述开源权重模型采用率快速提升正在缩小与专有前沿模型的智能差距，同时持续推动推理算力需求增长，形成\"采用增长→智能提升→成本下降→需求扩张→基础设施投资\"的正向循环。截至8月25日，开源权重模型占Vercel AI Gateway token流量的53%（较6月24日上升24个百分点），前沿专有与前沿开源模型的智能差距从9个点缩小至3个点。DeepSeek截至7月营收7100万美元（约为2025全年营收的10倍），API毛利率达83%，验证开源模型商业化可行性。Blackwell相对Hopper的7天平均租赁溢价从1.74x扩大至1.84x，超大规模厂商订单积压2Q同比+151%（高于1Q的+143%）。推理token价格持续通缩，平均推理token支出保持在1.05美元/百万token附近，较5月峰值下降49%，token价格通缩进一步扩大企业需求漏斗。英伟达拟以129亿美元收购Hugging Face、以60亿美元授权Poolside的Model Factory。Nscale签署6年期450亿美元合同（460MW）。报告关注安全风险，护栏较弱的开源权重模型被指帮助国有背景黑客将攻击量扩大2倍以上。","key_findings":["开源权重模型采用率快速攀升（53% token流量），智能差距收窄至3个点，正在重塑推理算力需求格局","\"智能飞轮效应\"持续运转：采用增长→智能提升→成本下降→需求扩张→基础设施投资","推理token价格通缩显著（较5月峰值降49%），扩大企业需求漏斗，算力需求持续扩张","英伟达拟收购Hugging Face（129亿美元）及授权Poolside（60亿美元），强化开源生态"],"content_tags":["supply_demand","catalysts_risks"],"topics":["推理算力","AI基础设施","开源模型"],"data_points":[{"metric":"开源权重模型token流量占比","value_text":"53%","period":"","basis":"actual","context":"开源权重模型token流量占比：53%（截至8月25日，实际）；较6月24日上升24个百分点"},{"metric":"前沿专有模型与前沿开源模型智能差距","value_text":"9","period":"","basis":"actual","context":"前沿专有模型与前沿开源模型智能差距：从9个点缩小至3个点（实际）"},{"metric":"DeepSeek营收","value_text":"71","period":"2025","basis":"actual","context":"DeepSeek营收：$71mn（截至7月，实际）；约为2025全年营收的10倍"},{"metric":"DeepSeek API毛利率","value_text":"83%","period":"","basis":"actual","context":"DeepSeek API毛利率：83%（实际）"},{"metric":"Blackwell vs Hopper 7天平均租赁溢价","value_text":"1.84","period":"","basis":"actual","context":"Blackwell vs Hopper 7天平均租赁溢价：1.84x（过去4周从1.74x扩大至，实际）"},{"metric":"超大规模厂商订单积压同比增速","value_text":"2","period":"","basis":"actual","context":"超大规模厂商订单积压同比增速：2Q +151%，1Q +143%（实际）"}],"entities":["公司：花旗","英伟达","DeepSeek","Hugging Face","Poolside","Cerebras","Nscale","nVent","产品：Blackwell","Hopper"],"evidence":[],"reasons":["正文明确以推理算力需求为核心，涉及数据中心投资与GPU租赁，直接关联AI基建。"],"ranking_evidence":["超大规模厂商订单积压2Q同比+151%","Blackwell租赁溢价1.84 BM","内存市场","AI服务器","资本开支"],"data_points":[{"metric":"英伟达FY28收入指引","value_text":"+70%","period":"","basis":"actual","context":"英伟达FY28收入指引：同比+70%（供给受限，指引），市场一致预期约+45%（预测）"},{"metric":"CSP硬件资本开支中内存价值占比","value_text":"2026","period":"2026E","basis":"forecast","context":"CSP硬件资本开支中内存价值占比：2026E 6,690亿美元（占31%）→ 2027E 9,910亿美元（占49%）（基于OMDIA数据，预测）"},{"metric":"美国超大规模云厂商（AWS/MSFT/GCP）云收入同比增速","value_text":"2","period":"","basis":"actual","context":"美国超大规模云厂商（AWS/MSFT/GCP）云收入同比增速：2Q25A +23% → 2Q26A +43%（实际）"},{"metric":"Vera Rubin每GPU收入机会","value_text":"400亿","period":"","basis":"forecast","context":"Vera Rubin每GPU收入机会：超400亿美元；Grace Blackwell：250亿美元（估值/预测）"},{"metric":"NVHBM vs HBM4E","value_text":"30%","period":"","basis":"","context":"NVHBM vs HBM4E：带宽提升最高30%+，封装面积释放25%+，功耗降低最高15%（英伟达声称）"},{"metric":"长鑫存储1H26销售额","value_text":"1,503亿","period":"","basis":"actual","context":"长鑫存储1H26销售额：1,503亿元人民币（同比+874%，实际），营业利润率78%（1H25为-27%，实际）"}],"entities":["公司：英伟达（NVDA）","长鑫存储（CXMT","688825 CH）","南亚科技（NYT","2408.TW）","SK海力士（SKH","000660.KS）","三星电子（SEC","005930.KS）","铠侠（Kioxia"],"evidence":[],"reasons":["正文明确以AI数据中心资本开支、HBM/内存为主要投资逻辑","英伟达FY28收入指引+70%，CSP资本开支中内存价值占比提升","NVHBM定制HBM架构，带宽提升30%+"],"ranking_evidence":["英伟达FY28收入指引同比+70%","CSP硬件资本开支中内存价值占比2026E 31%→2027E 49%","NVHBM vs HBM4E带宽提升30%+"],"false_positive_checks":["非地产，确为内存供需分析"],"failure_code":"","downloaded":true,"download_href":"file:///Users/leon/Stock/investment-research-reports/downloads/2026/9%E6%9C%88/9.2/%E6%91%A9%E6%A0%B9%E5%A4%A7%E9%80%9A-%E5%86%85%E5%AD%98%E5%B8%82%E5%9C%BA%E6%9B%B4%E6%96%B0%EF%BC%9A%E8%8B%B1%E4%BC%9F%E8%BE%BE%E3%80%81%E9%95%BF%E9%91%AB%E5%AD%98%E5%82%A8%E4%B8%9A%E7%BB%A9%E4%BB%A5%E5%8F%8A%E9%93%A0%E4%BE%A0%E3%80%81SK%E6%B5%B7%E5%8A%9B%E5%A3%AB%E6%8A%95%E8%B5%84%E6%B6%88%E6%81%AF%E7%9A%84%E5%BD%B1%E5%93%8D-260831.pdf","llm_model":"deepseek-v4-flash","ranked_at":"2026-09-02T13:53:25.027Z"},{"media_id":"pdf_19ee3075e13eb6fc6b0a6821afb4b957_f8675fcb436f1238fdf6915bd0d4c9b67442602265681522","title":"摩根大通- 务）收入1.2亿元占AI云9%。GAAP营业利润首次在2Q26转正。2026年资本支出预算达150亿元人民币（基准情形），AI IaaS按收入计算的回收期为3.5年，客户预付款可覆盖直接资本支出的70-80%。管理层目标2026年EBITDA利润率约35%，2027年实现正的调整后净利润率。公司采用4-5年折旧政策，2H23第一批AI资本支出的折旧成本将从2H27起显著下降。风险包括供应链中断、竞争加剧、关键客户（小米）AI投资低于预期等。","key_findings":["AI云收入同比+82%为核心增长引擎，占总收入比重升至43%，GAAP营业利润首次转正","高盛给予\"买入\"评级及18美元目标价，潜在上行空间约75.8%","2026年资本支出预算150亿元，AI IaaS回收期3.5年，客户预付款覆盖70-80%","MaaS服务覆盖230家客户120个模型，80%为AI编码应用"],"content_tags":[],"topics":["AI云","资本开支","数据中心"],"data_points":[{"metric":"12个月目标价","value_text":"18美元","period":"","basis":"valuation","context":"12个月目标价：18美元/股，高盛估值"},{"metric":"当前股价","value_text":"10.24美元","period":"2026年","basis":"actual","context":"当前股价：10.24美元，实际（截至2026年8月31日收盘）"},{"metric":"潜在上涨空间","value_text":"75.8%","period":"","basis":"valuation","context":"潜在上涨空间：约75.8%，估值"},{"metric":"2Q26 AI云收入同比增速","value_text":"+82%","period":"","basis":"actual","context":"2Q26 AI云收入同比增速：+82%（达13亿元人民币），实际"},{"metric":"AI云收入占总收入比例","value_text":"43%","period":"","basis":"actual","context":"AI云收入占总收入比例：43%，实际"},{"metric":"2026年资本支出预算","value_text":"150亿","period":"2026年","basis":"guidance","context":"2026年资本支出预算：150亿元人民币，公司指引"}],"entities":["公司：金山云（KC.US）","小米集团","金山软件","产品：AI云计算","MaaS（模型即服务）","AI计算","公有云","企业云","CDN","技术：AI训练"],"evidence":[],"reasons":["正文明确以AI云收入增长为核心，涉及数据中心资本开支与回收期，直接关联AI基础设施。"],"ranking_evidence":["AI云收入同比+82%","2026年资本支出预算达150亿元人民币","AI IaaS回收期3.5年"],"false_positive_checks":["无"],"failure_code":"","downloaded":true,"download_href":"file:///Users/leon/Stock/investment-research-reports/downloads/2026/9%E6%9C%88/9.2/%E9%AB%98%E7%9B%9B-%E9%87%91%E5%B1%B1%E4%BA%91%EF%BC%88KC.US%EF%BC%892026%E5%B9%B4%E4%BA%9A%E6%B4%B2%E9%A2%86%E8%A2%96%E5%A4%A7%E4%BC%9A%E8%A6%81%E7%82%B9%EF%BC%9AAI%E4%BA%91%E5%B0%86%E6%8E%A8%E5%8A%A8%E6%94%B6%E5%85%A5%E6%89%A9%E5%BC%A0%EF%BC%8C%E6%8A%95%E8%B5%84%E5%9B%9E%E6%8A%A5%E5%85%B7%E5%90%B8%E5%BC%95%E5%8A%9B-260901.pdf","llm_model":"deepseek-v4-flash","ranked_at":"2026-09-02T13:53:25.027Z"},{"media_id":"pdf_19ee3075e13eb6fc6b0a6821 盛对Cadence保持看多，认为定制AI芯片趋势加剧了芯片设计工程师的结构性短缺，EDA公司通过Agentic AI可获增量机会，预计到2030年EDA Agentic AI增量市场约$3.7bn/年，最早可能在2026年下半年显现。报告覆盖的主要公司评级包括：Nvidia（买入）、Broadcom（买入）、AMD（中性）、ARM（中性）、Applied Materials（买入）、Lam Research（买入）、KLA（中性）、Cadence（买入）、Synopsys（买入）、Texas Instruments（买入）、Microchip（买入）、SanDisk（买入）、Seagate（买入）、Teradyne（卖出）等。","key_findings":["AI基础设施支出持续强劲，代理AI正成为新增催化剂，融资、数据中心物理空间和开源模型是潜在约束","WFE行业上升周期至少持续至2028年，DRAM、领先制程代工和先进封装为主要驱动力","EDA软件领域，定制AI芯片推动结构性需求，Agentic AI带来约$3.7bn/年的增量市场机会（到2030年），最早2H26显现"],"content_tags":[],"topics":["AI基础设施","半导体设备","WFE","先进封装"],"data_points":[{"metric":"EDA Agentic AI增量市场机会","value_text":"3.7","period":"2030年","basis":"forecast","context":"EDA Agentic AI增量市场机会：约$3.7bn/年，到2030年，预测值（未反映在Street预期中）"},{"metric":"资本回报计划通常覆盖超额自由现金流","value_text":"50%","period":"","basis":"guidance","context":"资本回报计划通常覆盖超额自由现金流：50%-100%，指引"},{"metric":"大会时间","value_text":"2026","period":"2026年","basis":"actual","context":"大会时间：2026年9月8-11日，实际值"},{"metric":"参与公司数量","value_text":"32","period":"","basis":"actual","context":"参与公司数量：32家全球企业，实际值"},{"metric":"覆盖关键公司评级及股价","value_text":"180.17","period":"","basis":"","context":"覆盖关键公司评级及股价：Nvidia（买入，$180.17）、Broadcom（买入，$308.65）、AMD（中性，$168.58）、ARM（中性，$142.55）、Applied Materials（买入，$165.27）、Lam Research（买入，$104.09）、Cadence（买入，$354.29）、Synopsys（买入，$612.17）、Texas Instruments（买入，$204.09）、Microchip（买入，$65.25）、KLA（中性，$894.00）、SanDisk（买入，$50.87）、Seagate（买入，$172.38）、Teradyne（卖出，$117.89）"}],"entities":["公司：Nvidia","Broadcom","AMD","ARM","Applied Materials","Lam Research","KLA","Cadence","Synopsys","Texas Instruments"],"evidence":[],"reasons":["正文聚焦AI基础设施支出、半导体设备需求周期、先进封装等核心议题。","明确提及AI基础设施支出的驱动因素与约束。"],"ranking_evidence":["WFE行业上升周期至少持续至2028年","DRAM、领先制程代工和先进封装为主要驱动力","EDA Agentic AI增量市场约$3.7bn/年"],"false_positive_checks":["明确AI基础设施，非地产。"],"failure_code":"","downloaded":true,"download_href":"file:///Users/leon/Stock/investment-research-reports/downloads/2026/9%E6%9C%88/9.2/%E9%AB%98%E7%9B%9B-%E7%BE%8E%E5%9B%BD%E5%8D%8A%E5%AF%BC%E4 信设备行业，涉及多家公司估值比较，属于行业研究。","sectors":[{"name_cn":"信息技术","name_en":"Information Technology"},{"name_cn":"通信服务","name_en":"Communication Services"}],"research_subject":"","executive_summary":"巴克莱研究维持IT硬件与通信设备行业中性评级，数据显示AI硬件股隐含估值倍数持续走高，但距峰值仍有较大跌幅。自上次报告（2026年7月31日）以来，AI篮子12只股票平均隐含AI市盈率从43倍升至46倍（+7%），均价上涨7%，而同期标普500仅涨3%、纳斯达克100涨5%；但自2026年2月追踪以来，AI篮子股票平均较峰值仍下跌约22%。服务器类标的（SMCI、DELL、HPE）表现最强，受SMCI订单指引及毛利率改善驱动，DELL和HPE在本轮达到AI倍数峰值（69倍和76倍）；EMS厂商（FN、JBL）倍数处于追踪以来低谷（约24倍），但仍远高于其核心估值。行业平均云AI收入CAGR（2023-27E）从约53%上修至约66%。非AI股票（AAPL、GRMN、AXON等）自7月31日以来涨约高个位数，反映投资者在下半年寻找此前不受青睐但基本面强劲的标的。主要风险为AI订单波动、毛利率压力和行业竞争加剧。","key_findings":["AI篮子股票隐含AI估值倍数持续走高，但距2026年2月峰值仍有约22%的平均跌幅，估值分化加剧——服务器类走高，EMS厂商处于低谷","行业平均云AI收入增长预期从53%上修至66%，超大规模型企业资本开支预期持续上调支撑AI硬件需求","中国光通信（GLW、CIEN）自7月31日有所回升，但较6月峰值仍分别下跌40%和33%，回调深度值得关注","投资者关注度开始向非AI但基本面强劲的标的扩散，可能成为下半年重要方向"],"content_tags":["rating_valuation"],"topics":["AI服务器","光通信","估值"],"data_points":[{"metric":"AI篮子股票平均隐含AI市盈率","value_text":"46倍","period":"2026年","basis":"","context":"AI篮子股票平均隐含AI市盈率：当前46倍（2026年8月27日），较7月31日的43倍上升3倍，较2月11日追踪以来峰值仍有差距"},{"metric":"AI篮子股票均价","value_text":"72%","period":"","basis":"","context":"AI篮子股票均价：年初至今上涨约72%（前期读数约60%）"},{"metric":"标普500年初至今上涨13%","value_text":"500","period":"","basis":"","context":"标普500年初至今上涨13%"},{"metric":"服务器类AI倍数峰值","value_text":"69倍","period":"","basis":"valuation","context":"服务器类AI倍数峰值：DELL 69倍、HPE 76倍（本轮最高）"},{"metric":"EMS厂商隐含AI倍数低谷","value_text":"24倍","period":"","basis":"","context":"EMS厂商隐含AI倍数低谷：FN 24倍、JBL 24倍（均为追踪以来最低）"},{"metric":"SMCI隐含AI倍数","value_text":"3倍","period":"","basis":"","context":"SMCI隐含AI倍数：仅3倍，虽股价自上期上涨35%，因公司特定问题远低于同行"}],"entities":["公司：SMCI（超微电脑）","DELL","HPE","FN（Fabrinet）","CLS（Celestica）","ANET（Arista Networks）","CIEN（Ciena）","JBL（Jabil）","FLEX（Flex）","KEYS（Keysight）"],"evidence":[],"reasons":["正文有明确的AI硬件需求、估值和业绩传导证据","AI篮子股票隐含AI市盈率46倍，服务器类标的（SMCI、DELL、HPE）表现最强","行业平均云AI收入CAGR上修至66%"],"ranking_evidence":["AI篮子股票平均隐含AI市盈率46倍","服务器类AI倍数峰值DELL 69倍、HPE 76倍","行业平均云AI收入CAGR从53%上修至66%"], rt_type":"strategy","report_type_label":"投资策略","report_type_reason":"报告分析A股盈利并给出行业配置建议，属于投资策略。","sectors":[{"name_cn":"信息技术","name_en":"Information Technology"},{"name_cn":"原材料","name_en":"Materials"},{"name_cn":"金融","name_en":"Financials"}],"research_subject":"","executive_summary":"瑞银通过分析五千余家A股公司2026年半年报，判断A股盈利已显著加速复苏。2026年第二季度全A盈利同比增长29.4%，较Q1的9.3%大幅提速，带动上半年累计增长19.5%，远高于2025全年增速。驱动因素包括营收加速（Q2同比+9.8%）和利润率显著改善——非金融企业毛利率同比扩张141个基点至19.2%（2021年Q2以来新高），净利率同比扩大92个基点至6.1%（2022年Q3以来新高）。瑞银据此上调2026全年全A盈利增速预测至15%。板块分化明显：科创板盈利同比+370%（剔除长鑫存储后+105%），创业板+42%，均远超主板；AI相关行业最为突出，电子行业盈利同比+234%，计算机+46%；资源品行业受油价/有色金属价格上行及低基数驱动，有色金属+102%、煤炭+67%、石油石化+59%、化工+58%；非银金融受益于交投活跃，盈利同比+135%，银行仅+3%。策略上，瑞银建议超配电子、电信、机械、有色金属、化工、电力设备和非银金融，认为A股去杠杆已近尾声，年内有望延续慢牛。主要风险为美债收益率与油价变化以及公募基金赎回压力（科技板块已显著超配）。","key_findings":["Q2 2026全A盈利同比+29.4%，H1累计+19.5%，盈利复苏显著加速","科创板与创业板盈利增速远超主板，创新和新质生产力是核心驱动力","AI相关行业（电子+234%、计算机+46%）和资源品行业盈利领跑","瑞银建议超配电子、电信、机械、有色金属、化工、电力设备、非银金融"],"content_tags":[],"topics":["A股盈利","AI相关行业","行业配置"],"data_points":[{"metric":"Q2 2026全A盈利同比增速","value_text":"+29.4%","period":"2026","basis":"actual","context":"Q2 2026全A盈利同比增速：+29.4%，实际"},{"metric":"H1 2026全A盈利同比增速","value_text":"+19.5%","period":"2026","basis":"actual","context":"H1 2026全A盈利同比增速：+19.5%，实际"},{"metric":"2026全年全A盈利增速预测","value_text":"+15%","period":"2026","basis":"forecast","context":"2026全年全A盈利增速预测：+15%，瑞银预测"},{"metric":"Q2 2026非金融毛利率","value_text":"19.2%","period":"2026","basis":"actual","context":"Q2 2026非金融毛利率：19.2%（同比+141bp，2021年Q2以来新高），实际"},{"metric":"Q2 2026非金融净利率","value_text":"6.1%","period":"2026","basis":"actual","context":"Q2 2026非金融净利率：6.1%（同比+92bp，2022年Q3以来新高），实际"},{"metric":"电子行业盈利同比增速","value_text":"+234%","period":"","basis":"actual","context":"电子行业盈利同比增速：+234%，实际"}],"entities":["公司：长鑫存储（CXMT）","行业：电子","计算机","有色金属","煤炭","石油石化","化工","非银金融","银行","电力设备"],"evidence":[],"reasons":["正文提及AI相关行业盈利高增，但主要聚焦整体盈利与配置，非纯AI基建主线。"],"ranking_evidence":["电子行业盈利同比+234%","AI相关行业最为突出"],"false_positive_checks":["AI相关行业盈利数据，但无具体基建投资细节"], ,"report_type_reason":"报告主要对象是商业与信息服务行业的多家公司比较，属于行业研究。","sectors":[{"name_cn":"信息技术","name_en":"Information Technology"},{"name_cn":"通信服务","name_en":"Communication Services"}],"research_subject":"","executive_summary":"高盛于2026年8月31日发布第三届硅谷AI实地调研报告（调研日期8月18-19日，涵盖Daloopa、Harvey、Clio、Corgi、Moody's、Vercel等AI公司及Lightspeed、Kleiner Perkins等风投和斯坦福/UC Berkeley学术交流），在商业与信息服务覆盖范围内归纳四大核心结论：1）专有数据创造最清晰的信息优势；2）AI从信息检索转向工作流执行，工作流控制权决定经济价值归属；3）物理服务和教育平台比白领人员配置更具防御性；4）变现路径从席位模式转向使用量、交易、产品溢价和成果定价。个股层面，MCO（穆迪）凭借专有风险情报、嵌入式决策工作流和智能体访问/交易变现能力被列为最清晰受益者（综合影响\"正面\"）；FICO、EFX、MH、ADT、CTAS、ROL、IRM也被归入\"最清晰AI受益者\"；FDS因AI可自动化财务数据收集和模型维护面临工作站压力（综合影响\"偏负面\"）；IT（Gartner）因标准化研究可被AI商品化、RHI因白领人员配置敞口大而面临类似压力。","key_findings":["专有数据优势：MCO传导效应最强，SPGI、MSCI、CSGP受益但界面和定价不确定；FDS因财务数据可复制性面临压力","工作流控制权：FICO和EFX在AI驱动的受治理决策和验证需求中最清晰受益；TRI与Harvey/Clio争夺法律工作流控制权","物理服务与教育更抗风险：ADT、CTAS、ROL、MH（超1亿付费许可）定位良好；RHI白领人员配置面临最大颠覆风险","变现路径：使用量/交易/产品溢价是最清晰收入路径，MCO、FICO、EFX、TRI、MH、ADT、IRM拥有可信机会；FDS、IT、RHI、PBI面临收入压力先于新变现实现的时间风险"],"content_tags":[],"topics":["AI应用","专有数据","工作流"],"data_points":[{"metric":"MH付费课程许可","value_text":"1亿","period":"","basis":"actual","context":"MH付费课程许可：超1亿（实际）"},{"metric":"MH AI产品用户","value_text":"750万","period":"","basis":"actual","context":"MH AI产品用户：750万（实际）"},{"metric":"MH潜在许可溢价","value_text":"5%","period":"","basis":"forecast","context":"MH潜在许可溢价：5%-15%（预测/指引）"},{"metric":"调研日期","value_text":"2026","period":"2026年","basis":"actual","context":"调研日期：2026年8月18-19日（实际）"},{"metric":"发布日","value_text":"2026","period":"2026年","basis":"actual","context":"发布日：2026年8月31日（实际）"}],"entities":["公司：MCO","FDS","SPGI","MSCI","CSGP","CLVT","IT（Gartner）","FICO","EFX","TRI"],"evidence":[],"reasons":["正文涉及AI应用但缺乏AI基础设施的直接传导证据","主要讨论AI对软件和商业服务公司的影响，而非硬件基础设施"],"ranking_evidence":["调研涵盖Daloopa、Harvey、Clio等AI公司","结论聚焦专有数据、工作流控制权等"],"false_positive_checks":["无数据中心或硬件资本开支内容"],"failure_code":"","downloaded":true,"download_href":"file:///Users/leon/Stock/investment-research-reports/downloads/2026/9%E6%9C%88/9.2/%E9%AB%98%E7 "executive_summary":"美联储主席Warsh在杰克逊霍尔的首次演讲被市场解读为\"鹰派\"，预测市场将9月加息概率上调至约55%，比特币和黄金回吐部分涨幅。但伯恩斯坦认为市场误读了Warsh——其演讲核心是美联储已进入\"不给前瞻指引\"的新体制，而非传递加息信号；Warsh用大量篇幅讨论AI，但未给出具体结论，暗示美联储可能对AI投资周期带来的短期通胀压力更为容忍。报告强调美国创纪录债务、不可持续财政赤字和不断膨胀的利息支出将形成\"贬值交易\"的结构性自增强循环，政策制定者最终会选择货币贬值而非财政紧缩。比特币作为硬资产、稳定币作为国债需求吸收渠道将长期受益。过去两周比特币ETF流入约30亿美元，为2026年至今最强流入周期。","key_findings":["市场错误地将Warsh讲话定价为\"鹰派\"，但实质是美联储转向\"不给前瞻指引\"的新制度，政策结果范围将更加广泛，预测市场赔率将大幅震荡","贬值交易是结构性的而非暂时性的，源于美国债务不可持续；收益率上升→利息支出增加→赤字扩大→借贷需求增加，形成自增强循环，政策制定者最终将偏向贬值","AI对政策的影响可能被低估，美联储正关注AI投资周期及AI生产率提升的双重影响，这可能导致对近期通胀压力的更高容忍度","比特币作为稀缺硬资产、稳定币（Tether和Circle）作为短端国债需求吸收渠道，是贬值交易的核心受益方"],"content_tags":["macro_policy"],"topics":["美联储政策","比特币","贬值交易"],"data_points":[{"metric":"9月加息概率（Kalshi预测市场）","value_text":"55%","period":"","basis":"actual","context":"9月加息概率（Kalshi预测市场）：约55%（实际，市场定价）"},{"metric":"比特币价格","value_text":"81,000","period":"2026年","basis":"actual","context":"比特币价格：较约$81,000高点下跌约3%，维持$77,000-$78,000区间（实际，2026年8月30日）"},{"metric":"过去两周比特币ETF净流入","value_text":"30亿","period":"2026年","basis":"actual","context":"过去两周比特币ETF净流入：约$30亿（实际，2026年至今最强流入周期）"},{"metric":"2026年至今比特币现货ETF净流入","value_text":"19.21亿","period":"2026年","basis":"actual","context":"2026年至今比特币现货ETF净流入：-$19.21亿（实际，净流出）"},{"metric":"比特币现货ETF历史总流入","value_text":"566.21亿","period":"","basis":"actual","context":"比特币现货ETF历史总流入：$566.21亿（实际）"},{"metric":"所有现货比特币ETF合计持仓","value_text":"1,258","period":"2026年","basis":"actual","context":"所有现货比特币ETF合计持仓：约1,258K BTC，总资产约$976亿（实际，截至2026年8月）"}],"entities":["美联储（Federal Reserve）","主席Warsh","Jackson Hole经济研讨会","比特币（Bitcoin）","黄金（Gold）","稳定币（Stablecoin）","Tether","Circle（CRCL）","BlackRock IBIT","Grayscale GBTC"],"evidence":[],"reasons":["正文无AI基础设施相关证据，仅提及AI乐观情绪但无实质基建传导。"],"ranking_evidence":["美联储主席Warsh讲话","比特币ETF流入约30亿美元"],"false_positive_checks":["AI仅作为背景提及，无基建投资逻辑。"],"failure_code":"","downloaded":false,"download_href":"","llm_model":"deepseek-v4-flash","ranked_at":"2026-09-02T13:53:25.027Z"},{"media_id":"pdf_19ee3075e13eb6fc6b0a6821afb4b957_b retionary"}],"research_subject":"","executive_summary":"高盛在2026年亚洲领袖大会上与比亚迪董事会秘书兼首席投资官John Lee进行炉边对话后发布研报，维持A股和H股\"买入\"评级，目标价分别为137元人民币和134港元（较现价分别有55.3%和53.7%上行空间），A/H股均列入APAC Convection List。比亚迪管理层提出超越汽车龙头的定位，立志成为全球能源解决方案龙头，战略涵盖三大支柱：电动化加速与闪充基建（第二代刀片电池缩短充电时间至接近加油水平，5个月建成10,000个闪充站，2026年底目标20,000个，规划总数90,000个）、车与可再生能源生态协同（2025年电池出货量超300 GWh，其中40-50 GWh来自储能系统，规划将90,000个闪充站与自有车队整合实现双向能量流动）、以及覆盖自动驾驶与机器人的\"物理AI\"战略（天神之眼ADAS已积累2.2亿公里数据，自研璇玑A3芯片）。高盛预测比亚迪总销量从2025年460万辆增长至2030年750万辆，海外市场贡献2025-2030年增量销量的88%，海外利润贡献从2025年64%提升至2030年81%。公司年研发支出达600亿元人民币。主要风险为电动车竞争加剧、海外扩张慢于预期、外部电池销售低于预期。","key_findings":["比亚迪战略愿景从汽车龙头升级为全球能源解决方案龙头，覆盖电动化、储能生态和物理AI三大方向","高盛维持A/H股\"买入\"评级，目标价Rmb137/HK$134，均列入APAC Convection List","高盛预测2030年销量达750万辆，海外市场贡献2025-2030年增量销量的88%","闪充基建快速推进：5个月建成10,000个闪充站，规划总数90,000个"],"content_tags":[],"topics":["电动车","闪充站","储能"],"data_points":[{"metric":"A股目标价","value_text":"137元","period":"","basis":"valuation","context":"A股目标价：137元人民币，高盛估值"},{"metric":"H股目标价","value_text":"134港元","period":"","basis":"valuation","context":"H股目标价：134港元，高盛估值"},{"metric":"A股现价","value_text":"88.2元","period":"","basis":"actual","context":"A股现价：88.2元人民币，实际（报告发布时）"},{"metric":"A股上行空间","value_text":"55.3%","period":"","basis":"valuation","context":"A股上行空间：55.3%，估值"},{"metric":"2030年总销量预测","value_text":"750万","period":"2030年","basis":"forecast","context":"2030年总销量预测：750万辆，高盛预测"},{"metric":"2025年总销量","value_text":"460万","period":"2025年","basis":"actual","context":"2025年总销量：460万辆，实际"}],"entities":["公司：比亚迪（002594.SZ","1211.HK）","产品：电动车","第二代刀片电池","闪充站","储能系统","天神之眼ADAS","璇玑A3芯片","技术：物理AI","自动驾驶"],"evidence":[],"reasons":["正文主要讨论电动车与能源解决方案，虽提及储能与物理AI，但无AI数据中心或算力硬件投资逻辑。"],"ranking_evidence":["2030年总销量预测750万辆","规划90,000个闪充站"],"false_positive_checks":["物理AI与自动驾驶相关，但非AI基础设施"],"failure_code":"","downloaded":false,"download_href":"","llm_model":"deepseek-v4-flash","ranked_at":"2026-09-02T13:53:25.027Z"},{"media_id":"pdf_19ee3075e13eb6fc6b0a6821afb4b957_d18d41b1f3d91678efc8dafacf0a50417442602265681522","title":"高盛-中国经济展望：从疲弱走向更疲弱-260901.pdf","source_path":"环球研报直通车 / 2026年国际顶级投行研报 / 9月 / 9.2 / 高盛-中国经济展望：从疲弱走向更疲弱-260901.pdf","local_relative_path":"2026/9月/9.2/高盛-中国经济展望：从疲弱走向更疲弱-260901.pdf","saved_path":"/Users/leon/Stock/investment-research-reports/downloads/2026/9月/9.2/高盛-中国经济展望：从疲弱走向更疲弱-260901.pdf","snapshot_date":"2026-09-02","priority":"P3","rank":35,"score":15,"report_type":"macro","report_type_label":"宏观经济","report_type_reason":"报告主要讨论中国GDP增速预测与宏观政策，属于宏观经济研究。","sectors":[],"research_subject":"","executive_summary":"高盛将2026年中国实际GDP增速预测从4.7%下调至4.6%，标题直指经济动能\"从疲弱走向更疲弱\"。7月关键经济指标全面低于预期：工业增加值4.6%（共识5.2%）、零售销售0.5%（共识1.5%）、固定资产投资（年初至今）-6.5%（共识-6.2%）。经济高度分化，出口和电力生产相对较强，房地产和投资持续疲软。通缩压力有所缓解，PPI预计从2025年的-2.6%回升至2026年的+2.0%，由成本推动型通胀（能源价格上涨）和政府\"反内卷\"举措驱动。政策方面，预计OMO 7天逆回购利率维持在1.40%不变，广义财政赤字扩大至GDP的11.5%（扩大0.5pp），人民币对美元汇率预计12个月内升至6.40、2026年末达6.70。AI相关产品贡献了2026年出口增长约9个百分点，成为名义出口的重要支撑。","key_findings":["2026年GDP增速预测下调至4.6%，经济动能从弱到更弱，Q3存在下行风险。","7月工业增加值、零售销售、固定资产投资全面低于预期，出口是少数亮点。","再通胀由成本推动（能源）和\"反内卷\"政策驱动，PPI预计转正至+2.0%。","货币政策维持宽松但不降息，财政赤字扩大0.5pp至GDP的11.5%，人民币预计温和升值。"],"content_tags":["macro_policy"],"topics":["中国GDP","货币政策","财政政策"],"data_points":[{"metric":"2026年实际GDP增速","value_text":"4.6%","period":"2026年","basis":"actual","context":"2026年实际GDP增速：4.6%（较此前4.7%下调），预测"},{"metric":"2025年实际GDP增速","value_text":"5.0%","period":"2025年","basis":"actual","context":"2025年实际GDP增速：5.0%，实际值"},{"metric":"7月工业增加值","value_text":"+4.6%","period":"","basis":"actual","context":"7月工业增加值：+4.6%（共识5.2%），实际值"},{"metric":"7月零售销售","value_text":"+0.5%","period":"","basis":"actual","context":"7月零售销售：+0.5%（共识1.5%），实际值"},{"metric":"7月固定资产投资（年初至今）","value_text":"-6.5%","period":"","basis":"actual","context":"7月固定资产投资（年初至今）：-6.5%（共识-6.2%），实际值"},{"metric":"2026年CPI预测","value_text":"1.0%","period":"2026年","basis":"forecast","context":"2026年CPI预测：1.0%，预测"}],"entities":["机构：高盛","中国","地区：中国","标签：GDP增速","CPI","PPI","出口","再通胀","反内卷"],"evidence":[],"reasons":["正文核心是中国经济展望，AI相关产品仅作为出口支撑提及，无AI基建投资逻辑。"],"ranking_evid 0901.pdf","snapshot_date":"2026-09-02","priority":"P3","rank":39,"score":10,"report_type":"industry","report_type_label":"行业研究","report_type_reason":"报告为美国汽车行业销量数据，属于行业研究。","sectors":[{"name_cn":"可选消费","name_en":"Consumer Discretionary"}],"research_subject":"","executive_summary":"高盛报告显示，2026年8月美国轻型车SAAR约为1,680万辆，高于StreetAccounts共识预期的1,640万辆，且环比7月的1,630万辆和同比2025年8月的1,650万辆均有所上升；绝对销量约139万辆，同比降约6%，环比增约1%。同比下滑主要受销售日减少1天及EV销量大幅回落影响——8月EV（BEV）渗透率约6%（上年同期约10%），EV销量同比下降约48%，因2025年8月存在IRA EV补贴结束前的需求提前效应。混动成为亮点，销量同比增长约21%至约23万辆（渗透率16.5%）。分厂商看，特斯拉销量同比下降约31%，福特和通用汽车分别下降约10%和11%；Stellantis凭借大型皮卡销量同比增长41%驱动份额显著提升。库存下降至约261万辆，低于疫情前历史区间；单车激励支出约-3,266美元，同比降7%、环比升2%。大型皮卡市场中，Stellantis份额从15.6%跃升至21.5%，GM和福特均有所下降。","key_findings":["8月SAAR超预期，但绝对销量同比仍下滑，EV退坡和销售日减少是主要拖累。","混动车型增速显著（+21%），正在替代EV成为传统车企过渡战略的核心。","特斯拉销量同比降幅达31%，EV整体渗透率同比腰斩，反映补贴退坡后的真实需求考验。","Stellantis凭借大型皮卡逆势增41%，在皮卡市场实现份额大幅跃升。"],"content_tags":["supply_demand"],"topics":["汽车销量","EV","混动"],"data_points":[{"metric":"8月SAAR约1,680万辆，实际值，高于共识1,640万辆（Source","value_text":"","period":"","basis":"actual","context":"8月SAAR约1,680万辆，实际值，高于共识1,640万辆（Source: Motor Intelligence / Wards）"},{"metric":"8月绝对销量约139万辆，同比降约6%，实际值","value_text":"8","period":"","basis":"actual","context":"8月绝对销量约139万辆，同比降约6%，实际值"},{"metric":"EV（BEV）渗透率约6%，上年同期约10%，实","value_text":"6%","period":"","basis":"actual","context":"EV（BEV）渗透率约6%，上年同期约10%，实际值"},{"metric":"EV销量同比下降约48%，实际值","value_text":"48%","period":"","basis":"actual","context":"EV销量同比下降约48%，实际值"},{"metric":"混动销量约23万辆，同比增长约21%，实际值","value_text":"23万","period":"","basis":"actual","context":"混动销量约23万辆，同比增长约21%，实际值"},{"metric":"特斯拉销量同比下降约31%，实际值（Motor","value_text":"31%","period":"","basis":"actual","context":"特斯拉销量同比下降约31%，实际值（Motor Intelligence估计）"}],"entities":["公司：福特","通用汽车","特斯拉","Stellantis","Rivian","产品：大型皮卡","EV","混动","行业：美国汽车","轻型车"],"evidence":[],"reasons":["报告主要涉及汽车销量和EV渗透率，无AI基础设施相关证据。","EV和混动属于汽车行业，与AI基建无关。"],"ranking_evidence":["8月EV（BEV）渗透率约6%（上年同期约10%），EV销量同比下降约48%。","混动成为亮点，销量同比增长约21%至约23 ummary":"瑞银针对2026年8月28日中国监管机构推出的住房销售体系改革进行分析。改革核心包括：推动现房销售转型、项目公司融资模式（每个项目绑定一家\"主办银行\"、资金封闭管理）、现金流顺序根本性调整（开发商需自筹土地款，银行贷款覆盖建设周期至竣工，首笔本金偿还一般在竣工备案后），以及按揭政策放宽（最长贷款期限从30年延长至40年，月供收入比上限从55%提高至60%）。报告认为新政对银行按揭贷款组合温和利好，预计按揭余额将在2026年触底，2028E-30E年间恢复至0-2%的年增长率，但开发商贷款继续收缩，总体贷款规模影响有限。资产质量方面，房地产市场企稳对按揭短期影响略偏正面，但长期需关注边际风险借款人的增加。开发商因现金流收紧对项目开工保持谨慎，预计开发贷不良不会显著增加。报告维持对高股息大型国有银行的积极看法，包括工行H股、建行H股、中行H股和信行H股，同时在区域银行中偏好优质成长型标的如宁波银行和江苏银行。","key_findings":["新现房销售体系对银行按揭贷款组合温和利好，预计按揭余额2026年触底后恢复至0-2%年增长","开发贷继续收缩，银行相关贷款总体规模影响有限","大型国有银行（高股息特征）及优质区域银行更具韧性，资产结构优势突出","资产质量方面短期略偏正面，长期需关注按揭组合中边际风险借款人的增加"],"content_tags":["macro_policy"],"topics":["银行业","房地产政策"],"data_points":[{"metric":"中国8月非官方制造业PMI","value_text":"51.5","period":"","basis":"actual","context":"中国8月非官方制造业PMI：51.5（高盛预测50.6，彭博预期51.0），前值50.9，实际值"},{"metric":"新订单分项指数","value_text":"52.0","period":"","basis":"actual","context":"新订单分项指数：52.0（前值50.9），实际值"},{"metric":"产出分项指数","value_text":"53.1","period":"","basis":"actual","context":"产出分项指数：53.1（前值51.5），实际值"},{"metric":"就业分项指数","value_text":"50.0","period":"","basis":"actual","context":"就业分项指数：50.0（前值50.6），实际值"},{"metric":"新出口订单分项指数","value_text":"52.2","period":"","basis":"actual","context":"新出口订单分项指数：52.2（前值50.2），实际值"},{"metric":"输入价格分项指数","value_text":"52.2","period":"","basis":"actual","context":"输入价格分项指数：52.2（前值51.7），实际值"}],"entities":["公司：工商银行H股","建设银行H股","中国银行H股","中信银行H股","宁波银行","江苏银行","产品","技术：住房按揭贷款","开发贷","项目公司融资模式"],"evidence":[],"reasons":["正文无AI基础设施相关证据，纯银行业分析。"],"ranking_evidence":["按揭贷款期限延长","开发贷收缩"],"false_positive_checks":["无AI基建内容。"],"failure_code":"","downloaded":false,"download_href":"","llm_model":"deepseek-v4-flash","ranked_at":"2026-09-02T13:53:25.027Z"},{"media_id":"pdf_19ee3075e13eb6fc6b0a6821afb4b957_2f1f9015077bd9ea214d69d10819d4ff7442602265681522","title":"野村-亚洲洞察｜亚洲利率：跑赢美国利率的表现可能具有选择性-260831.pdf","source_path":"环球研报直通车 / 2026年国际顶级投行研报 / 9月 / 9.2 / 野村-亚洲洞察｜亚洲利率：跑赢美国利率的表现可能具有选择性-260831.pdf","local_relative_path":"2026/9月/9.2/野村-亚洲洞察｜亚洲利率：跑赢美国利率的表现可能具有选择性-260831.pdf","saved_path":"/Users/leon/Stock/investment-research-reports/downloads/2026/9月/9.2/野村-亚洲洞察｜亚洲利率：跑赢美国利率的表现可能具有选择性-260831.pdf","snapshot_date":"2026-09-02","priority":"P3","rank":44,"score":10,"report_type":"macro","report_type_label":"宏观经济","report_type_reason":"报告分析亚洲利率走势，属于宏观经济和利率策略。","sectors":[],"research_subject":"","executive_summary":"在Warsh杰克逊霍尔鹰派讲话后美国短期利率重新定价为年内加息1.5次的背景下，野村认为亚洲利率跑赢美国利率的表现将是选择性的，而非普遍性的。关键逻辑在于：已加过息的市场（如韩国）利率更可能跑赢美债；尚未开始加息但压力正在累积的市场（如台湾或印度），美联储加息反而可能降低其加息门槛，从而无法跑赢。野村对韩国利率重新进入\"收\"（Receive）方向，继续推荐香港长端利率兑新加坡元的\"收\"交易，对印度持中性观望等待GDP数据，维持泰国利率\"付\"（Pay）和趋陡交易。","key_findings":["亚洲利率能否跑赢美国利率取决于各市场自身加息周期阶段及油价、美元走势等变量，表现将是选择性的","韩国央行上周给出短期鸽派但中期偏鹰的信号，已完成两次加息且USD/KRW显著回落，利率应有一定跑赢空间，野村重新进入韩国H27-5y NDIRS的\"收\"方向","香港长端利率在美债长端收益率企稳背景下，叠加本地非金融债券发行量处于低位，有望跑赢其他亚洲（除日本）市场","印度市场已定价10月与12月各加息25bp、未来12个月共约100bp加息，野村在首次加息前保持中性，等待Q2 GDP数据"],"content_tags":["macro_policy"],"topics":["亚洲利率","货币政策"],"data_points":[{"metric":"美国短期利率重新定价","value_text":"1.5","period":"","basis":"actual","context":"美国短期利率重新定价：年内加息1.5次（实际，市场定价）"},{"metric":"韩国H27-5y NDIRS当前水平/目标/重新评估线","value_text":"4.075%","period":"","basis":"actual","context":"韩国H27-5y NDIRS当前水平/目标/重新评估线：4.075%/3.87%/4.17%（实际，估值/预测/指引）"},{"metric":"印度Q2 GDP野村预测","value_text":"7.8%","period":"","basis":"forecast","context":"印度Q2 GDP野村预测：7.8%（预测，高于市场共识）"},{"metric":"印度市场定价加息幅度","value_text":"10","period":"","basis":"actual","context":"印度市场定价加息幅度：10月25bp、12月25bp，未来12个月共约100bp（实际，市场定价）"},{"metric":"印度RBI 15天VRRR实际吸收/计划","value_text":"1.35万亿","period":"","basis":"actual","context":"印度RBI 15天VRRR实际吸收/计划：INR 1.35万亿/INR 6万亿（实际）"},{"metric":"印度RBI隔夜VRRR规模/投标","value_text":"4万亿","period":"","basis":"actual","context":"印度RBI隔夜VRRR规模/投标：INR 4万亿/INR 2.5万亿（实际）"}],"entities":["韩国央行（BOK）","印度央行（RBI）","泰国央行（BOT）","美联储（Fed）","主席Warsh","韩国（Korea）","香港（Hong Kong）","新加坡（Singapore）","印度（India）","泰国（Thailand）"],"evidence":[],"reasons":["正文无AI基础设施相关证据，纯宏观利率分析。"],"ranking_evidence":["韩国央行加息","印度市场定价加息"],"false_positive_checks":["无AI基建内容。"], 酒旅利润率将承压。下调2026E/2027E/2028E净利润预测，2026年预计仍为净亏损状态。长期护城河（本地服务生态、即时零售）依然稳固，估值基于DCF模型。","key_findings":["2Q26核心本地商业运营利润同比+52%，超预期幅度最大，但复苏节奏非线性，3Q将受季节性及费用转移影响","下调2026–2028年盈利预测：2027E/2028E净利润分别下调22.8%/17.4%，以反映竞争持续","Keeta海外沙特7月已实现盈亏平衡，香港持续盈利，国际化战略转向盈利优先","即时零售及酒旅业务利润稳定，到店/到家竞争格局大体稳定"],"content_tags":["industry_structure"],"topics":["本地生活服务","即时零售"],"data_points":[{"metric":"目标价","value_text":"110","period":"","basis":"valuation","context":"目标价：HK$ 110（估值）"},{"metric":"2Q26总收入","value_text":"1,046.43亿","period":"","basis":"actual","context":"2Q26总收入：Rmb 1,046.43亿，同比+14%（实际，超MSe 2.8%）"},{"metric":"2Q26调整后EBITDA","value_text":"40.98亿","period":"","basis":"actual","context":"2Q26调整后EBITDA：Rmb 40.98亿，同比+47%（实际，超MSe 96.5%）"},{"metric":"2Q26核心本地商业收入","value_text":"715.31亿","period":"","basis":"actual","context":"2Q26核心本地商业收入：Rmb 715.31亿，同比+10%（实际）；运营利润Rmb 56.68亿，同比+52%（实际）；OPM 7.9%（+2.2ppt）"},{"metric":"2Q26新业务收入","value_text":"331.12亿","period":"","basis":"actual","context":"2Q26新业务收入：Rmb 331.12亿，同比+25%（实际）；运营亏损Rmb -17.39亿（实际，好于MSe的-24亿）"},{"metric":"2Q26食品配送单位经济效应转正（实际）；预计3","value_text":"2","period":"","basis":"actual","context":"2Q26食品配送单位经济效应转正（实际）；预计3Q因季节性回落（预测）"}],"entities":["公司：美团（Meituan","3690.HK）","产品","业务：食品配送","到店","酒旅（IHT）","即时零售","优选（Xiaoxiang Supermarket）","Keeta（海外）","行业：本地生活服务"],"evidence":[],"reasons":["正文无AI基础设施相关内容","主要涉及食品配送、到店酒旅等本地生活服务"],"ranking_evidence":["目标价110港元","2Q26总收入1,046亿人民币，同比+14%","核心本地商业收入715亿，运营利润57亿"],"false_positive_checks":["无数据中心或AI相关表述，不存在假阳性"],"failure_code":"","downloaded":false,"download_href":"","llm_model":"deepseek-v4-flash","ranked_at":"2026-09-02T13:53:25.027Z"},{"media_id":"pdf_19ee3075e13eb6fc6b0a6821afb4b957_2616bbbaf2543074ecc1496d7ef417137442602265681522","title":"大摩-日本交通运输行业深度研究-260831.pdf","source_path":"环球研报直通车 / 2026年国际顶级投行研报 / 9月 / 9.2 / 大摩-日本交通运输行业深度研究-260831.pdf","local_relative_path":"2026/9月/9.2/大摩-日本交通运输行业深度研究-260831.pdf","saved_path":"/Users/leon/Stock/investment-research-reports/downloads/2026/9月/9.2/大摩-日本交通运输行业深度研究-260831.pdf","snapshot_date":"2026-09-02","priority":"P3","rank":47,"score":5,"report_type":"industry","report_type_label":"行业研究","report_type_reason":"报告主要对象是日本交通运输行业多家公司，属于行业研究。","sectors":[{"name_cn":"工业","name_en":"Industrials"}],"research_subject":"","executive_summary":"摩根士丹利发布日本交通运输行业深度研究，覆盖航空、物流、铁路、旅游、海运五大子行业共28家公司。四大子行业（航空/物流/铁路/旅游）均给予\"In-Line\"评级，海运给予\"Cautious\"评级。报告指出JR东海Tokaido新干线客流持续超公司指引（7-8月累计同比+1%），酒店RevPAR连续三周下滑（8月第3周同比-2.1%），大阪世博会效应消退拖累明显。物流板块推荐Senko Group HD（增持），铁路板块推荐JR九州（增持，目标价较现价+25.8%）和东急（增持，目标价较现价+52.4%），旅游板块推荐富士急行和Kyoritsu Maintenance（均增持）。海运板块全面减持（日本邮船、商船三井、川崎汽船），认为供需恶化和成本通胀风险未被股价充分反映，目标价较现价下行空间45%-61%。","key_findings":["海运板块最悲观，三大海运股目标价较现价有45%-61%下行空间，供需恶化与成本通胀风险未被充分定价","JR东海新干线客流持续超公司指引，若趋势延续盈利预测有上调空间；酒店RevPAR连续三周负增长，世博会效应消退为主因","物流板块精选Senko Group（增持），铁路板块推荐JR九州和东急（估值修复空间大）"],"content_tags":[],"topics":["交通运输","海运","铁路"],"data_points":[{"metric":"海运板块加权平均目标价空间","value_text":"-52.4%","period":"","basis":"valuation","context":"海运板块加权平均目标价空间：-52.4%"},{"metric":"日本邮船目标价3,440日元（现价7,115日元","value_text":"3,440日元","period":"","basis":"valuation","context":"日本邮船目标价3,440日元（现价7,115日元），下行空间-51.7%"},{"metric":"川崎汽船目标价1,320日元（现价3,382日元","value_text":"1,320日元","period":"","basis":"valuation","context":"川崎汽船目标价1,320日元（现价3,382日元），下行空间-61.0%"},{"metric":"东急目标价2,510日元（现价1,647日元），","value_text":"2,510日元","period":"","basis":"forecast","context":"东急目标价2,510日元（现价1,647日元），上行空间+52.4%（预测市盈率10.3x）"},{"metric":"JR九州目标价4,520日元（现价3,594日元","value_text":"4,520日元","period":"","basis":"forecast","context":"JR九州目标价4,520日元（现价3,594日元），上行空间+25.8%（预测市盈率10.9x）"},{"metric":"JR东海Tokaido新干线8月东京方向闸口客流","value_text":"8","period":"","basis":"actual","context":"JR东海Tokaido新干线8月东京方向闸口客流同比+1%，F3/27第2季度（7-8月累计）客流同比约+1%"}],"entities":["日本航空（JAL）","ANA控股","Senko Group HD","日本通运HD","Yamato HD","JR东海","JR九州","东急","西武HD","富士急行"],"evidence":[],"reasons":["正文无AI基础设施相关内容","属于交通运输行业，与AI基建无关"],"ranking_evidence":["海运板块目标价空间-52.4%","JR东海客流同比+1%"],"false_positive_checks":["无AI相关证据"],"fail 最长可延长至7年（目前3年），本金偿还可推迟至项目竣工后，有助于缓解开发商资金压力","按揭贷款最长期限延长至40年（目前30年），假设100万元贷款、85%LTV、3%利率，月供减少幅度相当于家庭可支配收入的高个位数百分比"],"content_tags":["rating_valuation","supply_demand","catalysts_risks"],"topics":["房地产政策","现房销售"],"data_points":[{"metric":"政策发布日期","value_text":"2026","period":"2026年","basis":"actual","context":"政策发布日期：2026年8月28日（实际）"},{"metric":"按揭贷款最长期限","value_text":"40","period":"","basis":"guidance","context":"按揭贷款最长期限：延长至40年（目前30年）（政策指引）"},{"metric":"开发贷款最长期限","value_text":"7","period":"","basis":"guidance","context":"开发贷款最长期限：延长至7年（目前3年）（政策指引）"},{"metric":"土地成交量较2020年峰值降幅（2025年）","value_text":"72%","period":"2020年","basis":"actual","context":"土地成交量较2020年峰值降幅（2025年）：下降72%（实际）"},{"metric":"土地成交额较2020年峰值降幅（2025年）","value_text":"64%","period":"2020年","basis":"actual","context":"土地成交额较2020年峰值降幅（2025年）：下降64%（实际）"},{"metric":"2026年前7个月土地成交量同比降幅","value_text":"26%","period":"2026年","basis":"actual","context":"2026年前7个月土地成交量同比降幅：26%（实际）"}],"entities":["住建部（MOHURD）","自然资源部","国家金融监督管理总局（NFRA）","中国人民银行（PBOC）","中国证监会（CSRC）","华润置地","CRL","中海地产","COLI","金茂"],"evidence":[],"reasons":["正文无AI基础设施相关证据，纯房地产政策分析。"],"ranking_evidence":["按揭贷款最长期限延长至40年","开发贷款期限延长至7年"],"false_positive_checks":["无AI基建内容。"],"failure_code":"","downloaded":false,"download_href":"","llm_model":"deepseek-v4-flash","ranked_at":"2026-09-02T13:53:25.027Z"},{"media_id":"pdf_19ee3075e13eb6fc6b0a6821afb4b957_3987cc579239380bc56e56c17e68ad817442602265681522","title":"花旗-爱尔眼科(300015.SZ)：2026年上半年业绩不及预期主因税项影响；海外扩张支撑中期增长-260831.pdf","source_path":"环球研报直通车 / 2026年国际顶级投行研报 / 9月 / 9.2 / 花旗-爱尔眼科(300015.SZ)：2026年上半年业绩不及预期主因税项影响；海外扩张支撑中期增长-260831.pdf","local_relative_path":"2026/9月/9.2/花旗-爱尔眼科(300015.SZ)：2026年上半年业绩不及预期主因税项影响；海外扩张支撑中期增长-260831.pdf","saved_path":"/Users/leon/Stock/investment-research-reports/downloads/2026/9月/9.2/花旗-爱尔眼科(300015.SZ)：2026年上半年业绩不及预期主因税项影响；海外扩张支撑中期增长-260831.pdf","snapshot_date":"2026-09-02","priority":"P3","rank":51,"score":5,"report_type":"company","report_type_label":"公司研究","report_type_reason":"报告主要结论锚定爱尔眼科单一公司，给予买入评级和目标价，属于公司研究。","sectors":[{"name_cn":"医药卫生","name_en":"Health Care"}],"research_subject":"","executive_summary":"花旗研报指出，爱尔眼科2026年上半年营收同比增长3.8%至119.5亿元，低于花旗预期3%和一致预期5%；净利润同比下滑33.8%至13.6亿元，低于预期约40%，主因7.56亿元补缴税款及滞纳金，剔除后归母利润实际同比增长约3%。毛利率同比降2.5个百分点至46.1%，受维护成本、人员薪酬及新设备折旧拖累，但营业利润率基本稳定在23.6%。门诊量增长8.3%，但手术量仅增长1.1%，反映国内消费需求持续疲软。管理层预计2026年下半年好于上半年，毛利率保持基本稳定，新技术支撑屈光手术单价适度提升。海外扩张是中期核心增长动力：欧洲下半年维持双位数增长，巴西业务2026年8-9月并表，管理层指引未来三年海外收入占比超30%。花旗维持买入评级，基于DCF模型将目标价从13.5元下调至12.0元，反映FY26补税影响及巴西较低毛利率。","key_findings":["1H26净利润同比降33.8%主要受7.56亿元补税一次性冲击，剔除后实际利润增约3%，核心经营面基本平稳","海外扩张（欧洲、巴西、英国）是中期增长的核心驱动力，管理层指引三年内海外收入占比超30%","国内技术升级（SMILE Pro、EVO ICL V5等）带来33%-175%的定价溢价，形成竞争对手难以复制的护城河","1+8+N医院建设接近完成，折旧摊销压力预计从FY26E见顶回落，290家早期医院同店增长空间巨大"],"content_tags":["industry_structure"],"topics":["眼科医疗","业绩"],"data_points":[{"metric":"1H26营收","value_text":"119.5亿","period":"","basis":"actual","context":"1H26营收：119.5亿元，同比增长3.8%（实际值，低于花旗预期3%）"},{"metric":"1H26净利润","value_text":"13.6亿","period":"","basis":"actual","context":"1H26净利润：13.6亿元，同比下降33.8%（实际值，低于花旗预期40%）"},{"metric":"补缴税款及滞纳金","value_text":"7.56亿","period":"","basis":"","context":"补缴税款及滞纳金：7.56亿元（一次性影响）"},{"metric":"毛利率","value_text":"46.1%","period":"","basis":"actual","context":"毛利率：46.1%，同比下滑2.5个百分点（实际值）"},{"metric":"营业利润率","value_text":"23.6%","period":"","basis":"actual","context":"营业利润率：23.6%（实际值，基本稳定）"},{"metric":"门诊量增长","value_text":"8.3%","period":"","basis":"actual","context":"门诊量增长：8.3%；手术量增长：1.1%（实际值，1H26）"}],"entities":["公司：爱尔眼科（Aier Eye Hospital Group","300015.SZ）","Clínica Baviera","产品","技术：SMILE Pro（Zeiss VisuMax 800）","Precise 4.0（VISULYZE）","EVO ICL V5","AierGPT","行业：眼科医疗服务","医疗连锁"],"evidence":[],"reasons":["正文无AI基础设施相关内容","属于医药行业，与AI基建无关"],"ranking_evidence":["1H26营收119.5亿元，净利润13.6亿元","目标价12.0元"],"false_positive_checks":["无AI相关证据"],"failure_code":"","downloaded":false,"download_href":"","llm_model":"deepseek-v4-flash","ranked_at":"2026-09-02T13:53:25.027Z"},{"media_id":"pdf_19ee3075e13eb6fc6b0a6821afb4b957_92c84878824466a41acc5c3f7d1db2c97442602265681522","title":"花旗-瑞博生物(6938.HK)2026年上半年业绩：高差异化管线获验证，成功扭亏为盈-260831.pdf","source_path":"环球研报直通车 / 2026年国际顶级投行研报 / 9月 / 9.2 / 花旗-瑞博生物(6938.HK)2026年上半年业绩：高差异化管线获验证，成功扭亏为盈-260831.pdf","local_relative_path":"2026/9月/9.2/花旗-瑞博生物(6938.HK)2026年上半年业绩：高差异化管线获验证，成功扭亏为盈-260831.pdf","saved_path":"/Users/leon/Stock/investment-research-reports/downloads/2026/9月/9.2/花旗-瑞博生物(6938.HK)2026年上半年业绩：高差异化管线获验证，成功扭亏为盈-260831.pdf","snapshot_date":"2026-09-02","priority":"P3","rank":52,"score":5,"report_type":"company","report_type_label":"公司研究","report_type_reason":"报告主要结论锚定瑞博生物单一公司，给予买入评级和目标价，属于公司研究。","sectors":[{"name_cn":"医药卫生","name_en":"Health Care"}],"research_subject":"","executive_summary":"花旗研报指出，瑞博生物2026年上半年实现营收4.2亿元（同比大增304%），录得净利润2,000万元（1H25为净亏损8,800万元），首次扭亏为盈，主要受Madrigal、勃林格殷格翰和齐鲁制药等合作伙伴的首付款及里程碑付款驱动。研发费用增至1.98亿元（+53%），因管线及适应症扩展。核心管线进展顺利：vortosiran的Ph2a试验在30例CAD患者中显示400mg剂量下FXI活性平均降低92%，安全性良好；SPAF和VTE的Ph2b如期推进，预计2H27-2H28数据读出。BD5044在TG/ApoC3降低方面展现同类最佳潜力（最大降幅75%/84%），中国Ph2患者入组完成，预计2H26数据读出；肝外递送临床前数据积极，额外肝外递送平台更新预计4Q26发布，首个肾脏定向项目CTA预计1H27提交。花旗认为首次盈利来自合作验证了公司高度差异化的管线与强大的临床能力。基于BD进展上调FY26/27营收预测344%/131%，将EPS预测从-2.27/-2.67元上调至-0.95/-2.59元，目标价从102港元下调至96港元，维持买入/高风险评级。","key_findings":["1H26首次实现扭亏为盈（净利润2,000万元），合作首付款及里程碑付款验证了差异化管线价值和临床能力","核心管线vortosiran Ph2a数据优异（FXI活性降92%），BD5044展现同类最佳潜力，肝外递送平台为关键价值催化剂","花旗上调FY26/27营收预测344%/131%，但目标价因摊薄等因素从102港元微调至96港元"],"content_tags":["catalysts_risks"],"topics":["生物医药","业绩"],"data_points":[{"metric":"1H26营收","value_text":"4.2亿","period":"","basis":"actual","context":"1H26营收：4.2亿元，同比增长304%（实际值）"},{"metric":"1H26净利润","value_text":"2,000万","period":"","basis":"actual","context":"1H26净利润：2,000万元（实际值，1H25净亏损8,800万元）"},{"metric":"1H26研发费用","value_text":"1.98亿","period":"","basis":"actual","context":"1H26研发费用：1.98亿元，同比增长53%（实际值）"},{"metric":"vortosiran Ph2a","value_text":"400","period":"","basis":"","context":"vortosiran Ph2a：400mg剂量下FXI活性平均降低92%（临床试验数据）"},{"metric":"BD5044","value_text":"3","period":"","basis":"" nt_tags":["financials","catalysts_risks","industry_structure","macro_policy","supply_demand"],"topics":["汽车零部件","业绩"],"data_points":[{"metric":"2Q26毛利率","value_text":"18.2%","period":"","basis":"actual","context":"2Q26毛利率：18.2%，同比降1.4个百分点、环比降1.1个百分点（实际值）"},{"metric":"FY26/27/28E净利润预测","value_text":"15.99亿","period":"","basis":"forecast","context":"FY26/27/28E净利润预测：15.99亿/18.18亿/20.38亿元（花旗预测，下调8-9%）"},{"metric":"FY26/27/28E收入预测下调幅度","value_text":"4%","period":"","basis":"forecast","context":"FY26/27/28E收入预测下调幅度：4%（花旗预测调整）"},{"metric":"目标价","value_text":"145元","period":"2026E","basis":"forecast","context":"目标价：145元/股（从189元下调，估值预测），对应2026E 26倍PE（此前31倍）"},{"metric":"当前股价","value_text":"81.48元","period":"2026年","basis":"","context":"当前股价：81.48元（2026年8月28日），预期总回报80.0%"},{"metric":"海外收入指引","value_text":"26","period":"","basis":"forecast","context":"海外收入指引：FY26E 10亿元、FY28E约30亿元、FY30E约60-70亿元（管理层指引）"}],"entities":["601799.SH）","大众汽车（Volkswagen）","华为鸿蒙（Harmony）","产品：车灯（前照灯","尾灯","行业：汽车零部件","车灯制造","地区：中国","塞尔维亚（海外工厂）","主题标签：海外扩张"],"evidence":[],"reasons":["正文无AI基础设施相关内容","属于汽车行业，与AI基建无关"],"ranking_evidence":["2Q26毛利率18.2%","目标价145元"],"false_positive_checks":["无AI相关证据"],"failure_code":"","downloaded":false,"download_href":"","llm_model":"deepseek-v4-flash","ranked_at":"2026-09-02T13:53:25.027Z"},{"media_id":"pdf_19ee3075e13eb6fc6b0a6821afb4b957_e0ded36d6a6029fee6e693d093b63e8f7442602265681522","title":"高盛-日本汽车行业：人形机器人与汽车，共建物理AI-260831.pdf","source_path":"环球研报直通车 / 2026年国际顶级投行研报 / 9月 / 9.1 / 高盛-日本汽车行业：人形机器人与汽车，共建物理AI-260831.pdf","local_relative_path":"2026/9月/9.1/高盛-日本汽车行业：人形机器人与汽车，共建物理AI-260831.pdf","saved_path":"/Users/leon/Stock/investment-research-reports/downloads/2026/9月/9.1/高盛-日本汽车行业：人形机器人与汽车，共建物理AI-260831.pdf","snapshot_date":"2026-09-01","priority":"P0","rank":1,"score":95,"report_type":"industry","report_type_label":"行业研究","report_type_reason":"报告聚焦日本汽车行业在人形机器人领域的机遇，属于行业研究。","sectors":[{"name_cn":"工业","name_en":"Industrials"},{"name_cn":"信息技术","name_en":"Information Technology"}],"research_subject":"","executive_summary":"高盛2026年8月31日发布日本汽车行业深度报告，大幅上调人形机器人市场预测，2035年销量从138万部上调至648万部，市场规模从约¥6万亿上调至$1,380亿（约¥22万亿）。报告认为汽车行业规模化量产复杂工业产品的能力使其在量产人形机器人方面具备独特优势。高盛从\"Will（意愿）\"、\"Should（必要性）\"、\"Could（能力）\"三维度对全球OEM评分，特斯拉和现代最为积极，日系车企中丰田、本田、三菱汽车相对领先。日本在FA领域拥有全球30-40%份额，但人形机器人领域落后于美国、中国和韩国。波士顿动力Atlas的BOM成本中，执行器占52%、夹爪占32%，执行器组件（电机、轴承、编码器、减速器、驱动器）与传统汽车零部件高度契合。丰田集团同时具备\"需求（劳动力短缺）、紧迫性（BEV转型供应链下滑）、技术（软硬件及量产能力）、承诺（管理层定位）\"四大要素，若技术突破和量产顺利，2035年可达19-54万部人形机器人产量（全球3-8%份额），贡献毛利润增量2-6%。日本政府已设定2040年1,000万台AI机器人目标，预算框架超¥1万亿。报告指出主要风险：过度依赖现场数据、海外基础模型依赖以及传统FA经验不可复制。","key_findings":["高盛大幅上调2035年人形机器人销量预测至648万部（此前138万部），市场规模$1,380亿（此前约¥6万亿）","汽车行业在量产人形机器人方面具备独特优势，执行器/减速器等核心部件与传统汽车零部件高度契合","特斯拉、现代最积极，日系中丰田、本田、三菱汽车相对领先；丰田集团2035年可达19-54万部产量","日本政府设定2040年1,000万台AI机器人目标，预算¥1万亿以上"],"content_tags":[],"topics":["人形机器人","汽车行业","物理AI"],"data_points":[{"metric":"2035年人形机器人销量预测648万部（此前13","value_text":"2035","period":"2035年","basis":"forecast","context":"2035年人形机器人销量预测648万部（此前138万部），预测"},{"metric":"2035年市场规模$1,380亿（约¥22万亿，","value_text":"2035","period":"2035年","basis":"forecast","context":"2035年市场规模$1,380亿（约¥22万亿，此前约¥6万亿），预测"},{"metric":"日本FA（工厂自动化）全球市场份额30-40%，","value_text":"30","period":"","basis":"actual","context":"日本FA（工厂自动化）全球市场份额30-40%，实际"},{"metric":"日本政府目标","value_text":"2030","period":"2030年","basis":"guidance","context":"日本政府目标：2030年导入35万台AI机器人，2040年1,000万台，指引"},{"metric":"支持预算框架超¥1万亿，指引","value_text":"1万亿","period":"","basis":"guidance","context":"支持预算框架超¥1万亿，指引"},{"metric":"波士顿动力Atlas BOM","value_text":"52%","period":"","basis":"actual","context":"波士顿动力Atlas BOM：执行器52%、夹爪32%、NVIDIA半导体4%、传感器2%、电池1%，实际"}],"entities":["丰田汽车","本田","三菱汽车","日产汽车","特斯拉","现代","波士顿动力","Agility Robotics","瑞萨电子","NEC"],"evidence":[],"reasons":["正文明确以人形机器人核心硬件（执行器、减速器等）为主要投资逻辑，属于AI基础设施范畴。"],"ranking_evidence":["2035年人形机器人销量预测648万部，市场规模$1,380亿","执行器占BOM成本52%，与传统汽车零部件高度契合"],"false_positive_checks":["无数据中心相关表述，但人形机器人属于AI硬件基础设施。"],"failure_code":"","downloaded":true,"download_href":"file:/ research_subject":"","executive_summary":"高盛基于EIA最新发电容量数据发布报告，显示2026年7月美国净新增发电容量+3.4 GW（高于去年同期2.9 GW及9年平均2.3 GW），太阳能（+2.1 GW）和电池储能（+1.5 GW）为主要增量。年初至今完成进度上，风电（78%）和电池储能（73%）领先，太阳能（40%）和天然气CCGT（35%）次之。煤电退役连续第三个月零新增，年初至今仅完成全年预测（3.7 GW）的46%，进展缓慢。项目储备方面，2027年太阳能和风电储备分别达到预计净新增的103%和97%，但2028-2030年可再生能源储备大幅下降，反映开发周期延长或税收抵免政策不确定性。高盛认为劳动力可用性是AI/数据中心电力需求增长的关键制约因素，EPC承包商减少及大型基建项目竞争加剧了劳动力紧张。高盛维持美国电力需求至2030年3.5%年复合增长率（CAGR）预测，买入NXT、XEL、FSLR、PWR等。","key_findings":["7月净新增发电容量+3.4 GW，太阳能（+2.1 GW）和电池储能（+1.5 GW）为主要增量来源","煤电退役连续三个月为零，年初至今仅完成全年预测的46%，进展缓慢","可再生能源项目储备在2027年充沛（太阳能103%、风电97%），但2028-2030年大幅下降","劳动力可用性是AI/数据中心电力需求增长的关键制约因素，CCGT项目经理和输电线路工尤为紧缺"],"content_tags":["supply_demand"],"topics":["电力需求","数据中心","可再生能源"],"data_points":[{"metric":"7月净新增发电容量+3.4 GW，实际（高于20","value_text":"7","period":"2025年","basis":"actual","context":"7月净新增发电容量+3.4 GW，实际（高于2025年同期2.9 GW及9年平均2.3 GW）"},{"metric":"公用事业级太阳能7月新增+2.1 GW，实际","value_text":"7","period":"","basis":"actual","context":"公用事业级太阳能7月新增+2.1 GW，实际"},{"metric":"电池储能7月新增+1.5 GW，实际","value_text":"7","period":"","basis":"actual","context":"电池储能7月新增+1.5 GW，实际"},{"metric":"1-7月累计新增占全年预测比重47%，实际","value_text":"1","period":"","basis":"actual","context":"1-7月累计新增占全年预测比重47%，实际"},{"metric":"年内风电新增完成全年预测的78%，实际","value_text":"78%","period":"","basis":"actual","context":"年内风电新增完成全年预测的78%，实际"},{"metric":"年内电池储能新增完成全年预测的73%，实际","value_text":"73%","period":"","basis":"actual","context":"年内电池储能新增完成全年预测的73%，实际"}],"entities":["NXT","XEL","FSLR","PWR","NEE","Quanta Services","NextEra","Argan","Primoris","太阳能"],"evidence":[],"reasons":["正文明确以AI/数据中心电力需求为主要投资逻辑","劳动力可用性是AI/数据中心电力需求增长的关键制约因素"],"ranking_evidence":["7月净新增发电容量+3.4 GW，太阳能和电池储能为主要增量","高盛维持美国电力需求至2030年3.5%年复合增长率预测"],"false_positive_checks":["无假阳性，直接涉及AI数据中心电力需求"],"failure_code":"","downloaded":true,"download_href":"file:///Users/leon/Stock/investment-research-reports/downloads/2026/9%E6%9C%88/9.1/%E9%AB%98%E7%9B%9B-%E7%BE%8E%E5%9B%BD%E7%94%B5%E5%8A%9B%E9%A1%B9%E7%9B%AE%E5%82%A8%E5%A4%87%EF%BC%9A%E5%A4 报直通车 / 2026年国际顶级投行研报 / 9月 / 9.1 / 巴克莱-中国房地产：1999年以来规模最大的住房改革-260831.pdf","local_relative_path":"2026/9月/9.1/巴克莱-中国房地产：1999年以来规模最大的住房改革-260831.pdf","saved_path":"/Users/leon/Stock/investment-research-reports/downloads/2026/9月/9.1/巴克莱-中国房地产：1999年以来规模最大的住房改革-260831.pdf","snapshot_date":"2026-09-01","priority":"P3","rank":23,"score":10,"report_type":"industry","report_type_label":"行业研究","report_type_reason":"报告分析中国住房改革对房地产行业的影响，属于行业研究。","sectors":[{"name_cn":"房地产","name_en":"Real Estate"}],"research_subject":"","executive_summary":"巴克莱认为2026年8月28日中国监管机构公布的住房销售和融资改革是自1994年引入预售、1998-99年设定30年按揭上限及废除福利分房制度以来最重大的住房改革。改革四大支柱包括：1）提高预售门槛、逐步转向现房销售；2）引入主办银行制度，银行全程监督项目融资和现金流；3）按揭期限从30年延长至40年，收紧预售项目按揭放款条件；4）支持上市开发商再融资和并购，扩大REITs、CMBS、ABS及私募房地产基金渠道。核心影响是将开发风险从购房者向开发商和金融体系重新分配——若预售资金缺口完全由债务填补，开发商净杠杆率平均上升约41个百分点。巴克莱基准情景（假设销售无实质复苏）下，行业将呈现结构性高杠杆和低资产周转率运营特征。债券方面增持龙湖、瑞安房地产、中国金茂、绿城。短期对开发商和债券持有人构成信用负面，长期有利于金融稳定和项目交付。","key_findings":["改革将行业从\"开发商信用+购房者出资\"转向\"银行监督+项目制融资\"体系，风险从购房者向开发商和金融体系重新分配","若资金缺口完全由债务填补，开发商净杠杆率平均上升约41个百分点","基准情景（销售无实质复苏）下行业将呈现结构性高杠杆和低资产周转率","债券方面增持龙湖（Longfor '29s YTW 9.1%）、瑞安房地产、中国金茂、绿城"],"content_tags":["macro_policy"],"topics":["住房改革","开发商杠杆","债券投资"],"data_points":[{"metric":"基准情景（资金缺口50%债务+50%股权填补）","value_text":"5个百分点","period":"","basis":"forecast","context":"基准情景（资金缺口50%债务+50%股权填补）：净负债率平均上升约5个百分点，总杠杆平均上升约25%，预测"},{"metric":"不利情景（资金缺口完全由债务填补）","value_text":"41个百分点","period":"","basis":"forecast","context":"不利情景（资金缺口完全由债务填补）：净负债率平均上升约41个百分点，总杠杆平均上升约49%，预测"},{"metric":"龙湖 Longfor '29s中期收益率9.1%","value_text":"29","period":"","basis":"valuation","context":"龙湖 Longfor '29s中期收益率9.1%，估值"},{"metric":"龙湖 Longfor '32s中期收益率9.3%","value_text":"32","period":"","basis":"valuation","context":"龙湖 Longfor '32s中期收益率9.3%，估值"},{"metric":"瑞安房地产 Shui On Land '29s中","value_text":"29","period":"","basis":"valuation","context":"瑞安房地产 Shui On Land '29s中期收益率8.8%，估值"},{"metric":"中国金茂 China Jinmao '29s中期","value_text":"29","period":"","basis":"valuation","context":"中国金茂 China Jinmao '29s中期收益率 蜜雪集团单公司业绩、评级与目标价，属于公司研究。","sectors":[{"name_cn":"主要消费","name_en":"Consumer Staples"}],"research_subject":"","executive_summary":"高盛2026年8月31日发布蜜雪集团业绩回顾，认为公司处于新投资周期转型期，1H26业绩不及预期主要因供应链升级投入、竞争加剧及去年配送补贴高基数。管理层将战略重心从门店扩张速度转向增长质量，未来约3年将密集投资于供应链升级、门店运营和品牌IP，目标实现产品品质和消费体验的世代升级，同时通过规模效应和数字化消化成本，坚持\"提质不提价\"策略。中国蜜雪平均门店销售额1H26同比下滑双位数，门店扩张放缓为长期战略转变；海外越南/印尼调整导致1H26净关店，但积极效果已现，预计2027年恢复积极开店。高盛下调2026-28E盈利预测16-20%，目标价从HK$450大幅下调至HK$285（基于2026E PE 17x，此前24x，反映增长放缓），但维持买入评级，认为更弱的盈利展望已反映在股价中（过去6个月下跌41%），产品品质、数字化运营和品牌建设将巩固长期护城河。管理层对茶咖融合持积极态度，通过蜜雪（现磨咖啡，高频日常咖啡）和幸运咖（专业多元化咖啡）双品牌布局。","key_findings":["1H26业绩不及预期，管理层进入约3年新投资周期，优先保障增长质量而非门店扩张速度","供应链升级（鲜奶、短保咖啡豆、现磨咖啡机）覆盖>6,000家门店，目标2028年全国覆盖","高盛下调2026-28E盈利预测16-20%，目标价从HK$450降至HK$285（PE 24x→17x）","维持买入评级，认为股价已反映更弱盈利展望（过去6个月-41%）"],"content_tags":[],"topics":["现制茶饮","业绩回顾"],"data_points":[{"metric":"1H26 EPS Rmb6.45（12/25为R","value_text":"1","period":"","basis":"actual","context":"1H26 EPS Rmb6.45（12/25为Rmb8.64），实际"},{"metric":"中国蜜雪平均门店销售额1H26同比下滑双位数，实","value_text":"1","period":"","basis":"actual","context":"中国蜜雪平均门店销售额1H26同比下滑双位数，实际"},{"metric":"2026E收入Rmb33,950mn（旧预测Rm","value_text":"2026","period":"2026E","basis":"forecast","context":"2026E收入Rmb33,950mn（旧预测Rmb37,678mn），预测"},{"metric":"2027E收入Rmb38,000mn（旧预测Rm","value_text":"2027","period":"2027E","basis":"forecast","context":"2027E收入Rmb38,000mn（旧预测Rmb42,957mn），预测"},{"metric":"2028E收入Rmb42,026mn（旧预测Rm","value_text":"2028","period":"2028E","basis":"forecast","context":"2028E收入Rmb42,026mn（旧预测Rmb48,855mn），预测"},{"metric":"2026E EPS Rmb14.22（旧预测Rm","value_text":"2026","period":"2026E","basis":"forecast","context":"2026E EPS Rmb14.22（旧预测Rmb15.93），预测"}],"entities":["蜜雪集团（Mixue Group","2097.HK）","幸运咖（Lucky Cup）","现制茶饮","现磨咖啡","供应链","数字化运营","品牌IP","中国","越南"],"evidence":[],"reasons":["正文无AI基建相关证据，属于消费行业。","供应链升级、门店扩张等均与AI基础设施无关。"],"ranking_evidence":["1H26业绩不及预期","目标价从HK$450降至HK$285"],"false_positive_checks":["无数据中心相关表述，不存在假阳性。"],"failure_code":"","downloaded":false,"download_href":"","llm_model":"de rt_type_label":"公司研究","report_type_reason":"报告聚焦中远海控单公司业绩、评级与目标价，属于公司研究。","sectors":[{"name_cn":"工业","name_en":"Industrials"}],"research_subject":"","executive_summary":"高盛2026年8月31日发布中远海控2Q26业绩回顾，经常性净利润Rmb75亿（同比+29%/环比+28%），处于市场预期下限，不及预期主因欧线长协占比高达70-75%（正常50-60%），该长约于2025年11-12月谈判时运价仅略高于盈亏平衡线。货运量同比+8.3%跑赢行业（+5%），跨太平洋航线同比+22%表现强劲，但亚欧运价跑输欧洲航线CCFI。公司宣布新增12艘22,000 TEU和6艘3,200 TEU集装箱船订单，订单簿增24%至约150万TEU（相当于现有运力40%），预计2026-2030年交付。尽管2Q26不及预期，高盛上调2026E/2027E净利润预测+30%/+54%，原因包括美国补库需求、欧洲港口拥堵及莱茵河干旱、亚洲极端天气等因素推动运价预测上调，但维持卖出评级，A股目标价Rmb13.30/H股HK$12.30，隐含21-28%下行空间。核心风险为运力过剩、2027/2028年运价大幅下滑预期及红海复航不确定性。","key_findings":["2Q26经常性净利润Rmb75亿，同比+29%，处于市场预期下限，主因欧线长协占比高达70-75%压低短期利润","货运量同比+8.3%跑赢行业，跨太平洋+22%强劲，但亚欧运价跑输行业指数","新增12艘2.2万TEU+6艘3,200TEU船舶订单，订单簿增24%至150万TEU，相当于现有运力40%","尽管2Q26不及预期，高盛因运价预测上调将2026E/2027E净利预测上调+30%/+54%"],"content_tags":["rating_valuation","catalysts_risks"],"topics":["集装箱航运","业绩回顾"],"data_points":[{"metric":"2Q26经常性净利润Rmb75亿，同比+29%，","value_text":"2","period":"","basis":"actual","context":"2Q26经常性净利润Rmb75亿，同比+29%，环比+28%，实际"},{"metric":"剔除一次性收益后经常性净利润约Rmb73亿，同比","value_text":"73亿","period":"","basis":"actual","context":"剔除一次性收益后经常性净利润约Rmb73亿，同比+25%，环比+25%，实际"},{"metric":"欧线长协占比70-75%（正常50-60%），实","value_text":"70","period":"","basis":"actual","context":"欧线长协占比70-75%（正常50-60%），实际"},{"metric":"货运量同比+8.3%，高于行业+5%，实际","value_text":"+8.3%","period":"","basis":"actual","context":"货运量同比+8.3%，高于行业+5%，实际"},{"metric":"跨太平洋运价同比+6.2%/环比+15.0%，实","value_text":"+6.2%","period":"","basis":"actual","context":"跨太平洋运价同比+6.2%/环比+15.0%，实际"},{"metric":"亚欧运价同比+11.8%/环比-0.5%，跑输欧","value_text":"+11.8%","period":"","basis":"actual","context":"亚欧运价同比+11.8%/环比-0.5%，跑输欧洲航线CCFI（同比+13.3%/环比+10.6%），实际"}],"entities":["中远海控（601919.SH","1919.HK）","中远海运港口（1199.HK）","集装箱航运","欧线","跨太平洋航线","亚欧航线","CCFI","SCFI","长协"],"evidence":[],"reasons":["正文无AI基建相关证据，属于航运行业。","运价、订单等均与AI基础设施无关。"],"ranking_evidence":["2Q26经常性净利润Rmb75亿","目标价A股Rmb13.30"],"false_positive_checks":["无数据中心相关表述，不存在假阳性。"],"failure_code":" 按揭、债券/股权融资重启）可部分缓冲冲击。美银首选买入中国海外发展（688 HK）和华润置地（1109 HK），下调越秀地产（123 HK）至跑输大市，维持保利、招商蛇口、万科跑输大市评级。风险包括地价下行不及预期、定价风险、融资成本上升及新开工大幅下滑拖累GDP。","key_findings":["改革将开发商现金回款延迟1.5-2年，2029E行业盈利下降7-25%（假设地价跌10%）","新开工2027年预计下降20-30%，新增住房供应2027-28年较预售模式下降60%","长期加速行业整合，龙头房企利润率提升，首选中国海外发展与华润置地（买入）","地价是最不确定变量，需下降约10-15%才能维持盈利不变"],"content_tags":["supply_demand"],"topics":["房地产预售改革","行业整合","开发商盈利"],"data_points":[{"metric":"动力煤社会库存7月底环比下降6,450万吨至6.","value_text":"7","period":"","basis":"actual","context":"动力煤社会库存7月底环比下降6,450万吨至6.588亿吨，实际"},{"metric":"炼焦煤库存7月底环比下降490万吨至1,350万","value_text":"7","period":"","basis":"actual","context":"炼焦煤库存7月底环比下降490万吨至1,350万吨，实际"},{"metric":"煤炭社会总库存7月环比下降9%至6.72亿吨，实","value_text":"7","period":"","basis":"actual","context":"煤炭社会总库存7月环比下降9%至6.72亿吨，实际"},{"metric":"7月煤炭产量3.43亿吨，同比下降10%，实际","value_text":"7","period":"","basis":"actual","context":"7月煤炭产量3.43亿吨，同比下降10%，实际"},{"metric":"秦皇岛港5,500大卡价格周环比+2.0%至RM","value_text":"5,500","period":"","basis":"actual","context":"秦皇岛港5,500大卡价格周环比+2.0%至RMB 879/吨，实际（截至8月28日）"},{"metric":"山西坑口价（5.5千卡）周环比+1.9%至RMB","value_text":"5.5","period":"","basis":"actual","context":"山西坑口价（5.5千卡）周环比+1.9%至RMB 740/吨，实际（截至8月28日）"}],"entities":["煤炭","动力煤","炼焦煤","电力","原油","天然气","炼油","储能电池","化工品","中国"],"evidence":[],"reasons":["正文聚焦房地产预售改革，无AI基建相关证据","涉及开发商现金流、盈利、评级，但无AI基础设施投资逻辑"],"ranking_evidence":["改革将开发商现金回款延迟1.5-2年，2029E行业盈利下降7-25%","首选中国海外发展与华润置地（买入）"],"false_positive_checks":["无数据中心相关表述，非AI基建"],"failure_code":"","downloaded":false,"download_href":"","llm_model":"deepseek-v4-flash","ranked_at":"2026-09-01T13:53:01.461Z"},{"media_id":"pdf_19ee3075e13eb6fc6b0a6821afb4b957_c0bab767a80ca60c8fc51402edd5f0a37442602265681522","title":"美银-中国基础材料：金属上涨，钢铁利润率与建筑需求走弱-260831.pdf","source_path":"环球研报直通车 / 2026年国际顶级投行研报 / 9月 / 9.1 / 美银-中国基础材料：金属上涨，钢铁利润率与建筑需求走弱-260831.pdf","local_relative_path":"2026/9月/9.1/美银-中国基础材料：金属上涨，钢铁利润率与建筑需求走弱-260831.pdf","saved_path":"/Users/leon/Stock/investment-research-reports/downloads/2026/9月/9.1/美银-中国基础材料：金属上涨，钢铁利润率与   <script>
    const records = JSON.parse(document.getElementById('records').textContent);
    const priorities = ["P0","P1","P2","P3","UNREVIEWED"];
    const state = { search: '', priority: '', date: '', reportType: '', sector: '', local: '' };
    const els = {
      search: document.getElementById('search'),
      priority: document.getElementById('priority'),
      date: document.getElementById('date'),
      reportType: document.getElementById('reportType'),
      sector: document.getElementById('sector'),
      local: document.getElementById('local'),
      groups: document.getElementById('groups'),
      resultCount: document.getElementById('result-count'),
    };
    const escapeHtml = (value) => String(value ?? '').replace(/[&<>"']/g, (char) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
    }[char]));
    const unique = (values) => [...new Set(values.filter(Boolean))].sort((a, b) => String(a).localeCompare(String(b), 'zh-Hans-CN'));
    const addOptions = (el, values) => values.forEach((value) => {
      const option = document.createElement('option');
      option.value = value;
      option.textContent = value;
      el.appendChild(option);
    });
    addOptions(els.priority, priorities.filter((priority) => records.some((record) => record.priority === priority)));
    addOptions(els.date, unique(records.map((record) => record.snapshot_date)).reverse());
    addOptions(els.reportType, unique(records.map((record) => record.report_type_label)));
    addOptions(els.sector, unique(records.flatMap((record) => (record.sectors || []).map((sector) => sector.name_cn))));

    function textBlob(record) {
      return [
        record.title, record.research_subject, record.executive_summary, record.source_path,
        record.report_type_reason,
        ...(record.key_findings || []), ...(record.content_tags || []), ...(record.topics || []),
        ...(record.entities || []), ...(record.reasons || []), ...(record.ranking_evidence || []),
        ...(record.sectors || []).flatMap((sector) => [sector.name_cn, sector.name_en]),
        ...(record.data_points || []).flatMap((point) => [point.metric, point.value_text, point.period, point.context]),
      ].join(' ').toLowerCase();
    }
    function filtered() {
      const query = state.search.trim().toLowerCase();
      return records.filter((record) => {
        if (state.priority && record.priority !== state.priority) return false;
        if (state.date && record.snapshot_date !== state.date) return false;
        if (state.reportType && record.report_type_label !== state.reportType) return false;
        if (state.sector && !(record.sectors || []).some((sector) => sector.name_cn === state.sector)) return false;
        if (state.local === 'yes' && !record.downloaded) return false;
        if (state.local === 'no' && record.downloaded) return false;
        return !query || textBlob(record).includes(query);
      });
    }
    function renderTags(items) {
      return (items || []).map((item) => '<span class="tag">' + escapeHtml(item) + '</span>').join('');
    }
    function renderCard(record) {
      const local = record.downloaded ? '<span class="badge local">本地已有</span>' : '';
      const link = record.download_href ? '<a href="' + escapeHtml(record.download_href) + '">打开本地 PDF</a>' : '尚未下载';
      const findings = record.key_findings.length
        ? '<ul class="findings">' + record.key_findings.map((item) => '<li>' + escapeHtml(item) + '</li>').join('') + '</ul>'
        : '';
      const numbers = record.data_points.length
        ? '<div class="numbers">' + record.data_points.map((point) =>
            '<div class="number"><strong>' + escapeHtml(point.metric) + '</strong>' +
            escapeHtml([point.value_text, point.period, point.basis].filter(Boolean).join(' · ')) +
            (point.context ? '<div>' + escapeHtml(point.context) + '</div>' : '') + '</div>'
          ).join('') + '</div>'
        : '';
      const evidence = record.ranking_evidence.length
        ? '<div class="evidence">排序证据：' + escapeHtml(record.ranking_evidence.join(' / ')) + '</div>'
        : '';
      const failure = record.failure_code ? '<div class="evidence">状态：' + escapeHtml(record.failure_code) + '</div>' : '';
      const sectorNames = (record.sectors || []).map((sector) => sector.name_cn);
      return '<article class="card">' +
        '<div class="rank"><strong>#' + escapeHtml(record.rank ?? '-') + '</strong><span>当日排序</span></div>' +
        '<div><div class="meta"><span class="badge ' + record.priority.toLowerCase() + '">' + escapeHtml(record.priority) + '</span>' +
        local + '<span class="tag">score ' + escapeHtml(record.score ?? '-') + '</span><span class="tag">' + escapeHtml(record.report_type_label) + '</span></div>' +
        '<h3 class="title">' + escapeHtml(record.title) + '</h3>' +
        (record.research_subject ? '<div class="subject">研究主体：' + escapeHtml(record.research_subject) + '</div>' : '') +
        (sectorNames.length ? '<div class="tags">' + renderTags(sectorNames) + '</div>' : '') +
        (record.report_type_reason ? '<div class="reason">类型依据：' + escapeHtml(record.report_type_reason) + '</div>' : '') +
        '<div class="tags">' + renderTags([...(record.content_tags || []), ...(record.topics || [])]) + '</div>' +
        (record.reasons.length ? '<div class="reason">排序理由：' + escapeHtml(record.reasons.join('；')) + '</div>' : '') +
        (record.executive_summary ? '<p class="summary"><strong>IMA 摘要：</strong>' + escapeHtml(record.executive_summary) + '</p>' : '') +
        findings + numbers +
        (record.entities.length ? '<div class="tags">' + renderTags(record.entities) + '</div>' : '') +
        evidence + failure +
        '<div class="path">IMA 路径：' + escapeHtml(record.source_path) + '</div>' +
        '<div class="path">本地路径：' + escapeHtml(record.local_relative_path) + ' · ' + link + '</div></div></article>';
    }
    function render() {
      const rows = filtered();
      els.resultCount.textContent = rows.length;
      const groups = new Map();
      for (const record of rows) {
        if (!groups.has(record.snapshot_date)) groups.set(record.snapshot_date, []);
        groups.get(record.snapshot_date).push(record);
      }
      els.groups.innerHTML = [...groups.entries()].map(([date, dayRows]) => {
        const stats = priorities
          .map((priority) => [priority, dayRows.filter((record) => record.priority === priority).length])
          .filter(([, count]) => count)
          .map(([priority, count]) => '<span class="badge ' + priority.toLowerCase() + '">' + priority + ' ' + count + '</span>')
          .join('');
        return '<section class="day-group"><div class="day-head"><h2>' + escapeHtml(date) + '</h2>' +
          '<div class="day-stats">' + stats + '<span class="tag">合计 ' + dayRows.length + '</span></div></div>' +
          '<div class="cards">' + dayRows.map(renderCard).join('') + '</div></section>';
      }).join('') || '<div class="day-group empty">没有符合筛选条件的研报</div>';
    }
    for (const key of Object.keys(state)) {
      els[key].addEventListener(key === 'search' ? 'input' : 'change', () => {
        state[key] = els[key].value;
        render();
      });
    }
    render();
  </script>
</body>
</html>
