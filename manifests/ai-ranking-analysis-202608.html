盛-全球经济分析：评估当前AI投资节奏-260802.pdf","source_path":"环球研报直通车 / 2026年国际顶级投行研报 / 8月 / 8.3 / 高盛-全球经济分析：评估当前AI投资节奏-260802.pdf","local_relative_path":"2026/8月/8.3/高盛-全球经济分析：评估当前AI投资节奏-260802.pdf","saved_path":"/Users/leon/Stock/investment-research-reports/downloads/2026/8月/8.3/高盛-全球经济分析：评估当前AI投资节奏-260802.pdf","snapshot_date":"2026-08-03","priority":"P0","rank":3,"score":95,"report_type":"other","research_subject":"","executive_summary":"高盛认为，市场惯用的超大规模云厂商（hyperscaler）资本支出预测存在系统性口径偏差，既低估了全球AI资本支出、又高估了美国本土投资，因此通过修正其资本开支测量偏差并整合全球公私及海外AI投资数据，重新估算2026年全球AI投资约1.019万亿美元、美国约5810亿美元，两种交叉校验方法均指向全球约1万亿、美国近6000亿规模。展望上，AI资本支出占GDP比重预计由2026年的美国1.8%、全球0.9%持续升至2028年的美国2.8%、全球1.4%，与历史通用技术建设周期水平一致；领先指标仍稳健，但贸易数据即时预测暗示6—7月增速温和放缓。主要变化来自衡量方法的改进——由基于收入修正转为基于毛利润的实现与预测修正，以规避AI生态内部支出重复计算；驱动因素则来自超大规模厂商、私人AI企业及中国/亚洲/韩国等地企业的资本开支，且近期美国增长越来越多由成本通胀推动。影响路径上，由于口径偏差与AI硬件高进口含量，2026年支出对实际投资和美国GDP水平的提振小于2025年；报告建议用仪表盘监控多项先行指标判断支出增速拐点。催化剂为领先指标强劲与私人AI公司估值高企，风险则包括假设难验证、PPE与融资租赁披露混同导致的重复计算、生态相互依存下的收入端重复计算、短期增速放缓，以及成本通胀稀释真实投资拉动。","key_findings":["在修正超大规模云厂商资本支出口径后，估算2026年全球AI投资约1.019万亿美元、美国约5810亿美元。","毛利润修正法（约1.06万亿美元）与国民账户及贸易数据法（全球约1.002万亿、美国约5450亿）两种交叉验证与首选估算高度一致，综合指向2026年全球约1万亿美元、美国略低于6000亿美元。","常用7940亿美元超大规模云厂商资本支出指标，低估全球AI资本支出约2000亿美元、高估美国投资约2000亿美元。","各方法平均测算，自2022年至2026年底全球累计AI投资将达到约1.8万亿美元。"],"content_tags":["macro_policy"],"topics":["AI资本开支","数据中心","AI基础设施投资","超大规模云厂商"],"data_points":[{"metric":"7940亿美元（2026年，共识预测/估值）——","value_text":"7940亿","period":"2026年","basis":"forecast","context":"7940亿美元（2026年，共识预测/估值）——超大规模云厂商资本支出（截至7月30日）。"},{"metric":"019万亿美元（2026年，预测/估算）——全球","value_text":"019万亿","period":"2026年","basis":"forecast","context":"019万亿美元（2026年，预测/估算）——全球AI投资（高盛调整后）。"},{"metric":"5810亿美元（2026年，预测/估算）——美国","value_text":"5810亿","period":"2026年","basis":"forecast","context":"5810亿美元（2026年，预测/估算）——美国AI投资（高盛调整后）。"},{"metric":"06万亿美元（2026年，预测/估算）——全球A","value_text":"06万亿","period":"2026年","basis":"forecast","context":"06万亿美元（2026年，预测/估算）——全球AI投资（毛利润修正法交叉验证）。"},{"metric":"002万亿美元 / 5450亿美元（2026年，","value_text":"002万亿","period":"2026年","basis":"forecast","context":"002万亿美元 / 5450亿美元（2026年，预测/估算）——全球/美国AI投资（国民账户与贸易数据法交叉验证）。"},{"metric":"接近5000亿美元（截至2026年5月年化，实际","value_text":"5000亿","period":"2026年","basis":"actual","context":"接近5000亿美元（截至2026年5月年化，实际/估算）——美国AI硬件投资（国民账户商品流法，相较2022年水平）。"}],"entities":["公司","机构：高盛（Goldman Sachs）","美国人口普查局","美国经济分析局（BEA）","Haver Analytics","FactSet；分析师 Joseph Briggs","Sarah Dong。","产品","技术：AI基础设施","超大规模数据中心（hyperscaler）"],"evidence":[],"reasons":["全文核心是重新估算全球AI投资规模，明确聚焦AI基础设施资本支出，修正超大规模云厂商资本支出口径，估算2026年全球AI投资约1.019万亿美元，直接对应AI数据中心、服务器等基建投资。"],"ranking_evidence":["通用摘要：高盛通过修正资本开支测量偏差并整合全球公私及海外AI投资数据，重新估算2026年全球AI投资约1.019万亿美元、美国约5810亿美元。","关键结论：在修正超大规模云厂商资本支出口径后，估算2026年全球AI投资约1.019万亿美元、美国约5810亿美元。"],"false_positive_checks":["研报为宏观分析，但核心主题是AI基础设施投资规模，无地产、租赁等假阳性风险。"],"failure_code":"","downloaded":false,"download_href":"","llm_model":"deepseek-v4-pro","ranked_at":"2026-08-03T15:00:09.360Z"},{"media_id":"pdf_19ee3075e13eb6fc6b0a6821afb4b957_235498e1f3b0c1d77c72203587907f507442602265681522","title":"伯恩斯坦-美国多行业与电气设备：轨道数据中心：冷却设备厂商的每兆瓦百万美元价值量机遇-260803.pdf","source_path":"环球研报直通车 / 2026年国际顶级投行研报 / 8月 / 8.3 / 伯恩斯坦-美国多行业与电气设备：轨道数据中心：冷却设备厂商的每兆瓦百万美元价值量机遇-260803.pdf","local_relative_path":"2026/8月/8.3/伯恩斯坦-美国多行业与电气设备：轨道数据中心：冷却设备厂商的每兆瓦百万美元价值量机遇-260803.pdf","saved_path":"/Users/leon/Stock/investment-research-reports/downloads/2026/8月/8.3/伯恩斯坦-美国多行业与电气设备：轨道数据中心：冷却设备厂商的每兆瓦百万美元价值量机遇-260803.pdf","snapshot_date":"2026-08-03","priority":"P0","rank":4,"score":90,"report_type":"other","research_subject":"","executive_summary":"伯恩斯坦从AI基础设施与太空经济交汇处切入，核心论点是轨道数据中心的冷却架构本质上是现有卫星与航天器成熟热控技术的延伸而非全新范式，轨道数据中心可理解为\"以计算AI工作负载为主要任务的改进型卫星\"，因此关键问题不是能否冷却，而是系统如何设计、需要哪些组件、哪些供应商受益。技术路径上，由于轨道无大气、无法对流散热，热量必须依靠红外辐射经\"散热翼\"排入深空，遵循斯特藩-玻尔兹曼定律；芯片级仍通过直接-to-芯片冷板捕获热量并经无水冷却液二级回路输送至可部署散热翼。这一架构使冷水机组、CRAH、冷却塔、干冷器等地面设备基本被淘汰，而冷板、歧管、CDU仍属必需，散热翼则成为全新组件类别。价值量测算是全篇核心：地面液冷约1.3–1.8百万美元/兆瓦，轨道液冷约0.6–0.8百万美元/兆瓦（散热翼价值量不明确、未纳入），且轨道场景的服务附加预计极少甚至为零，叠加SpaceX倾向垂直整合，对现有厂商构成额外压力。结论是轨道数据中心并非近期逆风——预计到2031年仅扩展至全球已安装数据中心总容量约11%（SpaceX自身数据更高），中期不构成对地面冷却基础设施需求的实质威胁，长期影响仍属开放讨论；对NVDA而言数据中心机会仍处早期、上行空间实质存在。","key_findings":["轨道数据中心冷却是现有液冷生态系统的演进而非根本性新范式，本质是大型化的卫星散热器方案。","轨道液冷价值量约为地面液冷的一半（0.6–0.8 vs 1.3–1.8 百万美元/兆瓦），冷水机组、CRAH、RDHx在轨道场景中归零，CDU价值量按设备简化假设降至地面50%。","冷板、歧管、DCIM软件、辅助设备的每兆瓦价值量在地面与轨道场景基本一致，散热翼为新增类别但价值量尚不明确、未计入总额。","中期不构成对地面冷却需求的实质威胁：轨道容量预计到2031年仅占全球已安装数据中心总容量约11%。"],"content_tags":["supply_demand"],"topics":["数据中心冷却","液冷","轨道数据中心","AI基础设施"],"data_points":[{"metric":"每兆瓦冷却设备总价值量（测算/估值）","value_text":"1.3","period":"","basis":"valuation","context":"每兆瓦冷却设备总价值量（测算/估值）：地面液冷 ~1.3–1.8 $M/MW；轨道液冷 ~0.6–0.8 $M/MW。"},{"metric":"分项（地面 vs 轨道，$M/MW，测算）","value_text":"0.45","period":"","basis":"","context":"分项（地面 vs 轨道，$M/MW，测算）：冷水机组 ~0.45–0.55 vs NA；CRAH ~0.04–0.05 vs NA；RDHx ~0.04–0.05 vs NA；CDU ~0.30–0.40 vs ~0.15–0.20；冷板 ~0.20–0.25 vs ~0.20–0.25；歧管 ~0.05–0.10 vs ~0.05–0.10；散热翼 NA vs 不明确；DCIM软件 ~0.05–0.10 vs ~0.05–0.10；辅助设备（含制冷剂）~0.10 vs ~0.10；冗余备抵 ~0.12–0.16 vs ~0.06–0.08（假设10%）。"},{"metric":"物理参数","value_text":"0.92","period":"","basis":"","context":"物理参数：空间散热器发射率ε取 0.92；斯特藩-玻尔兹曼常数 σ = 5.67 × 10⁻⁸ W/m²K⁴（P = ε·σ·T⁴）。"},{"metric":"容量预测","value_text":"2031","period":"2031年","basis":"forecast","context":"容量预测：轨道数据中心到2031年约占全球已安装数据中心总容量 11%（预测；SpaceX自身数据更高）。"},{"metric":"评级与目标价/收盘价（截至2026年7月31日，目标价为估值）","value_text":"368","period":"2026年","basis":"valuation","context":"评级与目标价/收盘价（截至2026年7月31日，目标价为估值）：VRT 跑赢大盘 TP $368 / 收 $241.57；NVT 跑赢大盘 TP $220 / 收 $153.83；TT 跑赢大盘 TP $555 / 收 $454.95；JCI 跑赢大盘 TP $173 / 收 $146.66；CARR 市场表现 TP $78 / 收 $61.81。"},{"metric":"欧洲资本品（同日）","value_text":"330","period":"","basis":"","context":"欧洲资本品（同日）：Schneider 跑赢大盘 TP €330 / 收 €289.60；Legrand 跑赢大盘 TP €170 / 收 €131.40。"}],"entities":["公司：Vertiv（VRT）","nVent（NVT）","Trane（TT）","江森自控（JCI）","Carrier（CARR）","施耐德电气","罗格朗","伊顿（ETN）","英伟达（NVDA）","SpaceX（SPCX）。"],"evidence":[],"reasons":["报告核心论点是轨道数据中心冷却架构，详细测算每兆瓦冷却设备价值量，并对比地面与轨道液冷方案，直接涉及AI数据中心冷却基础设施。","明确讨论冷板、CDU、歧管等液冷组件，以及散热翼等新类别，并关联Vertiv、nVent等冷却设备厂商，属于AI基建投资逻辑。"],"ranking_ev 企业级厂商（CSCO、FFIV）以及传统网络安全厂商（PANW、CRWD、ZS、NTSK、OKTA、SAIL、VNRS）受益更大。影响路径上，AI采用→流量增加驱动网络设备需求、Agent增多驱动身份安全需求、数据中心增多驱动光模块需求，而AI令攻击成本趋近于零则直接放大网络安全支出。主要催化剂是企业侧AI持续落地与开源模型全球化推动边缘算力，主要风险/悬念则是AI原生厂商自建安全能力对传统安全厂商形成替代威胁，以及开源全球化对美中分割的光模块供应链带来额外复杂性。该报告为方向性与结构性判断，未给出具体收入、利润或目标价预测。","key_findings":["AI采用对网络/网络安全生态整体正面，需保护的流量、身份与数据同步增加；北美软件行业观点为\"Attractive\"。","闭源模型胜出→算力集中云端，利好云敞口最大的光模块与云网络厂商（LITE、COHR、ANET）。","开源模型胜出→算力分布至边缘/本地，利好传统企业级网络厂商（CSCO、FFIV）与传统网络安全厂商（PANW、CRWD、ZS、NTSK、OKTA、SAIL、VNRS）。","光模块因存在美/中并行供应链，开源模型的全球化属性会增加复杂性，故闭源路径对光模块更有利。"],"content_tags":[],"topics":["光模块","云网络","网络安全","AI基础设施"],"data_points":[{"metric":"AI使黑客发动攻击的成本趋近于零——定性判断，非","value_text":"","period":"","basis":"forecast","context":"AI使黑客发动攻击的成本趋近于零——定性判断，非精确预测，指向当前及持续状态。"},{"metric":"报告未给出收入、利润、目标价等具体财务预测数字，","value_text":"","period":"","basis":"forecast","context":"报告未给出收入、利润、目标价等具体财务预测数字，核心为方向性/结构性观点。"},{"metric":"披露信息","value_text":"2026","period":"2026年","basis":"","context":"披露信息：截至2026年6月30日，摩根士丹利持有≥1%股权的公司名单包含多家上述覆盖标的（已发生事实）。"},{"metric":"披露信息","value_text":"3","period":"","basis":"forecast","context":"披露信息：未来3个月预计寻求投行服务收费（预期性披露）；过去12个月已提供投行服务/收费（已发生事实）。"}],"entities":["公司（闭源","光模块云网络）：Lumentum（LITE）","Coherent（COHR）","Arista Networks（ANET）。","公司（混合","开源企业网络）：Cisco（CSCO）","F5（FFIV）。","公司（开源","网络安全）：Palo Alto Networks（PANW）","CrowdStrike（CRWD）"],"evidence":[],"reasons":["报告明确讨论AI采用对网络与网络安全生态的影响，指出数据中心增多驱动光模块需求，并具体分析闭源/开源模型对光模块厂商（LITE、COHR）和云网络厂商（ANET）的受益路径。","虽无具体财务预测，但方向性判断直接关联AI数据中心光互联与网络设备需求，属于AI基建投资逻辑。"],"ranking_evidence":["标题：'大摩-网络安全与网络设施：拆解闭源与开源大模型应用对产业链的差异化影响'","通用摘要：'若闭源权重模型胜出，算力和服务将更集中于前沿实验室与云端，云敞口最大的光模块与云网络厂商（LITE、COHR、ANET）受益更明显'","关键结论：'闭源模型胜出→算力集中云端，利好云敞口最大的光模块与云网络厂商（LITE、COHR、ANET）'","数据点：'AI使黑客发动攻击的成本趋近于零——定性判断'"],"false_positive_checks":["报告也涵盖网络安全软件厂商，但光模块与云网络部分明确属于AI基建。"],"failure_code":"","downloaded":false,"download_href":"","llm_model":"deepseek-v4-pro","ranked_at":"2026-08-03T15:00:09.360Z"},{"media_id":"pdf_19ee3075e13eb6fc6b0a6821afb4b957_f3d27f57f2a73a8a107867de0326c23d7442602265681522","title":"高盛-全球策略展望：动量反转、风格轮动与成长股中的价值洼地-260803.pdf","source_path":"环球研报直通车 / 2026年国际顶级投行研报 / 8月 / 8.3 / 高盛-全球策略展望：动量反转、风格轮动与成长股中的价值洼地-260803.pdf","local_relative_path":"2026/8月/8.3/高盛-全球策略展望：动量反转、风格轮动与成长股中的价值洼地-260803.pdf","saved_path":"/Users/leon/Stock/investment-research-reports/downloads/2026/8月/8.3/高盛-全球策略展望：动量反转、风格轮动与成长股中的价值洼地-260803.pdf","snapshot_date":"2026-08-03","priority":"P2","rank":11,"score":50,"report_type":"other","research_subject":"","executive_summary":"高盛的核心判断是，自2025年以来全球股票市场的收益格局已显著拓宽，金融危机后十五年\"美国占优、科技跑赢、成长压倒价值\"的高度分化格局正在瓦解：美股已成为主要地区中表现最弱的一个，日本、亚太与新兴市场（本币计）回报最强；标普500等权重指数自2009年以来首次跑赢市值加权指数超过7.3%，市场集中度问题正在缓解。驱动这一转变的三大因素是经济整体韧性（尤以美欧为甚、中位数股票表现最佳）、并购活动回升（带动关注度从最大市值股扩散、美国小盘股跑赢大盘股）以及近几周动量因子的急剧逆转。更深层的变化在于回报驱动力已从估值扩张切换为盈利增长——政府债务增加、发行量上升与持续通胀推高资本成本，使盈利成为关键驱动，且盈利修正仍在持续上行。科技板块内部出现显著再定价：超大规模企业在ChatGPT问世后资本开支爆炸式增长，侵蚀溢价现金流并迫使其转向债务与股权融资，市场对资本开支回报的焦虑上升，导致美国前五大股票的P/E溢价几近消失（此前自2017年以来持续存在），软件股全球估值溢价从本世纪初近200%降至约20%，领导权由软件转向硬件（存储与芯片）。高盛认为科技不存在估值泡沫但可能存在盈利泡沫（前瞻隐含增长仍远低于互联网泡沫峰值，而10年盈利增长CAGR已远超2000年峰值）；同时资本开支\"超级周期\"叠加政府为能源安全、关键基础设施与国防的借款，为旧经济行业创造新增长机遇，工业板块估值已升至20年区间上方并超越回落至20年均值的科技板块。配置上，多元化回报提升，美国因P/E下降且ROE最具吸引力提供重新介入机会，中国虽ROE为主要市场中唯一低于历史均值者但出口繁荣、估值较低亦提供介入机会，成长股中开始浮现价值洼地。主要风险为硬件（存储、芯片）盈利的周期性与可持续性存疑，以及超大规模资本开支回报不及预期。","key_findings":["回报格局全面拓宽：美股为主要地区中最弱，日本、亚太与新兴市场（本币）回报最强；盈利而非估值扩张成为回报主驱动，且这一趋势将延续。","市场集中度缓解：标普500等权重自2009年以来首次跑赢市值加权超过7.3%，美国前五大股票的P/E溢价几近消失。","科技板块内部风格切换：软件股全球溢价从近200%降至约20%，领导权从软件转向硬件（存储与芯片）；不存在估值泡沫，但可能存在盈利泡沫。","资本开支\"超级周期\"叠加政府在能源安全、关键基础设施与国防上的借款，催生旧经济新机遇；工业板块估值升至20年区间上方并超过已回落至20年均值的科技板块。"],"content_tags":["rating_valuation"],"topics":["全球策略","科技板块","资本开支","硬件"],"data_points":[{"metric":"标普500等权重指数跑赢市值加权指数超过 7.3","value_text":"500","period":"2009年","basis":"actual","context":"标普500等权重指数跑赢市值加权指数超过 7.3%，为自2009年以来首次（实际）。"},{"metric":"美国市值最大五只股票P/E仅略高于其余495只，","value_text":"495","period":"2017年","basis":"actual","context":"美国市值最大五只股票P/E仅略高于其余495只，溢价几近消失（此前自2017年起持续溢价，实际）。"},{"metric":"软件股全球P/E溢价","value_text":"20%","period":"2000年","basis": 3.pdf","source_path":"环球研报直通车 / 2026年国际顶级投行研报 / 8月 / 8.3 / 伯恩斯坦-美国能源与转型：美洲一体化石油公司2026年二季度：论“暴利”一词的滥用-260803.pdf","local_relative_path":"2026/8月/8.3/伯恩斯坦-美国能源与转型：美洲一体化石油公司2026年二季度：论“暴利”一词的滥用-260803.pdf","saved_path":"/Users/leon/Stock/investment-research-reports/downloads/2026/8月/8.3/伯恩斯坦-美国能源与转型：美洲一体化石油公司2026年二季度：论“暴利”一词的滥用-260803.pdf","snapshot_date":"2026-08-03","priority":"P3","rank":31,"score":10,"report_type":"other","research_subject":"","executive_summary":"伯恩斯坦认为“暴利”（windfall）一词被滥用——一体化石油公司作为价格接受者，每年投入数百亿美元资本并承担地缘与周期风险，其盈利波动是正常数学与逻辑结果，不应被简单定性为暴利并加税。2026年Q2两家公司业绩强劲但市场反应平淡，且均倾向用强劲现金流降杠杆而非大幅回馈股东，伯恩斯坦怀疑这是规避监管与舆论压力的谨慎策略。评级上重申 XOM“跑赢大盘”（目标价182美元）并因下游权重高、受益极强炼油利润率而更偏好 XOM；重申 CVX“市场表现”但因 TCO 去瓶颈化上调目标价至209美元。影响路径为美伊、俄乌冲突持续→供应中断与油价高位（9月布伦特接近90美元/桶）→现金流积累支撑回报与去杠杆；催化剂为冲突升级、霍尔木兹局势延续与炼油利润率强势，风险为冲突结束、价格正常化后难以维持超额表现。","key_findings":["一体化石油公司的强劲盈利是周期性与风险承担的正常结果，将其定性为“暴利”并过度征税缺乏合理性。","CVX在EPS和收入上均超预期（分别超7.3%和3.1%），XOM收入超预期12.5%但EPS低于一致预期0.5%。","两家公司均选择用强劲现金流偿债而非大幅增加股东回报，伯恩斯坦怀疑是为规避监管与舆论压力的谨慎策略。","伯恩斯坦重申XOM“跑赢大盘”、CVX“市场表现”，并因TCO去瓶颈化上调CVX目标价至209美元。"],"content_tags":["catalysts_risks","financials"],"topics":["石油天然气","能源转型","地缘政治"],"data_points":[{"metric":"XOM目标价182.00美元、CVX目标价上调至","value_text":"182.00美元","period":"","basis":"valuation","context":"XOM目标价182.00美元、CVX目标价上调至209.00美元（旧204.00美元）（估值）"},{"metric":"CVX EPS/收入超一致预期7.3%/3.1%","value_text":"7.3%","period":"2026Q","basis":"actual","context":"CVX EPS/收入超一致预期7.3%/3.1%；XOM收入超一致预期12.5%、EPS低0.5%（实际，2026Q2）"},{"metric":"XOM 2Q26净债务减少70亿美元；CVX 2","value_text":"2","period":"","basis":"actual","context":"XOM 2Q26净债务减少70亿美元；CVX 2Q26总债务减少84亿美元、年初至今减少37.6亿美元（实际）"},{"metric":"XOM FY26上游产量指引4.9百万桶油当量/","value_text":"26","period":"","basis":"guidance","context":"XOM FY26上游产量指引4.9百万桶油当量/日、资本开支270-290亿美元、股票回购200亿美元（指引，维持不变）"},{"metric":"CVX FY26资本开支指引180-190亿美元","value_text":"26","period":"","basis":"guidance","context":"CVX FY26资本开支指引180-190亿美元（至低端）、二叠纪资本开支低于35亿美元、回购每季度25-30亿美元（指引）"},{"metric":"TCO第三代装置去瓶颈化铭牌产能+60,000桶","value_text":"+60,0 常12%或拖累农村及拖拉机需求，成本压力缓解但未完全传导或迫使选择性涨价并影响大众市场需求，FY27下半年因高基数增速预计放缓。野村维持对M&M、Hyundai India、Ather、TVS、Sona BLW等\"买入\"评级，催化剂包括EV渗透率继续提升、降雨改善与出口恢复，风险在于季风、成本与高基数。","key_findings":["全板块需求强劲：6月PV批发同比+33%、拖拉机+21%、2W约+23%，MHCV略低于预期。","电动化加速：7月EV渗透率PV 7.7%、2W 11.2%，2W EV零售同比+88%至约20.42万辆，处EV拐点。","农村需求存隐忧：降雨量低于正常12%，或拖累拖拉机及大众市场PV/2W需求。","需求动能强于预期，但2HFY27F因高基数增速预计放缓。"],"content_tags":["supply_demand"],"topics":["汽车","电动化"],"data_points":[{"metric":"PV行业批发销量 462k辆（+33% y-y）","value_text":"462","period":"2026年","basis":"actual","context":"PV行业批发销量 462k辆（+33% y-y）——2026年6月，实际（Nomura预测+30%）。"},{"metric":"2W EV零售 ~204.2k辆（+88% y-","value_text":"2","period":"2026年","basis":"actual","context":"2W EV零售 ~204.2k辆（+88% y-y，占行业~11.2%）——2026年7月，实际。"},{"metric":"EV渗透率 PV 7.7%、2W 11.2%——","value_text":"7.7%","period":"2026年","basis":"actual","context":"EV渗透率 PV 7.7%、2W 11.2%——2026年7月，实际。"},{"metric":"降雨量 低于正常12%——截至2026年8月1日","value_text":"12%","period":"2026年","basis":"actual","context":"降雨量 低于正常12%——截至2026年8月1日，实际。"},{"metric":"PV行业FY27F/FY28F增速 ~13%/~","value_text":"27","period":"","basis":"forecast","context":"PV行业FY27F/FY28F增速 ~13%/~6% y-y——预测。"},{"metric":"M&M目标价 4,875（现价3,399，上行+","value_text":"4,875","period":"","basis":"valuation","context":"M&M目标价 4,875（现价3,399，上行+43%，买入）——估值。"}],"entities":["公司：Maruti Suzuki","Tata Motors","M&M","Hyundai India","Royal Enfield","Hero MotoCorp","Escorts","TMCV","VECV","Ather Energy"],"evidence":[],"reasons":["报告分析印度汽车行业需求与电动化，与AI基建无关"],"ranking_evidence":[],"false_positive_checks":["无任何AI基建相关内容"],"failure_code":"","downloaded":false,"download_href":"","llm_model":"deepseek-v4-pro","ranked_at":"2026-08-03T15:00:09.360Z"},{"media_id":"pdf_19ee3075e13eb6fc6b0a6821afb4b957_16dfa5c68ae9578f206c90debb4a2ba57442602265681522","title":"伯恩斯坦-全球奢侈品行业：2026年下半年上游活动监测：复苏曙光未现-260803.pdf","source_path":"环球研报直通车 / 2026年国际顶级投行研报 / 8月 / 8.3 / 伯恩斯坦-全球奢侈品行业：2026年下半年上游活动监测：复苏曙光未现-260803.pdf","local_relative_path":"2026/8月/8.3/伯恩斯坦-全球奢侈品行业：2026年下半年上游活动监测：复苏曙光未现-260803.pdf","saved_path":"/Users/leon/Stock/investment-research-reports/downloads/2026/8月/8.3/伯恩斯坦-全球奢侈品行业：2026年下半年上游活动监测：复苏曙光未现-260803.pdf","snapshot_date":"2026-08-03","priority":"P3","rank":36,"score":5,"report_type":"other","research_subject":"","executive_summary":"伯恩斯坦对全球奢侈品行业上游的2026年下半年监测显示，复苏曙光未现：1H26实际营收略好于预期（+0.6% YoY vs 预期-0.2%）但产量弱于预期（-0.9% vs -0.4%），呈高度分化；2H26E展望谨慎但更趋稳定，加权营收增长预期放缓至-1.4%、产量进一步走弱至-2.7%，但预期分布趋向中间地带。积极信号在于订单簿环比改善并转正至+2.0%（vs 1H26的-2.9%），然而受供应链前置期（面料5-6个月、成衣2-3个月）影响，任何实质性零售复苏最早要到1H27E才显现。投资层面，2Q26财报季呈\"改善中的稳定\"、盈利普遍超预期但管理层指引谨慎，板块较10年均值折价约20%，选股主线偏向高质量标的与自我改善型公司。催化剂包括订单簿持续改善、估值折价吸引资金回流、Richemont珠宝动能、Burberry转型推进、Ferragamo早期拐点；风险为2H26E营收与产量继续走弱、行业全面反弹未现、Hermès短期难乐观、LVMH继任进程隐忧。","key_findings":["上游复苏曙光未现：2H26E营收（-1.4%）和产量（-2.7%）预期继续走弱，行业仍处谨慎稳定环境。","订单簿是积极先行信号：订单增长转正至+2.0%，但受供应链前置期影响，实质传导至零售端最早要到1H27E。","高质量+自我改善是当前选股主线：首选Richemont，偏好Brunello Cucinelli；Burberry转型顺利，Ferragamo处于早期拐点，LVMH介于二者之间。","估值提供安全边际：板块较10年均值折价约20%，叠加科技行情成熟，奢侈品关注度可能回升。"],"content_tags":["rating_valuation","consensus_comparison","guidance","supply_demand"],"topics":["奢侈品","上游供应链","消费"],"data_points":[{"metric":"1H26加权营收增长实际+0.6% YoY（预期","value_text":"1","period":"","basis":"actual","context":"1H26加权营收增长实际+0.6% YoY（预期-0.2%）、产量实际-0.9% YoY（预期-0.4%）（实际）。"},{"metric":"2H26E加权营收增长-1.4%、产量增长-2.","value_text":"2","period":"","basis":"forecast","context":"2H26E加权营收增长-1.4%、产量增长-2.7%、订单簿增长+2.0%（预测）。"},{"metric":"1H26订单簿增长-2.9%（实际）；报订单增长","value_text":"1","period":"","basis":"actual","context":"1H26订单簿增长-2.9%（实际）；报订单增长受访者占比47%（2H26E，vs 1H26的22%）（实际/预测）。"},{"metric":"成衣制造商1H26营收实际-2.0% vs 预期","value_text":"1","period":"","basis":"actual","context":"成衣制造商1H26营收实际-2.0% vs 预期-3.6%（+1.7pts）；女装营收超预期+1.7pts（实际 vs 预期）。"},{"metric":"面料生产商供应链前置期5-6个月、成衣制造商2-","value_text":"5","period":"","basis":"valuation","context":"面料生产商供应链前置期5-6个月、成衣制造商2-3个月（事实）；板块估值较10年均值约20%折价（估值）。"}],"entities":["首选","Brunello Cucinelli（O","EUR 104）","Hermès（O","EUR 2","150）","LVMH（O","EUR 600）","Burberry（O","GBp 1"],"evidence":[],"reason r","research_subject":"","executive_summary":"高盛宏观报告聚焦三件事：①7月政治局会议符合预期且措辞更偏鸽派，明确提出\"加大逆周期调节力度\"；②7月官方PMI显著走弱，制造业与非制造业PMI双双跌破荣枯线，建筑业PMI降至47.0创疫情后新低；③预计7月贸易数据受台风扰动小幅走软。主要变化与驱动在于Q2财政紧缩贡献了增长放缓近半原因，政治局会议承诺加快政府债发行与财政支出，预计Q3财政脉冲转正推动增长反弹，但主要风险在地方执行。影响路径上，财政脉冲转正将支撑增长反弹，出口量Q2稳健增长6.7%、净出口继续拉动实际GDP，而进口量仅增0.6%显示内需疲弱仍需政策发力；6月中国汽车出口首次突破年化1000万辆为亮点。报告为宏观研究，不涉及个股或资产配置评级，催化剂为加速发债与财政支出及潜在进一步宽松，风险为地方政府落实不到位。","key_findings":["政治局会议偏鸽、承诺加快财政支出，预计Q3财政脉冲转正推动增长反弹，但风险在地方落实。","7月制造业PMI 49.2、非制造业PMI 49.0、建筑业PMI 47.0（疫情后新低），经济动能明显走弱。","预计7月贸易小幅走软，出口增速27%→23.9%、进口36%→30.7%；净出口继续主导实际GDP。","6月中国汽车出口首次超年化1000万辆，为出口亮点。"],"content_tags":["macro_policy"],"topics":["宏观","PMI","贸易"],"data_points":[{"metric":"制造业PMI 50.3→49.2（6月→7月）—","value_text":"50.3","period":"","basis":"actual","context":"制造业PMI 50.3→49.2（6月→7月）——实际。"},{"metric":"非制造业PMI 50.2→49.0（6月→7月）","value_text":"50.2","period":"","basis":"actual","context":"非制造业PMI 50.2→49.0（6月→7月）——实际。"},{"metric":"建筑业PMI 47.0（7月）——实际。","value_text":"47.0","period":"","basis":"actual","context":"建筑业PMI 47.0（7月）——实际。"},{"metric":"出口增速 27%（6月实际）→23.9%（7月预","value_text":"27%","period":"","basis":"actual","context":"出口增速 27%（6月实际）→23.9%（7月预测），进口 36%→30.7%——实际/预测。"},{"metric":"出口量增速 6.7%（Q2）、进口量增速 0.6","value_text":"6.7%","period":"","basis":"actual","context":"出口量增速 6.7%（Q2）、进口量增速 0.6%（Q2）——实际。"},{"metric":"汽车出口 年化超1000万辆（6月）——实际。","value_text":"1000万","period":"","basis":"actual","context":"汽车出口 年化超1000万辆（6月）——实际。"}],"entities":["机构：中共中央政治局（7月会议）","中国国家统计局（NBS）","分析机构：高盛全球投资研究（分析师 Hui Shan）。","行业","地区：制造业","建筑业","汽车出口","基建","香港。"],"evidence":[],"reasons":["报告为中国宏观分析，与AI基建无关"],"ranking_evidence":[],"false_positive_checks":["无任何AI基建相关内容"],"failure_code":"","downloaded":false,"download_href":"","llm_model":"deepseek-v4-pro","ranked_at":"2026-08-03T15:00:09.360Z"},{"media_id":"pdf_19ee3075e13eb6fc6b0a6821afb4b957_56d3876e89c083e45ce10e028960f74e7442602265681522","title":"野村-初步速评：日元汇率：美国出手支持日本干预汇市-260802.pdf","source_path":"环球研报直通车 / 2026年国际顶级投行研报 / 8月 / 8.3 / 野村-初 8-03T15:00:09.360Z"},{"media_id":"pdf_19ee3075e13eb6fc6b0a6821afb4b957_0b2dddbf3519428021c58aedfb3115907442602265681522","title":"大摩-亚马逊（AMZN.US）：AWS“70法则”与ROIC兑现-260731.pdf","source_path":"环球研报直通车 / 2026年国际顶级投行研报 / 8月 / 8.2 / 大摩-亚马逊（AMZN.US）：AWS“70法则”与ROIC兑现-260731.pdf","local_relative_path":"2026/8月/8.2/大摩-亚马逊（AMZN.US）：AWS“70法则”与ROIC兑现-260731.pdf","saved_path":"/Users/leon/Stock/investment-research-reports/downloads/2026/8月/8.2/大摩-亚马逊（AMZN.US）：AWS“70法则”与ROIC兑现-260731.pdf","snapshot_date":"2026-08-02","priority":"P0","rank":1,"score":95,"report_type":"other","research_subject":"","executive_summary":"摩根士丹利认为，AWS 在生成式 AI（GenAI）训练与推理的采用时代继续保持领先地位，“AWS 的 70 法则”正体现 GenAI 投资回报率（ROIC）的兑现：AWS 收入同比增速加速约 840 个基点至 36.8%，AI 年化经常性收入（ARR）环比增加 100 亿美元至 250 亿美元（约占 AWS 总 ARR 的 15%），增量利润率剔除一次性项目后升至约 52%、为 4Q24 以来最高，盈利能力创新高。主要变化在于大摩将 2027/2028 财年 EPS 分别上调 2%/3%，将 AWS 2027 年收入增速预测上调至 41%、利润率建模为 40%，并相应将 2027/2028 资本开支上调至 3,250 亿/3,500 亿美元，同时将目标价上调 2% 至 335 美元（约 30% 上行空间），维持 Overweight（增持）评级、行业评级 Attractive。驱动来自产能优化、Bedrock 与核心服务加速、非 AI 收入同步提速，以及 AWS 积压订单达 4,960 亿美元（环比 +1,320 亿、超预期约 200 亿）所强化的多年级增长信心；影响路径上，AWS 2027 年约 1,010 亿美元 EBIT（约占公司整体 EBIT 的 60%）将抵消零售 EBIT 下调，并以约 25 倍 P/E 应用于约 14 美元的 2027/2028 平均 EPS 得出 335 美元目标价（对应约 0.7 倍 PEG，较同业中位 1.3 倍折价约 50%）。催化剂包括积压订单持续增长、AI 负载对非 AI 服务（如 Graviton）的带动、机器人带来的履约/运输成本效率改善及智能体商务兑现；风险则包括一次性能源衍生品收益与关税退税顺风被暂时性宏观燃料及干线运输逆风（净逆风约 5 亿美元）抵消，以及北美零售与商品利润率低于预期。","key_findings":["AWS“70法则”体现 GenAI ROIC 兑现：收入增速加速约 840 个基点至 36.8% 同比，AI ARR 达 250 亿美元（环比 +100 亿），印证其在 GenAI 采用时代的领先地位。","AWS 盈利能力创新高：增量利润率剔除一次性项目后约 52%（4Q24 以来最高），支持超大规模云厂商在 GenAI 推理时代可实现 30%–70%+ 增量利润率的判断。","积压订单超预期达 4,960 亿美元（环比 +1,320 亿，超预期约 200 亿），强化 AWS 多年级持续增长的信心。","零售投资初见成效：履约成本低于预期、机器人部署加速、生鲜月活客户增长超 50%、Alexa for Shopping 用户超 3.5 亿，投资正产生回报。"],"content_tags":["financials"],"topics":["AI数据中心","云基础设施","AWS","GenAI投资回报"],"data_points":[{"metric":"总收入 200,606 百万美元，2Q2026，","value_text":"200,606","period":"2Q2026","basis":"actual","context":"总收入 200,606 百万美元，2Q2026，实际。"},{"metric":"总收入同比增速 19.6%（剔除 tractive）\"评级，亚太地区行业展望正面。本周核心变化来自监管与供给两端：中国新版境外直接投资（ODI）框架正式生效，对外投资和贸易合规要求全面收紧；持续打击\"开票经济\"使不合规企业发票金额同比下降37.7%。行业自律方面，炼焦行业协会因行业亏损呼吁减产30%，市场监管总局拟召开光伏定价合规会议遏制非理性竞争，印尼则在稀土副产品监管明确后恢复NPI等加工矿产品出口。价格端普遍承压，铜铝锌小幅上涨、黄金走强，但锂盐周环比全线下跌2.4%–3.2%、钢价普降、水泥滑0.5%，各钢材品种吨钢毛利估算均为负值，显示钢铁全面亏损。影响路径上，ODI新规抬高出海合规成本，减产与定价合规会议有望支撑焦炭与光伏价格，印尼出口恢复则对全球镍供给形成压制。催化剂包括减产执行、光伏合规会议细则、印尼供给实际影响及ODI细则落地；风险在于钢铁全面亏损扩大、锂价持续下行、海外扩张受抑及光伏价格战能否遏制存疑。","key_findings":["监管环境全面收紧：新版ODI框架生效叠加\"开票经济\"打击，不合规企业发票金额同比下降37.7%。","钢铁行业全面亏损：热轧、冷轧、螺纹钢、中厚板吨钢现货毛利估算均为负值（-133、-145、-192、-16元/吨）。","锂价持续走弱：四大锂盐品种周环比全线下跌2.4%–3.2%。","行业自律行动推进：炼焦协会呼吁减产30%、光伏定价合规会议均为应对亏损与价格战的自救举措。"],"content_tags":["macro_policy"],"topics":["中国材料行业","监管政策"],"data_points":[{"metric":"不合规企业发票金额同比 -37.7%（期间","value_text":"","period":"","basis":"actual","context":"不合规企业发票金额同比 -37.7%（期间：同比；类型：实际）"},{"metric":"炼焦行业协会呼吁减产 30%（类型","value_text":"","period":"","basis":"guidance","context":"炼焦行业协会呼吁减产 30%（类型：指引/行业呼吁）"},{"metric":"上海铜现货 106,150 元/吨，周环比 +0","value_text":"106,150 元","period":"2026-","basis":"actual","context":"上海铜现货 106,150 元/吨，周环比 +0.8%（截至2026-07-31当周；实际）"},{"metric":"上海铝现货 23,630 元/吨，周环比 +1.","value_text":"23,630 元","period":"","basis":"actual","context":"上海铝现货 23,630 元/吨，周环比 +1.9%（当周；实际）"},{"metric":"工业级碳酸锂 138,000 元/吨，周环比 -","value_text":"138,000 元","period":"","basis":"actual","context":"工业级碳酸锂 138,000 元/吨，周环比 -3.2%（当周；实际）"},{"metric":"上海螺纹钢 3,096 元/吨，周环比 -0.8","value_text":"3,096 元","period":"","basis":"actual","context":"上海螺纹钢 3,096 元/吨，周环比 -0.8%；铁矿石中国进口CFR 96 美元/吨，周环比 -2.0%（当周；实际）"}],"entities":["机构","中国炼焦行业协会","国家","地区：中国（大陆）","印度尼西亚","行业：钢铁","煤炭","水泥","玻璃（含光伏玻璃）","基本金属（铜铝锌）"],"evidence":[],"reasons":["报告讨论中国ODI新规、钢铁亏损、锂价下跌等，属于传统材料行业监管与价格监测，与AI基础设施无关。"],"ranking_evidence":["新版ODI框架生效","钢铁行业全面亏损","锂盐周环比全线下跌2.4%–3.2%"],"false_positive_checks":["无数据中心、AI基建相关关键词，纯材料行业政策与价格分析。"],"failure_code":"","downloaded":false,"download_href":"","llm_model":"deepseek-v4-pro","ranked_at":"2026-08-02T16:13:59.528Z"},{"media_id":"pdf_19ee3075e13eb6fc6b0a6821afb4b9 美妆市场约200bps），重申Overweight评级，并将目标价自€450上调至€460（+2%），FY26e集团有机销售增长预期自+5.5%升至+6.0%，EPS自€13.63微调至€13.81。主要变化与驱动来自量价共同支撑的增长、中国高端渠道复苏（Luxe中国H1 +10%）、SAPMENA成为实质增长引擎（H1 +13.8%），以及SG&A节省为更高A&P投入（升至销售32.6%）提供资金而不妨碍利润率扩张。影响路径为\"市场景气→产品创新与电商加速→份额扩张→利润率仍可年升20-30bps→估值上修\"。催化剂包括H2美容刺激计划、电商双倍增速、旅行零售Q4正常化及香氛新品；风险为H2较高比较基数、中国消费信心不均及拉美势头减弱。","key_findings":["欧莱雅H1调整后LFL增长+6.5%，跑赢市场约200bps，增长由量价共同支撑，非纯价格或组合驱动。","增长驱动更具可重复性：中国高端渠道复苏（Luxe中国+10%）、SAPMENA引擎（+13.8%，越南+50%+、印度+17%）、护肤改善、SG&A杠杆支撑A&P扩张。","上调依据充分：FY26e OSG至+6.0%、EPS至€13.81、目标价至€460，维持Overweight。"],"content_tags":["financials","industry_structure"],"topics":["美妆","必需消费品"],"data_points":[{"metric":"调整后LFL增长 +6.5%（2026H1，实际","value_text":"+6.5%","period":"2026H1","basis":"actual","context":"调整后LFL增长 +6.5%（2026H1，实际）"},{"metric":"全球美妆市场增长 约+4.5%（2026H1，管","value_text":"+4.5%","period":"2026H1","basis":"guidance","context":"全球美妆市场增长 约+4.5%（2026H1，管理层估计）；全年 +4%至+5%（2026全年，管理层指引）"},{"metric":"FY26e集团OSG +6.0%（自+5.5%，","value_text":"26","period":"","basis":"forecast","context":"FY26e集团OSG +6.0%（自+5.5%，预测）；EPS €13.81（自€13.63，预测）"},{"metric":"目标价 €460（自€450，估值）；当前股价","value_text":"460","period":"2026-","basis":"valuation","context":"目标价 €460（自€450，估值）；当前股价 €394.00（2026-07-30，估值）"},{"metric":"A&P占销售比 32.6%（+70bps，202","value_text":"32.6%","period":"2026H1","basis":"actual","context":"A&P占销售比 32.6%（+70bps，2026H1实际）；毛利率 74.8%（+10bps，2026H1实际）"},{"metric":"正常年份利润率提升 20-30bps（管理层指引","value_text":"20","period":"","basis":"guidance","context":"正常年份利润率提升 20-30bps（管理层指引）"}],"entities":["公司","品牌：欧莱雅（L'Oréal SA","OREP.PA）；CeraVe","La Roche-Posay","Medik8","产品","行业：全球美妆","必需消费品","电商","旅行零售"],"evidence":[],"reasons":["报告聚焦欧莱雅美妆业务，讨论LFL增长、中国高端渠道复苏、利润率扩张等，与AI基础设施无任何关联。"],"ranking_evidence":["调整后LFL增长+6.5%，跑赢全球美妆市场约200bps","中国高端渠道复苏（Luxe中国+10%）","SAPMENA引擎（+13.8%）"],"false_positive_checks":["无数据中心、AI基建相关关键词，纯消费行业报告。"],"failure_code":"","downloaded":false,"download_href":"","llm_model":"deepseek-v4-pro","ranked_at":"2026-08-02T16:13:59.528Z"},{"media_id":"pdf_19ee3075e13eb6fc6b0a6821afb4b957_a28dd480e46698e709b36239ea32d3697442602265681522","title":"巴克莱-中国房地产：契约灵活性的代价：瑞安地产每千美元本金6美元同意费够了吗？-260731.pdf","source_path":"环球研报直通车 / 2026年国际顶级投行研报 / 8月 / 8.2 / 巴克莱-中国房地产：契约灵活性的代价：瑞安地产每千美元本金6美元同意费够了吗？-260731.pdf","local_relative_path":"2026/8月/8.2/巴克莱-中国房地产：契约灵活性的代价：瑞安地产每千美元本金6美元同意费够了吗？-260731.pdf","saved_path":"/Users/leon/Stock/investment-research-reports/downloads/2026/8月/8.2/巴克莱-中国房地产：契约灵活性的代价：瑞安地产每千美元本金6美元同意费够了吗？-260731.pdf","snapshot_date":"2026-08-02","priority":"P3","rank":26,"score":5,"report_type":"other","research_subject":"","executive_summary":"巴克莱评估瑞安地产针对2029年到期债券提出的每千美元本金6美元（0.6%）同意费，认为按亚洲美元债标准并不算低，高于近年多数契约修订费率；但对应的契约让步意义重大——将FCCR计算的合并EBITDA替换为经调整合并EBITDA（加入未并表利润），并将60%利润分红剔除改为55%核心盈利测试，削弱了债权人限制并可能重复计算联营/合营收益。报告维持瑞安地产、龙湖、中国金茂、绿城等房企美元债超配（OW）评级，因其收益率具吸引力且国企背景支撑融资。影响路径为：修订→分红能力上升（FY25测算可派息2.18亿元）→但FCCR修订后仍仅1.4x、低于2.0x门槛→信用约束仍在。催化剂为8月3日同意提交截止日前提案获通过；风险包括大型持有人反对、中国宏观与消费疲弱下投资物业（IP）估值持续下滑削弱抵押价值，以及FY25物业开发收入同比降50%至5亿元。","key_findings":["同意费0.6%（每千美元6美元）高于2026年Vedanta（2.5美元）及瑞安自身2017/2018年（0.35%/0.5%），相对公平但让步偏向发行人。","提案大概率通过：简单多数门槛+同意费经济性，除非大型持有人反对。","修订增加现金外流：分红上限改按核心盈利55%，FY25可派息2.18亿元（3200万美元），现行契约下为零。","FCCR修订后仍不达标：FY25自1.0x改善至1.4x，仍低于2.0x门槛；FY26合规回归不确定。"],"content_tags":["catalysts_risks"],"topics":["中国房地产","债券契约修订"],"data_points":[{"metric":"同意费 USD6/USD1,000本金（0.6%","value_text":"6","period":"2026","basis":"actual","context":"同意费 USD6/USD1,000本金（0.6%）（2026，提案/实际）"},{"metric":"FY25 FCCR 1.0x（原）→1.4x（修","value_text":"25","period":"","basis":"","context":"FY25 FCCR 1.0x（原）→1.4x（修订后）（倍数，FY25，估算）"},{"metric":"FY24 FCCR 2.5x（倍数，FY24，实","value_text":"24","period":"","basis":"actual","context":"FY24 FCCR 2.5x（倍数，FY24，实际）；FCCR测试门槛 2.0x（倍数，契约要求）"},{"metric":"FY25可派息上限 CNY218mn（USD32","value_text":"25","period":"","basis":"","context":"FY25可派息上限 CNY218mn（USD32mn）（FY25，估算）"},{"metric":"FY25合并利润 -CNY1,733mn（FY2","value_text":"25","period":"","basis":"actual","context":"FY25合并利润 -CNY1,733mn（FY25，实际）；核心盈利 CNY397mn（FY25，非GAAP估算）"},{"metric":"FY25 IP重估损失+减值合计 CNY2.2b","value_text":"25","period":"","basis":"actual","context":"FY25 IP重估损失+减值合计 CNY2.2bn（FY25，实际）"}],"entities":["公司：瑞安地产（Shui On Land","SHUION）","龙湖（Longfor","LNGFOR）","中国金茂（CHJMAO）","绿城中国（GRNCH）","丽新发展","Vedanta Resources","行业：中国房地产","亚洲高收益公司债"],"evidence":[],"reasons":["报告讨论瑞安地产债券同意费及契约修订，涉及房地产企业信用分析，与AI基础设施无关。"],"ranking_evidence":["同意费0.6%（每千美元6美元）","FY25 FCCR 1.0x→1.4x","FY25可派息上限 CNY218mn"],"false_positive_checks":["无数据中心、AI基建相关关键词，纯房地产债券分析。"],"failure_code":"","downloaded":false,"download_href":"","llm_model":"deepseek-v4-pro","ranked_at":"2026-08-02T16:13:59.528Z"},{"media_id":"pdf_19ee3075e13eb6fc6b0a6821afb4b957_e930cc13165a2d6bcb5d7f25c77d6f777442602265681522","title":"大摩-美国经济周报：少说多笑，适得其反-260731.pdf","source_path":"环球研报直通车 / 2026年国际顶级投行研报 / 8月 / 8.2 / 大摩-美国经济周报：少说多笑，适得其反-260731.pdf","local_relative_path":"2026/8月/8.2/大摩-美国经济周报：少说多笑，适得其反-260731.pdf","saved_path":"/Users/leon/Stock/investment-research-reports/downloads/2026/8月/8.2/大摩-美国经济周报：少说多笑，适得其反-260731.pdf","snapshot_date":"2026-08-02","priority":"P3","rank":27,"score":5,"report_type":"other","research_subject":"","executive_summary":"大摩指出美联储7月会议维持利率不变，但Warsh主席\"少说\"（不提供经济评估与前瞻指引）的策略适得其反：市场本预期其可能加息以彰显抗通胀决心，结果沟通缺失引发混淆、波动加剧、风险溢价上升及投资者对美联储信心受损。大摩认为该策略不切实际——美联储是市场重要参与者，市场无法脱离对美联储行为的判断而独立解读基本面。基本面方面，2Q美国GDP增长1.5%（q/q saar），1H26仅1.8%，虽温和但国内最终需求稳健；6月PCE通胀弱于预期，指向去通胀延续。大摩维持年内按兵不动、通胀进一步下行的展望，并提示有效关税税率将升至近10%与金融条件收紧风险。影响路径为：美联储沟通收缩→市场波动与美元贬值、盈亏平衡通胀上行→需后续通胀与政策信号验证。催化剂为9月前PCE进一步改善的程度；风险为关税推升有效税率近10%及金融条件收紧。","key_findings":["Warsh\"少说\"策略引发本周市场混淆、波动加剧、风险溢价上升及对美联储信心受挫，暴露该方法缺陷。","美联储是市场重要参与者而非\"裁判\"，市场无法在脱离对美联储判断下给出无滤信号。","2Q GDP 1.5%（saar）、1H26 1.8%虽软，但国内最终需求稳健；6月PCE弱于预期，去通胀延续。","大摩维持年内不加息、进一步去通胀的展望；关注9月前PCE改善幅度对货币政策前景的关键影响。"],"content_tags":["macro_policy"],"topics":["美国经济","美联储政策"],"data_points":[{"metric":"2Q美国GDP增长 1.5%（q/q saar，","value_text":"2","period":"2026Q","basis":"actual","context":"2Q美国GDP增长 1.5%（q/q saar，2026Q2，实际）"},{"metric":"1H26 GDP增长 1.8%（2026上半年，","value_tex 低成本债务+SCREF伙伴分担使结构成立。","香港置地真正价值在于选择权：借此进入新加坡高端零售，复制中环运营模式。","大摩评级分歧明显：会德丰UW、香港置地OW，反映对两者前景不同判断。"],"content_tags":[],"topics":["香港地产","资产交易"],"data_points":[{"metric":"交易对价 11.11亿美元（约67.33亿港元）","value_text":"11.11亿","period":"","basis":"actual","context":"交易对价 11.11亿美元（约67.33亿港元）（实际交易）"},{"metric":"NAV溢价 12%（较2026年6月估值，实际）","value_text":"12%","period":"2026年","basis":"actual","context":"NAV溢价 12%（较2026年6月估值，实际）；账面价值 9.944亿美元（2026年6月，实际）"},{"metric":"一次性收益 10亿港元（预计）；净收益 67亿港","value_text":"10亿","period":"","basis":"forecast","context":"一次性收益 10亿港元（预计）；净收益 67亿港元（预计）"},{"metric":"负债率 17.2%→14%（2025年12月→完","value_text":"17.2%","period":"2025年","basis":"actual","context":"负债率 17.2%→14%（2025年12月→完成后，实际→预测）；年利息节省 2亿港元（预测）"},{"metric":"总建筑面积 43,280平方米（实际）；隐含退出","value_text":"43,280","period":"","basis":"actual","context":"总建筑面积 43,280平方米（实际）；隐含退出收益率 3.4%、隐含P/E 36x（估算）"},{"metric":"香港置地AUM 82亿→94亿新元（实际→预测）","value_text":"82亿","period":"","basis":"actual","context":"香港置地AUM 82亿→94亿新元（实际→预测）；预期回报率 8-9% IRR（指引）"}],"entities":["公司：会德丰地产（Wharf REIC","1997.HK）","香港置地（Hongkong Land","HKLD.SI）","SCREF","资产","产品：Wheelock Place（会德丰大厦）","Scott Square","海港城","时代广场"],"evidence":[],"reasons":["报告评估会德丰地产与香港置地的新加坡物业交易，涉及地产估值、负债率等，与AI基础设施无关。"],"ranking_evidence":["交易对价11.11亿美元","NAV溢价12%","负债率17.2%→14%"],"false_positive_checks":["无数据中心、AI基建相关关键词，纯地产交易分析。"],"failure_code":"","downloaded":false,"download_href":"","llm_model":"deepseek-v4-pro","ranked_at":"2026-08-02T16:13:59.528Z"},{"media_id":"pdf_19ee3075e13eb6fc6b0a6821afb4b957_e98729a63bdd84b422ca2aa3edd353e47442602265681522","title":"高盛-宝马集团（BMWG.DE）2026年二季报后模型更新：裁员拨备超预期致汽车板块EBIT小幅下调-260731.pdf","source_path":"环球研报直通车 / 2026年国际顶级投行研报 / 8月 / 8.2 / 高盛-宝马集团（BMWG.DE）2026年二季报后模型更新：裁员拨备超预期致汽车板块EBIT小幅下调-260731.pdf","local_relative_path":"2026/8月/8.2/高盛-宝马集团（BMWG.DE）2026年二季报后模型更新：裁员拨备超预期致汽车板块EBIT小幅下调-260731.pdf","saved_path":"/Users/leon/Stock/investment-research-reports/downloads/2026/8月/8.2/高盛-宝马集团（BMWG.DE）2026年二季报后模型更新：裁员拨备超预期致汽车板块EBIT小幅下调-260 mary":"本篇是高盛对北美AI基础设施项目公告的月度追踪，核心变化是\"GPU回填/兜底计划（GPU backstop programs）\"在Neocloud客群中的采用度明显提升——英伟达向Neocloud客户提供GPU容量的最低收入保障（若容量无法转租给其他客户），以换取超过一定门槛后的收入分成，Firmus与Sharon AI被列为该收入分成与信用支持模式的两个早期主权Neocloud合作伙伴，这一机制通过支撑Neocloud的持续扩张，间接放大了终端客户可获得的算力供给。第二条主线是资本结构与建设模式的变化：Nebius转向轻资产模式，由数据中心开发商、基础设施投资者与区域运营商出资并持有物理资产，自身仅提供系统架构、软件栈与全球销售，从而将增量资本需求压至极低；Meta与BlackRock成立战略合资，共同开发并持有德州El Paso的1GW园区；IREN签下28亿美元新客户合同并上调年度经常性收入目标；沙特、克罗地亚、印尼等主权AI项目同步推进。第三条主线是企业级AI用例从试点走向规模化，星巴克以自研AI辅助工具替换微软、IBM、Oracle的第三方软件以压缩技术预算，Revolut在Nebius云上预训练PRAGMA行为模型并在欺诈识别、信用风险与推荐相关性上取得可量化提升。影响路径上，Neocloud需求强劲直接利好领先AI服务器供应商DELL与SMCI，而企业AI落地扩散则利好面向企业的硬件OEM（DELL、HPE）与IT分销商（SNX、INGM）。催化剂为主权AI项目落地节奏、GPU回填计划的进一步铺开与企业用例外溢；需注意本报告为项目公告汇编，未给出投资评级、目标价或估值倍数，报告本身亦声明所列项目不代表AI基础设施总机会的全貌。","key_findings":["英伟达式GPU回填/兜底机制（最低收入保障＋超额收入分成）正在成为支撑Neocloud扩张的新融资与风险分担范式，Firmus、Sharon AI为早期合作方。","云基础设施建设正走向\"轻资产＋合资\"：Nebius由合作伙伴持有物理资产、自身增量资本需求极小；Meta与BlackRock按20%/80%持股共建El Paso园区。","主权AI是本期项目增量的重要来源，覆盖沙特、克罗地亚、印度尼西亚等多地。","企业AI从概念转向可量化ROI：星巴克以自研替代第三方软件削减预算，Revolut模型带来欺诈捕获与风险识别的具体提升。"],"content_tags":[],"topics":["AI数据中心资本开支","GPU回填/兜底机制","主权AI项目","企业AI落地"],"data_points":[{"metric":"Meta/BlackRock El Paso数据中心","value_text":"1","period":"2028年","basis":"forecast","context":"Meta/BlackRock El Paso数据中心：1GW容量、140亿美元项目，BlackRock基金持股80%、Meta持股20%，租期最长20年（4年初始＋4个5年续期权），2028年起上线——计划/预测"},{"metric":"IREN","value_text":"28亿","period":"2026年","basis":"guidance","context":"IREN：新签客户合同28亿美元；2026年年度经常性收入目标上调至超40亿美元——已签合同/指引"},{"metric":"Sharon AI","value_text":"13.2亿","period":"2027年","basis":"forecast","context":"Sharon AI：13.2亿美元、5年期云服务合同（含9.5亿美元云协议、12.5亿美元容量协议）；总容量132MW（已签约116MW）；至2027年年中部署超62,000块英伟达GPU；澳大利亚72MW采用NVIDIA DSX AI工厂设计，最多40,000块Grace Blackwell GPU；600PB Vast Data存储协议；收入预计2027年上半年启动——已签约/预测"},{"metric":"Galaxy Helios","value_text":"133","period":"2026年Q","basis":"actual","context":"Galaxy Helios：一期133MW关键IT负载交付CoreWeave、15年租约、租金自2026年Q2起算；二期260MW预计2027年上半年交付；园区获批容量1.63GW（可扩至3.6GW）、面积2,200英亩——实际（一期）/预测（二期）"},{"metric":"Pantheon Atlas 分别增长14%、15%与11%，低压变频器增速从一季度4%改善至7%，6月金属切削机床与工业机器人产量分别同比增18.1%与28.1%。外部验证来自日本对华机床订单：6月同比增49.1%（5月为42.7%，剔除汇率影响），且强度广泛分布、电气与精密机械动能最强，正在形成与以往周期类似的\"双峰\"形态。全球层面，7月主要经济体制造业PMI全部位于扩张区间，日本机床订单加速、北美增速回升、欧盟由负转正，日本机器人订单与出口动能稳健，指向工业周期的同步改善。伯恩斯坦对覆盖标的整体维持偏正面评级结构，多数为跑赢大盘，仅埃斯顿为市场表现。","key_findings":["中国工厂自动化维持接近峰值的增速，7月官方制造业PMI回落主要源于高基数与季节性，高技术与装备制造PMI仍在扩张区间，需求端未同步走弱。","二季度核心自动化产品增速普遍加速，交流伺服与CNC同比均达25%，PLC/HMI保持双位数增长，低压变频器边际改善。","日本对华机床订单连续强劲增长且分布广泛，正形成与以往周期类似的\"双峰\"形态，是中国自动化景气的外部佐证。","全球复苏面扩大：美、欧、日制造业PMI同处扩张区间，日本机床订单加速、北美回升、欧盟转正，日本机器人订单与出口动能稳健。"],"content_tags":["supply_demand","rating_valuation","macro_policy"],"topics":["工厂自动化","工业机器人","机床订单","AI基建间接需求"],"data_points":[{"metric":"中国7月PMI","value_text":"49.2","period":"","basis":"actual","context":"中国7月PMI：官方制造业49.2（前值50.3）、生产49.9（前值51.4）、新订单48.5（前值51.2）；高技术制造业53.3（前值53.5）、装备制造业51.4（前值52.5）——实际"},{"metric":"中国二季度自动化产品同比","value_text":"25%","period":"","basis":"actual","context":"中国二季度自动化产品同比：交流伺服＋25%、CNC＋25%（一季度分别为17%、22%）；中大型PLC＋14%、小型PLC＋15%、HMI＋11%；低压变频器＋7%（一季度＋4%）——实际"},{"metric":"中国产量","value_text":"6","period":"","basis":"actual","context":"中国产量：6月金属切削机床＋18.1%、工业机器人＋28.1%（5月分别为＋10.7%、＋27.9%）——实际"},{"metric":"日本对华机床订单","value_text":"6","period":"","basis":"actual","context":"日本对华机床订单：6月同比＋49.1%（5月＋42.7%，剔除汇率影响）——实际"},{"metric":"日本机床订单","value_text":"5","period":"","basis":"actual","context":"日本机床订单：5月同比＋52.7%、环比＋14.9%；日本本土6月同比＋45.5%（5月＋37.3%）；北美剔汇后＋29.4%（5月＋4.2%）；欧盟＋6.7%（5月-13.2%）——实际"},{"metric":"7月主要经济体制造业PMI","value_text":"53.8","period":"","basis":"actual","context":"7月主要经济体制造业PMI：美国53.8、欧元区52.0、日本54.7——实际"}],"entities":["公司：Cognex","发那科（Fanuc）","大族激光","IPG Photonics","基恩士（Keyence）","汇川技术（Inovance）","海康威视（Hikvision）","HDSI（哈默纳科）","亚德客（AirTAC）","SMC"],"evidence":[],"reasons":["报告聚焦亚洲工业科技景气，中国工厂自动化维持高增速，工业机器人产量同比+28.1%，日本对华机床订单同比+49.1%，这些是AI基建上游的间接需求指标。","虽然未直接分析AI数据中心资本开支，但自动化产品（伺服、CNC、PLC）与工业机器人是AI服务器、半导体设备制造的关键支撑，存在可投资的AI基建需求传导。","全球制造业PMI同步扩张，日本机器人订单与出口动能稳健，为AI基建相关工业自动化提供需求背景。"],"ranking_evidence":["标题：伯恩斯坦-亚洲工业科技晴雨表（ 票疲弱妨碍其与中国的AI霸权竞赛。清算事件则体现为韩国KOSDAQ跌至2022年10月低点、韩国最大券商未来资产下跌66%回到2007年7月水平、多只美国散户热门股跌破年内投资者平均成本。矛盾之处在于：即便有鸽派美联储、AI护盘与清算，风险资产仍未出现大涨，美银据此认为风险资产在中期选举前受到压制。资金流上却呈现\"无畏抄底\"，股票、科技与中国股票录得大额甚至创纪录流入，与牛熊指标高位发出的卖出信号形成背离。配置建议是从风险资产撤退或轮动至防御（必需消费）、久期（REITs、小盘、生物科技）与美元，因这些资产较银行、工业、半导体更少暴露于\"无宏观着陆、美联储不加息、AI资本开支不削减、民主党不横扫中期选举\"这一多头共识的证伪风险。","key_findings":["定性为\"信誉事件\"：美联储过度鸽派→金融条件持续收紧→最终被迫激进加息以恢复信誉，收益率在Jackson Hole前趋于上行。","美日韩协调汇率干预是阻断日元崩跌与区域债市传染的关键；并折射出美国为AI竞赛而护盘日韩台股市的政策倾向。","清算已在韩国小盘科技与美国散户热门股中发生，但鸽派＋护盘＋清算三者叠加仍未催出大涨，风险资产在中期选举前受限。","资金流与仓位背离：股票、科技、中国获创纪录级流入，而牛熊指标仍处极端高位，构成风险资产的持续逆风。"],"content_tags":["macro_policy","catalysts_risks"],"topics":["宏观资金流","AI护盘","半导体ETF流入"],"data_points":[{"metric":"年初至今回报","value_text":"45.7%","period":"","basis":"actual","context":"年初至今回报：原油＋45.7%、国际股票＋8.7%、标普500＋8.6%、现金＋2.1%、美元＋1.6%、高收益债＋1.2%、投资级债-1.2%、政府债-2.5%、黄金-5.5%、比特币-26.1%——实际（YTD）"},{"metric":"周度资金流","value_text":"637亿","period":"","basis":"actual","context":"周度资金流：股票＋637亿美元、债券＋125亿美元、现金＋50亿美元、黄金＋13亿美元、加密-4亿美元——实际（当周）"},{"metric":"分项流入","value_text":"58亿","period":"","basis":"actual","context":"分项流入：投资级债＋58亿美元（连续第17周流入）；美国股票＋304亿美元（6周最大）；中国股票＋159亿美元（4周累计624亿美元，史上最大）；韩国股票＋16亿美元；科技＋157亿美元（5周累计685亿美元，史上最大）；半导体ETF＋53亿美元（年初至今530亿美元流入未见逆转，尽管SOX下跌25%）；消费＋6亿美元（9周最大）——实际（当周/滚动区间）"},{"metric":"美银牛熊指标","value_text":"9.6","period":"","basis":"actual","context":"美银牛熊指标：由9.6降至9.4；\"旧口径\"指标为7.4——实际（当期）"},{"metric":"5月26日卖出信号触发以来表现","value_text":"9%","period":"","basis":"actual","context":"5月26日卖出信号触发以来表现：医疗保健＋9%、银行＋8%，对比ACWI-3%、MAGS-8%、SOX-11%、原油-11%、比特币-15%——实际（区间）"},{"metric":"美银私人客户","value_text":"4.5万亿","period":"","basis":"actual","context":"美银私人客户：AUM 4.5万亿美元，股票65.5%、债券17.5%、现金9.7%；股票ETF份额年初至今＋6.1%、近4周＋0.6%、近1周＋0.3%——实际"}],"entities":["美国","日本","美银全球投资策略","市场与指数：KOSDAQ","SOX","ACWI","MAGS","标普500","日本国债（JGB）","美国国债（UST）"],"evidence":[],"reasons":["报告为宏观资金流观察，核心判断是市场经历信誉、干预与清算三重冲击，AI仅作为政策干预动机（AI护盘）被提及，并非投资主线。","提及半导体ETF年初至今530亿美元流入，但未深入分析AI基建需求、供给或业绩传导，仅为资金流数据点。","无AI数据中心资本开支、AI服务器/GPU/ASIC/HBM/先进封装、数据中心 %、融资买入余额高+35%，市场脆弱性显著上升，若叠加日元升值可能重演2024年式动量反转（当时TOPIX回撤-24%）。高盛结论：宏观已不同于2024年夏，但需警惕回调。","key_findings":["一季度业绩普遍超预期：60%正面、25%负面；金融业意外幅度最大（经常利润超预期86%），混合净利润同比超预期高出4个百分点。","全年指引上调势头强：11%已公布公司上调，上调/下调家数29:3，制造业上调幅度最大（+9.5%）。","市场对2024年式抛售重演担忧升温，但高盛认为宏观环境已不同，主要脆弱点在AI相关持仓极度拥挤。","高盛维持上行目标：3/6/12个月TOPIX 4,200/4,300/4,500点。"],"content_tags":["supply_demand","macro_policy"],"topics":[],"data_points":[{"metric":"TOPIX现价","value_text":"4,003.30","period":"","basis":"actual","context":"TOPIX现价：4,003.30（实际，当周-0.2%）；日经225：64,362.02（实际，当周-0.4%）"},{"metric":"TOPIX已公布比例","value_text":"261","period":"2026/","basis":"actual","context":"TOPIX已公布比例：261家（按公司数22%、按市值25%）（实际，截至2026/7/30）"},{"metric":"对2024年7-8月抛售最大回撤","value_text":"-24%","period":"2024年","basis":"actual","context":"对2024年7-8月抛售最大回撤：TOPIX -24%（实际历史）"},{"metric":"当前TOPIX较2024年7月","value_text":"+37%","period":"2024年","basis":"actual","context":"当前TOPIX较2024年7月：+37%；日经225：+53%（实际）"},{"metric":"外资累计净流入较2024年抛售前","value_text":"+20%","period":"2024年","basis":"actual","context":"外资累计净流入较2024年抛售前：约+20%（实际）；融资买入余额：+35%（实际）"},{"metric":"当周资金流（7/21-24）","value_text":"3,730亿","period":"","basis":"actual","context":"当周资金流（7/21-24）：外资净买入3,730亿日元、国内机构净买入2,460亿日元、散户净卖出4,870亿日元（实际）"}],"entities":["机构","数据：高盛","东京证券交易所（TSE","JPX）","CFTC；I","B","E","S","东洋经济","FactSet"],"evidence":[],"reasons":["报告为日本市场周报，提及AI相关持仓拥挤，但无AI基建投资逻辑。"],"ranking_evidence":["摘要：'风险预警报告指出AI相关持仓极度拥挤'，但整体为市场策略报告，非AI基建投资分析。"],"false_positive_checks":["无数据中心相关表述。"],"failure_code":"","downloaded":false,"download_href":"","llm_model":"deepseek-v4-pro","ranked_at":"2026-08-01T16:27:54.636Z"},{"media_id":"pdf_19ee3075e13eb6fc6b0a6821afb4b957_a7a6bc41bc42b8b08d45fd7dd65082de7442602265681522","title":"高盛-中国经济研究：2026年二季度投资监测：财政收紧背景下投资动能走弱-260731.pdf","source_path":"环球研报直通车 / 2026年国际顶级投行研报 / 8月 / 8.1 / 高盛-中国经济研究：2026年二季度投资监测：财政收紧背景下投资动能走弱-260731.pdf","local_relative_path":"2026/8月/8.1/高盛-中国经济研究：2026年二季度投资监测：财政收紧背景下投资动能走弱-260731.pdf","saved_path":"/Users/leon/Stock/investment-research-reports/downloads/2026/8月/8.1/高盛-中国经济研究：2026年二季度投资监测：财政收紧背景下投资动能走弱-260731.pdf","snapshot_date":"2026-08-01","priority":"P3","rank":33,"score":15,"report_type":"other","research_subject":"","executive_summary":"高盛的季度投资监测显示，中国固定资产投资在一季度短暂反弹后于二季度大幅回落，且疲弱在各行业间广泛存在；虽然统计局对前期高报数据的\"统计修正\"可能放大了FAI读数波动，但替代指标与财政数据同样指向投资动能放缓。核心驱动是财政立场的收紧：一季度强劲的GDP与出口韧性削弱了高层加码宽松的紧迫性，地方官员在政治换届、反腐高压与问责风险下趋于保守，二季度政府债券发行与资金支出明显放缓，土地出让、政策性银行支持（PSL与债券净发行双降）等预算外渠道收缩幅度大于往常，财政脉冲在不利时点转负。影响路径上，高盛估算负面财政脉冲贡献了二季度实际GDP环比年化增速由5.3%放缓至3.6%的近一半；同时地方楼市放松政策节奏放缓，房地产活动继续收缩，多数指标较2020—21年峰值下降60—80%，新开工降幅甚至超过全球金融危机期间的美国住房低迷，房价跌幅略大于全球\"大型住房萧条\"的平均水平。结构上，国企与非国企、内陆高债务省份与沿海地区、高科技产业与其他行业之间的分化持续，FAI波动主要来自建筑安装工程，设备购置贡献仍为正。据此高盛下调2026年预测。催化剂方面，7月政治局会议要求\"加大逆周期调节力度、更大力度扩大国内需求和优化供给\"，高盛预计未来数月中央与地方将加快债券发行与资金使用、推进约8,000亿元新政策性金融工具，并保留年内进一步宽松空间；上行风险来自额外预算外资金与新的需求侧措施，下行风险则是中央层面持续自满与地方实施约束加剧。","key_findings":["二季度投资动能全面走弱，且弱势跨行业普遍存在，替代指标与财政数据相互印证，并非单纯统计修正所致。","财政脉冲转负是主因，贡献了二季度GDP环比年化增速放缓幅度的近一半。","房地产仍在深度收缩，多数活动指标较2020—21年峰值下降60—80%，新开工降幅已超过美国次贷危机时期。","三重分化持续：国企强于非国企、沿海强于内陆高债务省份、高科技投资跑赢其他领域。"],"content_tags":["macro_policy","financials","catalysts_risks"],"topics":["中国固定资产投资","财政政策","房地产收缩"],"data_points":[{"metric":"实际投资增速","value_text":"2025","period":"2025年Q","basis":"actual","context":"实际投资增速：2025年Q4同比＋2.0%、2026年Q1同比＋3.2%、2026年Q2同比＋2.1%——实际"},{"metric":"GDP环比年化增速","value_text":"2026","period":"2026年Q","basis":"actual","context":"GDP环比年化增速：2026年Q1为5.3%、Q2为3.6%——实际"},{"metric":"2026年广义财政赤字（AFD）占GDP比重预测","value_text":"11.5%","period":"2026年","basis":"actual","context":"2026年广义财政赤字（AFD）占GDP比重预测：下调至11.5%（原12.0%，下调0.5个百分点）；2025年实际为11.0%——预测/实际"},{"metric":"2026年固定资本形成总额（GFCF）增速预测","value_text":"2.0%","period":"2026年","basis":"actual","context":"2026年固定资本形成总额（GFCF）增速预测：下调至同比＋2.0%（原＋2.5%）；2025年实际＋1.2%——预测/实际"},{"metric":"财政存款","value_text":"4,100亿","period":"","basis":"actual","context":"财政存款：二季度末余额较去年同期高4,100亿元人民币（约6%）——实际"},{"metric":"新政策性金融工具规模","value_text":"8,000亿","period":"","basis":"","context":"新政策性金融工具规模：约8,000亿元人民币——政策工具规模"}] cutive_summary":"苹果6月季度营收同比增16%至1,094亿美元，iPhone与Mac需求显现韧性（iPhone收入同比+22%、Mac同比+29%），但存储成本持续上行正侵蚀产品利润率，且供应链约束（尤其SoC）加剧。摩根大通对Apple维持“增持”（OW）评级、目标价345美元，对供应链个股持选择性态度，偏好产品线多元的相机镜头供应商玉晶光（3406.TW）与大立光（3008.TW）。主要变化是9月季度指引收入同比仅增9-11%（低于彭博一致预期+12%），受2.5ppt汇率逆风及供应链约束拖累；维持2026年全年iPhone EMS出货预测约2.5亿台（同比持平，低于市场共识）。影响路径为存储涨价→利润率承压→新iPhone潜在涨价带来需求不确定性，并传导为非存储组件成本削减压力；催化剂包括2H26折叠屏iPhone、份额提升、MacBook Neo需求及关税返还，风险为存储成本上行、SoC约束加剧及组件降价压力。","key_findings":["iPhone与Mac需求具韧性，但存储成本上行持续施压供应链毛利率。","维持2026年iPhone EMS出货预测约2.5亿台（同比持平），显著低于市场共识。","2H26 iPhone EMS出货预测1.14亿台（同比-7%），其中新iPhone 18系列（Pro/ProMax/Foldable）合计8,800万台，较2H25的iPhone 17系列低10%。","选股偏好多元相机镜头供应商玉晶光、大立光，对非存储部件降价风险保持谨慎。"],"content_tags":["rating_valuation","supply_demand","macro_policy"],"topics":["苹果供应链","iPhone需求","存储成本"],"data_points":[{"metric":"6月季度总收入US$109,417mn（同比+1","value_text":"6","period":"","basis":"actual","context":"6月季度总收入US$109,417mn（同比+16%、环比-2%）——实际"},{"metric":"6月季度毛利率50.1%（同比+357bps）、","value_text":"6","period":"","basis":"actual","context":"6月季度毛利率50.1%（同比+357bps）、营业利润率32.6%、稀释EPS $2.02（同比+29%）——实际"},{"metric":"9月季度收入指引同比+9-11%（低于彭博+12","value_text":"9","period":"","basis":"actual","context":"9月季度收入指引同比+9-11%（低于彭博+12%），含2.5ppt汇率逆风——指引"},{"metric":"9月季度毛利率指引47%-48%（含+1pt关税","value_text":"9","period":"","basis":"guidance","context":"9月季度毛利率指引47%-48%（含+1pt关税返还）——指引"},{"metric":"2026年iPhone EMS出货约2.5亿台（","value_text":"2026","period":"2026年","basis":"actual","context":"2026年iPhone EMS出货约2.5亿台（同比持平）——预测"},{"metric":"2H26 iPhone EMS出货1.14亿台（","value_text":"2","period":"","basis":"actual","context":"2H26 iPhone EMS出货1.14亿台（同比-7%），3Q26 5,200万台、4Q26 8,500万台——预测"}],"entities":["公司：Apple（AAPL）","Genius Electronic Optical（3406.TW）","Largan Precision（3008.TW）","产品：iPhone 17","18系列（Pro","ProMax","Foldable）","MacBook Neo","iPad","Services"],"evidence":[],"reasons":["报告主题为苹果供应链影响解析，聚焦iPhone与Mac需求、存储成本上行，与AI基础设施无关。","正文无AI数据中心资本开支、AI服务器/GPU/ASIC/HBM/先进封装、数据中心光互联/网络、电力/冷却或人形机器人核心硬件等投资逻辑。","关键结论与摘要均围绕iPhone出货预测、存储成本施压毛利率、供应链约束 Zara）与迅销集团（优衣库）并列为全球服装零售两大结构性赢家，二者以相反路径建立自我强化、难以复制的商业模式：Inditex 以近岸供应链与高 SKU 周转“掌握变化”，迅销以千款核心功能基础款“掌握恒久”，过去 20 年实现 14–19% 年复合股东回报率。Inditex 预计 FY25–FY28 销售 CAGR 约 8%、EBIT 利润率 20–21%，目标 €60、评级 Outperform；迅销预计 FY25–FY27 销售 CAGR 约 15%、营业利润率 19–20%，目标 ¥98,000、评级 Outperform。财务上 Inditex 全面领先（毛利率 58% vs 54%、EBIT 利润率 20% vs 17%、ROIC 50% vs 42%），但迅销估值溢价持续（当前约 42x PE，报告认为参照 Costco 先例尚属合理）。催化剂为两家公司长期跑赢市场的复合增长与模式飞轮；风险在于宏观波动、迅销增长波动性及两者估值较高带来的回调压力。","key_findings":["两家公司是全球服装零售两大结构性赢家，以相反路径建立数十年难复制的自我强化模式，均予 Outperform。","Inditex 预计 FY25–FY28 销售 CAGR 约 8%、EBIT 利润率 20–21%，目标价 €60。","迅销预计 FY25–FY27 销售 CAGR 约 15%、营业利润率 19–20%，目标价 ¥98,000；当前约 42x 估值虽居历史高位但合理。","财务上 Inditex 领先：毛利率 58% vs 54%、EBIT 利润率 20% vs 17%、ROIC 50% vs 42%。"],"content_tags":["rating_valuation"],"topics":[],"data_points":[{"metric":"Inditex 毛利率 58% / 迅销 54%","value_text":"","period":"","basis":"actual","context":"Inditex 毛利率 58% / 迅销 54%：实际"},{"metric":"Inditex EBIT 利润率 20% / 迅销 17%","value_text":"","period":"","basis":"actual","context":"Inditex EBIT 利润率 20% / 迅销 17%：实际"},{"metric":"Inditex ROIC 50% / 迅销 42%","value_text":"","period":"","basis":"actual","context":"Inditex ROIC 50% / 迅销 42%：实际"},{"metric":"Inditex 目标价 €60（现价 €56.46，隐含 +16.4%）","value_text":"","period":"","basis":"valuation","context":"Inditex 目标价 €60（现价 €56.46，隐含 +16.4%）：估值"},{"metric":"迅销目标价 ¥98,000（现价 ¥78,500，隐含 +32.4%）","value_text":"","period":"","basis":"valuation","context":"迅销目标价 ¥98,000（现价 ¥78,500，隐含 +32.4%）：估值"},{"metric":"Inditex FY25–FY28 销售 CAGR 约 8%","value_text":"","period":"","basis":"forecast","context":"Inditex FY25–FY28 销售 CAGR 约 8%：预测"}],"entities":["公司：Inditex（Zara）","迅销集团（优衣库）","H&M","Costco","产品","技术：HEATTECH","AIRism","行业：全球服装零售","快时尚","地区：西班牙"],"evidence":[],"reasons":["报告主题为全球服装零售（Inditex与迅销），与AI基础设施无任何关联。"],"ranking_evidence":["标题：伯恩斯坦-全球零售行业｜日欧零售对决：Inditex vs. 迅销集团：“穿优衣库和Zara的魔鬼”","摘要：Inditex与迅销为全球服装零售两大结构性赢家，讨论供应链、SKU周转、毛利率等，无AI基建内容。"],"false_positive_checks":["无数据中心、AI、半导体等关键词，不存在假阳性风险。"],"failure_code":"","downloaded":f k":56,"score":5,"report_type":"other","research_subject":"","executive_summary":"摩根大通认为市场核心分歧已从\"盈利是否复苏\"转向\"投资驱动的盈利强势能否转化为可见资本回报\"，因盈利质量（投资收益驱动 vs 核心盈利）存疑导致估值折价，但主要险企偿付能力充足（预测Jun-26E寿险核心偿付率110%+、财险170%+，远高于50%监管底线）提供支撑。报告判断8月中下旬业绩期的中期股息超预期（预测行业平均同比+15%）将成为交易逻辑重置催化剂，重塑市场对板块重估；同时H股风险回报显著优于A股（6倍 vs 7倍FY27E P/E、股息率5.1% vs 4.0%、A/H溢价35%），板块偏好寿险优于财险、H股优于A股，首选平安H（目标95港元、+64%），其次中国人寿H、太保H。影响路径上，盈利预喜后市场反应不佳源于净利润对股市高度敏感（上证10%变动→FY26E净利润约45%敏感度），而中期股息若能分配未实现收益将改善信心。风险在于财险再投资风险、2H26市场波动及盈利对股市敏感。","key_findings":["中期股息惊喜是最重要的短期催化剂：预测行业1H26中期股息平均同比+15%，平安H为首选标的。","市场分歧转向资本回报：盈利质量疑虑是关键，偿付能力稳健（寿险110%+/财险170%+）支撑股息分配。","H股显著优于A股：6倍 vs 7倍FY27E P/E、股息率5.1% vs 4.0%、A/H溢价35%。","基本面支撑：寿险NBV预测1H26E平均同比+17%，中国财险1H26E CoR预测94.7%。"],"content_tags":["catalysts_risks","financials"],"topics":[],"data_points":[{"metric":"Rmb 84B，同比+8%——平安集团1H26","value_text":"84","period":"","basis":"actual","context":"Rmb 84B，同比+8%——平安集团1H26 OPAT（核心盈利）——预测（1H26）"},{"metric":"17% oya——1H26E NBV平均增长——","value_text":"17%","period":"","basis":"forecast","context":"17% oya——1H26E NBV平均增长——预测（1H26）"},{"metric":"7%（-0.1pct oya）——中国财险1H2","value_text":"7%","period":"","basis":"forecast","context":"7%（-0.1pct oya）——中国财险1H26E CoR——预测（1H26）"},{"metric":"15% oya——行业1H26中期股息平均增长—","value_text":"15%","period":"","basis":"forecast","context":"15% oya——行业1H26中期股息平均增长——预测（1H26）"},{"metric":"20% oya，Rmb 0.286/股——中国人","value_text":"20%","period":"","basis":"forecast","context":"20% oya，Rmb 0.286/股——中国人寿1H26中期股息增长——预测（1H26）"},{"metric":"7% oya（摩根大通）vs 4% oya（一致","value_text":"7%","period":"","basis":"forecast","context":"7% oya（摩根大通）vs 4% oya（一致预期）——行业FY26 DPS增长——预测/一致预期（FY26）"}],"entities":["公司：中国平安（2318 HK","601318 CH","首选）","中国人寿（2628 HK","601628 CH）","中国太保（2601 HK","601601 CH）","新华保险（1336 HK","601336 CH）","人保集团（1339 HK"],"evidence":[],"reasons":["报告为中国保险行业业绩前瞻，无AI基础设施投资逻辑。"],"ranking_evidence":["标题为'中国保险2026年上半年业绩前瞻'，摘要讨论股息、盈利等，未提及AI基建。"],"false_positive_checks":["无数据中心相关表述。"],"failure_code":"","downloaded":false,"download_hr   <script>
    const records = JSON.parse(document.getElementById('records').textContent);
    const priorities = ["P0","P1","P2","P3","UNREVIEWED"];
    const state = { search: '', priority: '', date: '', reportType: '', local: '' };
    const els = {
      search: document.getElementById('search'),
      priority: document.getElementById('priority'),
      date: document.getElementById('date'),
      reportType: document.getElementById('reportType'),
      local: document.getElementById('local'),
      groups: document.getElementById('groups'),
      resultCount: document.getElementById('result-count'),
    };
    const escapeHtml = (value) => String(value ?? '').replace(/[&<>"']/g, (char) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
    }[char]));
    const unique = (values) => [...new Set(values.filter(Boolean))].sort((a, b) => String(a).localeCompare(String(b), 'zh-Hans-CN'));
    const addOptions = (el, values) => values.forEach((value) => {
      const option = document.createElement('option');
      option.value = value;
      option.textContent = value;
      el.appendChild(option);
    });
    addOptions(els.priority, priorities.filter((priority) => records.some((record) => record.priority === priority)));
    addOptions(els.date, unique(records.map((record) => record.snapshot_date)).reverse());
    addOptions(els.reportType, unique(records.map((record) => record.report_type)));

    function textBlob(record) {
      return [
        record.title, record.research_subject, record.executive_summary, record.source_path,
        ...(record.key_findings || []), ...(record.content_tags || []), ...(record.topics || []),
        ...(record.entities || []), ...(record.reasons || []), ...(record.ranking_evidence || []),
        ...(record.data_points || []).flatMap((point) => [point.metric, point.value_text, point.period, point.context]),
      ].join(' ').toLowerCase();
    }
    function filtered() {
      const query = state.search.trim().toLowerCase();
      return records.filter((record) => {
        if (state.priority && record.priority !== state.priority) return false;
        if (state.date && record.snapshot_date !== state.date) return false;
        if (state.reportType && record.report_type !== state.reportType) return false;
        if (state.local === 'yes' && !record.downloaded) return false;
        if (state.local === 'no' && record.downloaded) return false;
        return !query || textBlob(record).includes(query);
      });
    }
    function renderTags(items) {
      return (items || []).map((item) => '<span class="tag">' + escapeHtml(item) + '</span>').join('');
    }
    function renderCard(record) {
      const local = record.downloaded ? '<span class="badge local">本地已有</span>' : '';
      const link = record.download_href ? '<a href="' + escapeHtml(record.download_href) + '">打开本地 PDF</a>' : '尚未下载';
      const findings = record.key_findings.length
        ? '<ul class="findings">' + record.key_findings.map((item) => '<li>' + escapeHtml(item) + '</li>').join('') + '</ul>'
        : '';
      const numbers = record.data_points.length
        ? '<div class="numbers">' + record.data_points.map((point) =>
            '<div class="number"><strong>' + escapeHtml(point.metric) + '</strong>' +
            escapeHtml([point.value_text, point.period, point.basis].filter(Boolean).join(' · ')) +
            (point.context ? '<div>' + escapeHtml(point.context) + '</div>' : '') + '</div>'
          ).join('') + '</div>'
        : '';
      const evidence = record.ranking_evidence.length
        ? '<div class="evidence">排序证据：' + escapeHtml(record.ranking_evidence.join(' / ')) + '</div>'
        : '';
      const failure = record.failure_code ? '<div class="evidence">状态：' + escapeHtml(record.failure_code) + '</div>' : '';
      return '<article class="card">' +
        '<div class="rank"><strong>#' + escapeHtml(record.rank ?? '-') + '</strong><span>当日排序</span></div>' +
        '<div><div class="meta"><span class="badge ' + record.priority.toLowerCase() + '">' + escapeHtml(record.priority) + '</span>' +
        local + '<span class="tag">score ' + escapeHtml(record.score ?? '-') + '</span><span class="tag">' + escapeHtml(record.report_type) + '</span></div>' +
        '<h3 class="title">' + escapeHtml(record.title) + '</h3>' +
        (record.research_subject ? '<div class="subject">研究主体：' + escapeHtml(record.research_subject) + '</div>' : '') +
        '<div class="tags">' + renderTags([...(record.content_tags || []), ...(record.topics || [])]) + '</div>' +
        (record.reasons.length ? '<div class="reason">排序理由：' + escapeHtml(record.reasons.join('；')) + '</div>' : '') +
        (record.executive_summary ? '<p class="summary"><strong>IMA 摘要：</strong>' + escapeHtml(record.executive_summary) + '</p>' : '') +
        findings + numbers +
        (record.entities.length ? '<div class="tags">' + renderTags(record.entities) + '</div>' : '') +
        evidence + failure +
        '<div class="path">IMA 路径：' + escapeHtml(record.source_path) + '</div>' +
        '<div class="path">本地路径：' + escapeHtml(record.local_relative_path) + ' · ' + link + '</div></div></article>';
    }
    function render() {
      const rows = filtered();
      els.resultCount.textContent = rows.length;
      const groups = new Map();
      for (const record of rows) {
        if (!groups.has(record.snapshot_date)) groups.set(record.snapshot_date, []);
        groups.get(record.snapshot_date).push(record);
      }
      els.groups.innerHTML = [...groups.entries()].map(([date, dayRows]) => {
        const stats = priorities
          .map((priority) => [priority, dayRows.filter((record) => record.priority === priority).length])
          .filter(([, count]) => count)
          .map(([priority, count]) => '<span class="badge ' + priority.toLowerCase() + '">' + priority + ' ' + count + '</span>')
          .join('');
        return '<section class="day-group"><div class="day-head"><h2>' + escapeHtml(date) + '</h2>' +
          '<div class="day-stats">' + stats + '<span class="tag">合计 ' + dayRows.length + '</span></div></div>' +
          '<div class="cards">' + dayRows.map(renderCard).join('') + '</div></section>';
      }).join('') || '<div class="day-group empty">没有符合筛选条件的研报</div>';
    }
    for (const key of Object.keys(state)) {
      els[key].addEventListener(key === 'search' ? 'input' : 'change', () => {
        state[key] = els[key].value;
        render();
      });
    }
    render();
  </script>
